# v2.0.195 (escalation in the prefetch path — completes v2.0.194 by
# covering the second heap-critical gate that the v2.0.194 hardware
# log revealed I'd missed).
#
# THE OBSERVATION (v2.0.194 hardware log):
# v2.0.194 added emergency hygiene escalation to the BG worker
# (tryScheduleBackgroundCacheTask) — drop image cache, font bitmaps,
# width cache, bitmap rows when heap critical, before giving up.
# Hardware test ran TXT-after-TXT through a cp1251 conversion path
# and hit heap-critical at exactly the spot I was targeting:
#     [49545] reader-prefetch-skip: (reason=heap-critical
#             free=35576 largest=9204)
# ...but in `ReaderCacheController::prefetchAdjacentPage`, NOT in
# the BG worker.  So my v2.0.194 escalation never fired.  My v2.0.194
# changelog block boasted about the escalation; the log proved it
# was the wrong location.  Lesson: read the log before claiming the
# fix works.
#
# THE FIX:
# Apply the exact same cascade in `prefetchAdjacentPage`'s heap-
# critical branch.  The branch already cleared resident pages
# (existing pre-v2.0.195 behaviour); we now ALSO drop:
#   * image cache (parallel to v2.0.183 in BG worker)
#   * font streaming bitmap caches (new from v2.0.194 BG worker)
#   * width cache (new from v2.0.194 BG worker)
#   * bitmap row buffers (new from v2.0.194 BG worker)
# Then re-evaluate the gating predicate with the freshly-cleaned
# heap.  If still critical, fall through to the existing skip log.
# If now passable, fall through to the normal prefetch path.
#
# WHY TWO ESCALATIONS (not one shared helper):
# The two heap-critical gates have subtly different gating predicates:
#   * BG worker uses `isHeapCriticalForHotExtend(heap)` (15K/6K)
#   * Prefetch uses `canRunEpubNearPrefetch(heap)` for EPUB,
#     `!isHeapCritical(heap)` for non-EPUB
# A shared helper would either (a) leak the predicate divergence into
# its API, or (b) need to be called twice (once per predicate) with
# different control flow around it.  Pragmatic: inline the cascade
# at both sites with a comment cross-referencing the other.
#
# LOG LINE (new):
#   [PREFETCH] heap-critical escalation: dropped resident + image +
#              font bitmaps + width + bitmap rows
#              (free=X->Y largest=A->B)
# Fires only when at least one of the caches had something to drop
# (heap changes) — silent no-op otherwise.
#
# WHY NOT EXTRACT TO A LIBRARY:
# The escalation is policy code, not mechanism — it makes specific
# choices about which caches are safe to drop reactively (image
# cache: yes, font fonts proper: NO, would force full font reload).
# Pulling it into a separate helper buries those policy decisions
# behind an abstraction; keeping it inline at the gating sites keeps
# the reader-team operator able to grep the BG worker / prefetch
# branches and see exactly what runs there.
#
# CHANGES:
# * src/states/reader/ReaderCacheController.cpp
#   - Added #include "../../FontManager.h" for FONT_MANAGER access
#     (the singleton handle used elsewhere in ReaderState.cpp).
#   - `prefetchAdjacentPage`: changed the heap-critical short-circuit
#     to attempt escalation before logging the skip.  Logs both the
#     escalation (one line, fired only when something was dropped)
#     and the final skip (existing, fires only if still critical
#     after escalation).
#
# Build: clean.  Flash: +~300 B (escalation block).  BSS: 0.
# Heap: 5-30 KB recovered reactively at the right gate this time.

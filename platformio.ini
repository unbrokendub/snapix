# ============================================================
# ARCHITECTURAL FIX #1 — InflateReader 32 KB allocation never fails
# ============================================================
#
# THE STRUCTURAL PROBLEM:
# Every EPUB chapter parse needs a 32 KB CONTIGUOUS heap block for
# uzlib's deflate ring buffer.  The ESP32-C3 has ~167 KB total DRAM,
# of which ~135 KB is BSS (framebuffer + globals).  Heap baseline is
# ~95 KB.  Any usage pattern that drops largest-free below 32 KB
# breaks EPUB reading.  v2.0.170-173 chased one such pattern (FB2 →
# EPUB switch + new EPUB metadata load) but as the user pointed out,
# this was symptom-chasing — the next workload would hit the wall
# elsewhere.
#
# Hardware repro of the persistent failure (v2.0.173):
#   1. Open EPUB1 fresh — works (largest free=73716 at trim time).
#   2. Read several chapters; exit.
#   3. Open FB2; read; exit.
#   4. Open EPUB2 (DIFFERENT file, no cached metadata):
#        [68344] trim free=58824 largest=42996  (still above 32 KB)
#        [68426] InflateReader init failed (largest free=30708)
#      30708 vs 32768 — 2 KB shy.  Fragmentation pinched the largest
#      block between trim and inflate during the ~80 ms parsePages
#      setup window.  Repeats forever, no recovery without reboot.
#
# Looking at it structurally: the heap CANNOT reliably provide 32 KB
# contiguous when (a) 20 KB ReaderAsync stack is pinned, (b) ~25 KB
# of EPUB metadata (CSS rules + spine + TOC) is permanent, (c) the
# usual ~10-15 KB of streaming paginator + caches + bookkeeping are
# in flight, and (d) various transient allocations chunk the
# remaining ~55 KB into pieces smaller than 32 KB.  This is
# DETERMINISTIC heap pressure, not random fragmentation.  Throwing
# more reverts at the cache layer can't fix it.
#
# THE STRUCTURAL FIX:
# The codebase ALREADY HAS the right pattern, hidden in Epub.cpp's
# anonymous namespace: `sharedZipDictBuffer()` returns the
# framebuffer pointer (renderer.getFrameBuffer()), reusing the 48 KB
# always-static display BSS buffer as uzlib's scratch ring buffer.
# It costs ZERO additional memory because the framebuffer is already
# pinned for the display.  It was wired into EPUB METADATA loading
# (5 callers: container, content.opf, NCX, NAV, CSS) but NOT into
# chapter-parse openItemStream or the cover-image readers — those
# still passed dictBuffer=nullptr, forcing uzlib to heap-allocate
# fresh 32 KB per call.
#
# v2.0.174 extends the shared-framebuffer trick to ALL inflate
# operations by making it the implicit default at the Epub:: API
# boundary: when a caller passes dictBuffer=nullptr, the method
# substitutes sharedZipDictBuffer() before calling into ZipFile.
# Concretely:
#   * Epub::readItemContentsToStreamDetailed: nullptr → framebuffer
#   * Epub::openItemStream:                   nullptr → framebuffer
# No callsite changes anywhere — EpubChapterParser's
# `openItemStream(href, 8192, nullptr)` at line 179 now silently
# routes through the framebuffer, eliminating the 32 KB heap request
# at the only place that was still making one during chapter parse.
#
# SAFETY:
# Re-using the framebuffer as decode scratch is safe IFF the display
# isn't reading FROM the framebuffer concurrently.  E-paper holds
# the visible image in panel-side RAM (BW + RED), so the framebuffer
# is only touched during the render→upload bursts that bracket each
# refresh.  Empirically (from the hardware logs of working sessions):
#   * Display refreshes happen at chapter-load START (banner) and END
#     (first page render).
#   * Between those two bursts — exactly the inflate/markerize
#     window — the display is idle and the framebuffer sits unused.
# Risk: a future code change that adds a mid-parse refresh (e.g.,
# animated loading spinner) would corrupt the display for one frame.
# Mitigation if/when that becomes a real problem: add an explicit
# scratch-in-use flag the renderer can check; for now the comment
# block in Epub::openItemStream documents the constraint.
#
# Why this is BETTER than the v2.0.155 attempt at a dedicated 32 KB
# BSS buffer: v2.0.155 added 32 KB of NEW pinned BSS, dropping the
# boot heap from 75800 to 43660.  At that reduced heap budget, other
# operations failed.  v2.0.174 REUSES already-pinned BSS, adding
# zero new permanent footprint.  Same fragmentation immunity,
# without the trade-off.
#
# ============================================================
# ARCHITECTURAL FIX #2 — streaming.cache corruption from "a" mode
# ============================================================
#
# THE STRUCTURAL PROBLEM:
# `UnifiedCache::writeSegmentStreamingDeferred` writes a frame in
# three steps:
#   1. Write frame header at end-of-file with placeholder size=0
#   2. Run writeCb to stream the payload (size discovered only at end)
#   3. Seek back to (frameHdrPos + 4) and write the discovered size
#      to patch the placeholder
# Step 3 REQUIRES that seek+write at an arbitrary file offset
# actually writes at that offset.  This is true for "r+" mode but
# NOT for "a" (append) mode: POSIX O_APPEND semantics force every
# write to be re-positioned at end-of-file atomically, regardless
# of any preceding seek().  Arduino LittleFS implements the same
# semantics.
#
# Hardware repro (v2.0.173, FB2 spine 24 markerize):
#   [52994] markerize done section=26 in=15096 out=13856 chunks=4
#   [53009] ERR Frame at 13708 has size 843579715 that extends past
#                 file (27568)
# Sequence:
#   * File pre-existing at 13700 bytes (5 valid frames from prior session)
#   * writeSegmentStreamingDeferred opens in "a" mode (the previous code)
#   * Writes 8-byte placeholder header at offset 13700 (correct — "a"
#     forces to EOF)
#   * Writes 13856 bytes of payload at offsets 13708-27563 (correct)
#   * f.seek(frameHdrPos + 4) = f.seek(13704) — succeeds as a logical
#     position change
#   * f.write(4 bytes of size value) — "a" mode IGNORES the seek and
#     APPENDS to EOF at offsets 27564-27567
#   * File is now 27568 bytes (4 bytes longer than expected 27564);
#     placeholder size at 13704 STILL reads 0; the 4 size bytes are
#     now garbage trailing the file
# Next loadDirectory: scans frames sequentially.  Hits frame at 13700
# with size=0, advances cursor by 8 (header only).  Next read at
# cursor=13708 lands inside the previous frame's payload, reads 4
# bytes of XHTML content as if they were a size field → 0x32464F23
# = 843579715 bytes, which "extends past file".  Error logged, scan
# halts mid-directory.  Subsequent writes append more garbage; cache
# file grows monotonically with no recovery mechanism.
#
# The v2.0.167 → v2.0.168 fix had narrowed down "use f.position()
# instead of f.size()" but didn't notice that the ENTIRE seek-back
# pattern is incompatible with "a" mode.  v2.0.168 worked only on
# the first-write path (no existing file → opens in "w" mode, where
# seek-back DOES work); the bug only manifests on the SECOND write
# to an existing cache file (open mode flips to "a").  That's why
# v2.0.168 verification passed (single-chapter sessions) but a longer
# session that triggers a second writeSegmentStreamingDeferred for
# the same book hits it.
#
# THE STRUCTURAL FIX:
# Switch from "a" to "r+" mode for the existing-file branch.  "r+"
# is read/write with the cursor at position 0 and NO append flag, so
# subsequent seek+write goes to the seeked offset.  Manually seek
# to end-of-file via `f.seek(f.size())` to get the initial
# append-like behaviour for the placeholder header + payload writes;
# the later seek-back-to-patch then works as intended.
#
# Scoped to writeSegmentStreamingDeferred only — appendFrame uses
# "a" mode too but never seeks back (size is known at write time,
# no placeholder), so it's unaffected and not touched.  Less change
# surface = less risk of breaking the unrelated metrics + idx write
# paths.
#

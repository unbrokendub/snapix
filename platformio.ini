# v2.0.128 (R4.a — persistent page-offset index `.idx` sidecar;
# streaming render skips MEASURE-only walk across sessions):
#
# R3.6 introduced the in-memory `streamOffsetCache_` so navigation
# WITHIN a chapter session was O(1) per page turn after the first
# discovery walk.  But every book-open or chapter change reset
# that cache → every cold visit to a chapter paid the full
# MEASURE-walk cost again (~50-100 ms per page-target page).
#
# R4.a adds an on-disk persistence layer: every `.markers` file
# now has a paired `.idx` sidecar that stores the discovered
# page-boundary table.  Loaded on first render of a spine, saved
# on spine change OR reader exit.
#
# FILE FORMAT (defined in lib/SmolPort/MarkerizedPageRender.h):
#
#   Header (12 bytes):
#     uint32 magic       = 0x58495053 ("SPIX")
#     uint16 version     = 1
#     uint16 configHash  = FNV-1a folded to 16 bits
#     uint16 pageCount
#     uint16 reserved
#
#   Per-entry (8 bytes × pageCount):
#     uint32 byteOffset
#     uint8  styleBits
#     uint8[3] reserved
#
# Total ~812 bytes for a 100-page chapter.  Sub-KB even for the
# longest book chapters.
#
# CONFIG-HASH SEMANTICS:
#
# Page boundaries depend on viewport geometry + font metrics.  If
# the user changes font size, margin, or screen orientation,
# previously-saved .idx files become stale (the captured byte
# offsets would land at different page positions).  The
# `configHash` field detects this — `deserializePageIndex` rejects
# any .idx whose hash doesn't match the current paginator config,
# and ReaderState deletes the stale file on first render.
#
# Hash inputs (FNV-1a over a packed struct):
#   fontId, pageWidth, pageHeight, marginTop, marginBottom,
#   marginLeft, marginRight, bodyLineHeight, headingLineHeight,
#   paragraphSpacing
#
# WHAT LANDED:
#
# (1) `MarkerizedPageRender.h/cpp`:
#       * `computePageIndexConfigHash(cfg, fontId)`
#       * `serializePageIndex(entries, count, hash, outBuf, len)`
#       * `deserializePageIndex(buf, len, expectedHash, outEntries)`
#       * `kPageIndexMagic`, `kPageIndexVersion`, header/entry size
#         constants for buffer pre-sizing in callers.
#
# (2) `MarkerizedPageRenderTest`: 20 new assertions (76/76 total)
#     covering:
#       * Hash differs by fontId / by geometry / deterministic
#       * Round-trip preserves byteOffset + styleBits exactly
#       * Wrong hash → deserialize rejects + clears output
#       * Truncated buffer → rejects
#       * Wrong magic → rejects
#       * Buffer-too-small for serialize → returns 0
#       * Empty index serializes to header-only / deserializes ok
#
# (3) `ReaderState` (under `SNAPIX_MARKERIZED_RENDER`):
#       * Two new members: `streamOffsetCacheIdxPath_` (string) +
#         `streamOffsetCacheConfigHash_` (uint16).
#       * On spine change: write old spine's cache to `.idx`,
#         then try to load new spine's `.idx` (deletes stale).
#       * On reader exit: persist the current spine's cache one
#         last time (catches users who close the book without
#         navigating to a different chapter first).
#       * Atomic write: `.work` file → rename to `.idx`.
#       * Log lines:
#           `[STREAM] idx saved spine=N entries=K path=...`
#           `[STREAM] idx loaded spine=N entries=K`
#           `[STREAM] idx stale/corrupt spine=N (deleted)`
#           `[STREAM] idx saved (exit) spine=N entries=K`
#
# EXPECTED HARDWARE BEHAVIOUR ON SECOND-SESSION BOOK-OPEN:
#
#   * Reader resumes at saved page (e.g. spine=13 page=32 for
#     Гибкий ум).
#   * Look for `[STREAM] idx loaded spine=13 entries=N` — that
#     means the .idx survived from the previous session.
#   * First render of that page: `resume=32 cached=N` (N ≥ 33)
#     directly, no MEASURE walk.  Render-bw should drop from
#     ~700 ms (cold cache walk through 31 pages) to ~60 ms
#     (one-page render with full resume from cache).
#   * Subsequent page turns: still O(1) cache hits as before.
#
# COST:
#
#   * Disk: ~1 KB per chapter on LittleFS.  18-spine book = ~18 KB
#     total in `markers/N.idx` sidecars.  Negligible vs the
#     existing `sections/N.bin` files (5-50 KB each).
#   * RAM (transient during read/write): 4 KB stack buffer + the
#     `streamOffsetCache_` vector that already lived in RAM
#     anyway.  No new heap pressure.
#   * I/O on spine change: one extra LittleFS read (or write)
#     of a sub-KB file.  ~10-30 ms; in noise vs the existing
#     chapter-prepare cost.

# of intended centre.  Meanwhile `textX = bannerX + (bannerW - textWidth)
# / 2` was centered on the banner's true centre (axis 239), so the
# text was 7 px right of the spinner — visibly off-axis.
#
# v2.0.197:
#   1. Compute desired spinner X from banner centre.
#   2. SNAP to nearest 8-pixel boundary (`(x + 4) & ~7`).
#   3. Anchor textX on the SNAPPED spinner centre, not the banner
#      centre.  Spinner and text now line up on the same axis even
#      when bannerW isn't a multiple of 16.

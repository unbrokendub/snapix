# Aggregate savings: 2-9 KB heap freed during book open / reading,
# depending on book contents.  Same lookup performance characteristics
# (binary search for binaryIndex_/manifestIndex is O(log N) same as
# hash lookup; linear scan for peekedSourceDims_ is faster than hash
# for N < ~32).
#
# Pattern used in each conversion (already proven in CssParser.h):
#   * Replace `std::unordered_map<K, V>` with
#     `std::vector<std::pair<K, V>>`.
#   * Build phase: emplace_back (O(1), unsorted).
#   * First lookup: lazy std::sort (O(N log N)), then binary search.
#   * Subsequent lookups: O(log N) via std::lower_bound.
#   * For Fb2::binaryIndex_, the vector is marked `mutable` so the
#     lazy sort can run inside const lookup paths (cacheImage,
#     peekImageDims, decodeImageDirect).
#
# WHY NOT ALSO TARGETING THE OTHER 6 unordered_map INSTANCES:
#   * ImageRenderCache::entries_ — runtime cache, can grow unboundedly;
#     hash lookup wins.
#   * ZipFile::fileStatSlimCache — per-ZIP, can be hundreds of entries;
#     hash lookup wins.
#   * BookMetadataCache::spineHrefIndex — already freed with
#     `unordered_map<...>().swap(...)` after build (line 74); no
#     persistent savings to chase.
#   * ThemeManager::themeCache — ~7-10 themes, but Theme struct is
#     200+ bytes so the ~40 B/entry bucket overhead is only ~400 B
#     savings.  Risk/reward too low.
#
# WHY #2 (BOUNDED COLLECTIONS) WAS SKIPPED:
# Surveyed the obvious candidates (cssFiles_, residentPages_,
# anchorMap_).  For typical EPUB workloads, vectors with N=1-3 are
# SMALLER than std::array<T, MAX> because they only allocate what's
# needed.  Example: 1-CSS EPUB → vector<string>(1) ≈ 64 bytes (vector
# 24 + heap header 16 + string struct 24), vs array<string, 5> = 120
# bytes always.  Bounded collections only win when typical N equals
# max N, which doesn't match the data here.  Specific case analysis:
#   * cssFiles_ typical N=1-2, max ~5 — vector wins.
#   * residentPages_ N=3 fixed, ResidentPage is ~24 bytes — savings
#     would be ~72 bytes inline vs ~88 bytes heap.  Not worth touching.
#   * anchorMap_ currently always empty (see EpubChapterParser comment
#     "always empty; HtmlStripper emits anchor markers but the
#     streaming render path doesn't capture them") — no point bounding
#     a vector that's never populated.
#
# WHY #4 (SLAB ALLOCATOR FOR PAGE BITMAPS) WAS SKIPPED:
# Slab allocator moves heap to BSS — same architectural trap as
# v2.0.177's inflate-buffer BSS attempt.  Page bitmaps are ~3 KB each,
# 3-5 resident at a time → 9-15 KB of heap-to-BSS migration if pooled.
# Reducing heap baseline by 9-15 KB risks the same OOM cascade we just
# fixed by reverting v2.0.177.  Without a thorough hardware test of
# the worst-case workload (multi-CSS EPUB + JPEG instance + FB2 image-
# bearing cold extend) we can't prove the heap budget survives the
# cut.  Defer until we have either (a) proven heap budget headroom
# via other refactors, or (b) a way to measure peak transient heap
# usage in CI/instrumentation.

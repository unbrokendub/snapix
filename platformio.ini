# WHY v2.0.177'S MATH WAS WRONG:
# I claimed "boot heap -32 KB but peak transient -32 KB too → min
# free unchanged".  Three things I missed:
#   1. JPEGDEC instance pins ~25 KB in heap after the first cover
#      decode and stays there for the session.  I waved this off as
#      "already pinned in pre-fix too" — true, but the 25 KB is
#      subtracted from the budget available to OTHER allocations
#      during chapter parse, AFTER the BSS hit.  The post-fix budget
#      for "other transients besides inflate and JPEG-instance" is
#      smaller than I computed.
#   2. The Vaghnye_gody EPUB used for testing has TWO CSS files (43
#      + 39 = 82 rules across two files), 51 spine items, and 27 TOC
#      entries.  Permanent metadata footprint is ~30 KB, not the
#      ~20-25 KB I sized against (which was the single-CSS EPUBs
#      seen earlier in testing).
#   3. FB2 image-bearing sections during cold extend allocate extra
#      in-flight state: image cache entry, paginator workspace, the
#      ParsedText scratch + its eventual spill-write buffer.  That
#      adds ~5-10 KB of transient pressure on top of the markerize
#      work that I sized against.
#
# Summed: my "peak transient" estimate was 32 KB too low.  After the
# BSS allocation took its 32 KB, the math overlapped exactly with
# the actual worst case, and the system tipped over into OOM.

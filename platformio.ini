#   spurious-inter-word-space behaviour at chunk boundaries.  Pre-fix,
#   when "категория" got split as "кате"+"гория" across chunks, the
#   line consumed width("кате") + spaceWidth + width("гория").  Post-
#   fix consumes just width("категория") — slightly less.  Net effect:
#   post-fix paginator packs words slightly tighter, so page
#   boundaries land at DIFFERENT byte offsets.

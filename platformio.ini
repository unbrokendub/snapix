#
# THE STRUCTURAL BUG:
# Two parallel read paths existed for TXT content:
#   * `Txt::readContent(buffer, offset, len)` — knows about the
#     cp1251→UTF-8 cache, routes through LittleFS when set.  Used by
#     downstream code that streams content via the Txt object.
#   * `PlainTextParser::parsePages()` — opens `filepath_` (the
#     ORIGINAL SD path) via `SdMan.openFileForRead("TXT", ...)`,
#     bypassing the Txt object entirely.  Pre-v2.0.189 this was the
#     ONLY path the paginator used.
#
# Pre-v2.0.187 both paths read the same SD source so the divergence
# was invisible.  v2.0.187 forked the `Txt::readContent` path onto
# LittleFS UTF-8 but left `PlainTextParser` untouched — so the
# paginator kept seeing raw cp1251 bytes, the renderer kept producing
# `?`, and the conversion was wasted work.
#
# THE FIX (architectural — not symptom treatment):
# Plumb the Txt object's effective content path + FS choice into
# PlainTextParser so it reads the SAME byte stream that
# `Txt::readContent` would.  Three pieces:
#   1. Txt exposes `getEffectiveContentPath()` and
#      `isContentOnLittleFs()`.  For UTF-8/ASCII sources these
#      return (filepath, false) — identical to pre-v2.0.187
#      behaviour.  For cp1251 sources they return
#      (<cachePath>/utf8.txt, true).
#   2. PlainTextParser gains a `useLittleFs` constructor arg
#      (defaults to false, so the existing Markdown / unit-test /
#      tools callers compile unchanged).  When true,
#      `parsePages()` opens via `LittleFS.open()` instead of
#      `SdMan.openFileForRead()`.
#   3. All 3 TXT-construction sites (background cache, foreground
#      cache, ReaderCacheController) read the effective path + FS
#      choice from `coreRef.content.asTxt()->getTxt()` and forward
#      them to the constructor.
#
# DUAL-FS ABSTRACTION:
# PlainTextParser's loop uses 7 different file-API calls (size,
# position, seek, seekSet, read, available, close).  FsFile (SdFat)
# and Arduino File (FS.h) don't share a base class even though they
# expose identical method names.  Adding `if (useLittleFs_)` at
# every callsite would be 20+ branches scattered through the parse
# loop.  Solution: a small `AnyFile` RAII wrapper in the .cpp's
# anonymous namespace — tagged union holding both file types,
# dispatches on a single bool, closes on destruction (so early-
# return paths can't leak handles).  ~50 lines, zero vtable cost,
# entire parse loop reads `file.size()` etc. unchanged.
#
# WHY NOT FIX THIS BY READING THROUGH `Txt::readContent`?
# `Txt::readContent` opens + closes the file on every call.  The
# parser reads in 4 KB chunks through what could be a 5+ MB file —
# 1000+ open/close pairs per parse pass.  Each `SdMan.openFileForRead`
# call goes through SD card init checks, dir walks, etc.  Keeping
# the file handle open for the duration of `parsePages` (as the
# pre-v2.0.189 code did) is dramatically faster.  The AnyFile
# wrapper preserves that behaviour while letting the FS choice
# travel with the path.
#
# CHANGES:
# * lib/Txt/src/Txt.h — added `getEffectiveContentPath()` +
#   `isContentOnLittleFs()` getters (safe to call before load() —
#   falls back to original filepath / false).
# * lib/PageCache/src/PlainTextParser.h — added `useLittleFs`
#   constructor parameter (default false), `useLittleFs_` member.
# * lib/PageCache/src/PlainTextParser.cpp — added `AnyFile` RAII
#   wrapper, replaced the FsFile open with dual-FS open routing.
# * src/states/ReaderStateAsyncJobs.cpp (2 sites: background cache
#   + foreground cache build), src/states/reader/ReaderCacheController.cpp
#   (1 site) — fetch effective path + FS choice from the Txt
#   object before constructing PlainTextParser.
#
# Build: clean.  Flash: +~400 B (AnyFile wrapper + plumbing).  BSS:
# unchanged.  Heap: unchanged (AnyFile members are stack-resident
# inside parsePages).  Runtime: zero change for UTF-8/ASCII TXT
# files (same SD open path).  For cp1251 TXT files: reads now hit
# the UTF-8 cache on LittleFS, so the screen shows Cyrillic
# characters instead of `?` — which is the entire point of the
# v2.0.187/188/189 series.
#
# v2.0.187 (Windows-1251 cp1251 TXT support).  Russian books from
# royallib.ru, lib.ru and other Cyrillic sites are typically encoded
# as Windows-1251, not UTF-8.  Pre-fix the reader rendered them as
# `?` placeholders because the downstream pipeline assumes UTF-8.
# This release adds detection + on-load conversion to a UTF-8 cache
# file on LittleFS.
#
# THE PROBLEM:
# `Txt::readContent()` reads raw bytes from the SD source and hands
# them to the markerizer / paginator / renderer chain.  All
# downstream code treats input as UTF-8 — when fed cp1251 high-bit
# bytes (0x80-0xFF), they fail UTF-8 validation and end up as the
# replacement character `?` on the screen.  The user's Asimov
# "Человеческий мозг" TXT (from royallib.ru, cp1251) was unreadable.
#
# THE FIX:
# Two-stage approach in Txt::load():
#   1. Sample first 4 KB of the source via detectFileEncoding().  If
#      bytes look like valid UTF-8 (or pure ASCII), no action.
#      Otherwise classify as cp1251.
#   2. For cp1251, generate <cachePath>/utf8.txt by streaming the
#      source through convertCp1251FileToUtf8() — 8 KB read chunks
#      with a 256-entry cp1251→Unicode lookup table + a 3-byte
#      UTF-8 encoder.
#   3. Route subsequent readContent() calls through the UTF-8 cache
#      file on LittleFS instead of the cp1251 source on SD.  Cache
#      validity is tracked via a sibling utf8.size marker (4 bytes
#      holding the source size); cache regenerates whenever the
#      source size changes.
#   4. If a previous session had paginated against a DIFFERENT
#      effective byte stream (size changed → re-conversion), drop
#      sibling pages_*.bin files so the next read re-paginates from
#      the fresh UTF-8 stream.
#
# DETECTION ALGORITHM (heuristic — good enough for plain text):
# Walk the sample bytes.  For each high-bit byte, check it's a
# well-formed UTF-8 lead followed by the expected continuation
# bytes (1-3 byte UTF-8 sequences).  Count invalid sequences.  Pure
# ASCII files (no high bytes) classify as UTF-8.  Files with any
# high bytes AND any invalid UTF-8 sequence classify as cp1251.
# Chunk-boundary partial sequences are carried into the next chunk
# (a 4-byte UTF-8 character split across the 512 B read boundary
# would otherwise false-positive as invalid).
#
# WHAT'S NOT COVERED (deferred):
# * Other Cyrillic encodings (KOI8-R, cp866).  Russian sites mostly
#   use cp1251 these days — both KOI8-R and cp866 would also
#   classify as cp1251 here, producing visible-but-wrong characters
#   instead of the original `?`.  Still a net improvement.
# * Other 8-bit encodings (cp1252 Western European, cp1250 Central
#   European, etc.).  Each would need its own lookup table; we'd
#   need a smarter detector (n-gram language ID?) to pick between
#   them.  Out of scope until users complain about specific
#   non-Russian books.
# * BOM-prefixed UTF-8/UTF-16 detection.  UTF-8 BOM (EF BB BF) is
#   correctly classified as UTF-8 by the existing logic; UTF-16
#   files would currently fall through as `cp1251 → garbage UTF-8`
#   which is bad.  Plain-text UTF-16 is rare for books; defer.
#
# CHANGES:
# * lib/Txt/src/TxtEncoding.h (new) — public API for detection +
#   conversion.
# * lib/Txt/src/TxtEncoding.cpp (new) — 256-byte cp1251 lookup
#   table, UTF-8 encoder, streaming converter with bounded heap
#   (8 KB read + 24 KB write buffers, both on the stack).
# * lib/Txt/src/Txt.h — added `effectiveContentPath_` and
#   `useLittleFsForContent_` members to track active source.
# * lib/Txt/src/Txt.cpp — load() runs detection + conversion;
#   readContent() routes through LittleFS cache when set.
#
# Build: clean.  Flash: +5.9 KB (encoder code + 256 B constexpr
# lookup table).  BSS: unchanged (table is in flash, not RAM).
# Runtime: one-time ~100-300 ms conversion on first cp1251 file
# load (depends on file size); subsequent loads of the same file
# reuse the cache.
#
# v2.0.186 ("копейка рубль бережёт" — two micro-wins: drop the always-

#   back to the same buffer.  Malformed continuation byte sequences
#   caused it to walk past the buffer end and overwrite the next
#   heap block's metadata — the very `multi_heap_free` head pointer
#   that v2.0.185 saw NULL.  With v2.0.189 the parser reads the
#   validated UTF-8 cache file and the normalization stays within
#   bounds.

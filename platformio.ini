# v2.0.168 (CRITICAL fix — v2.0.167 broke EPUB chapter loading completely.
# Symptom from the user's v2.0.167 log:
#
#   [24017] markerize done spine=11 in=78010 out=71018 chunks=20 (UnifiedCache::Markers)
#   [24265] [UCACHE] Format version mismatch in /cache/.../streaming.cache
#                       (found 0, want 1) — wiping
#   [24790] [ERR] parsePages reached end with no streaming output spine=11
#
# Markerize "succeeds" but immediately afterwards the file's version
# field reads 0 instead of 1.  UnifiedCache wipes the file thinking
# it's corrupt; chapter load fails with no fallback; user sees a stuck
# "Loading..." banner that retries forever.
#
# Root cause: in `writeSegmentStreamingDeferred` I used
# `f.size()` to capture the frame header's file offset BEFORE the
# write happened.  Arduino LittleFS's `File::size()` returns the
# ON-DISK size — NOT including buffered (unflushed) writes.  So right
# after `writeFileHeader(f)` wrote 16 bytes to the buffer, `f.size()`
# returned 0 (the pre-write on-disk value), making `frameHdrPos = 0`
# instead of the expected 16.
#
# The frame header bytes themselves got written at the correct
# position (the write cursor was correctly at 16 from f.write
# advancing position).  But when the post-write seek-back patched
# the placeholder size field, it used `frameHdrPos + 4 = 4` — INSIDE
# the file header — overwriting the version field (offset 4-5) with
# the LE payload-size bytes.  For typical payload size ~71 KB, the
# low byte of the size is 0x70, but the user's log shows version=0
# — likely the next call's seek + write landed differently and
# zeroed the bytes.  Either way: corrupt file header → wipe on next
# read → retry → corrupt again → infinite loop.
#
# Fix: replace every `f.size()` call that wants "current write
# cursor" with `f.position()`.  `position()` returns the byte
# count from start that the NEXT write/read will operate on,
# unaffected by LittleFS's write buffering.  Three sites in
# UnifiedCache.cpp:
#   * `appendFrame` (used by writeSegment / removeSegment) — computed
#     payloadOffset wrong, but appendFrame's directory entry gets
#     overwritten by loadDirectory's sequential scan on next open,
#     so this didn't manifest as a user-visible bug (yet — would
#     have if a write was followed by a read on the SAME UnifiedCache
#     instance without re-opening).
#   * `writeSegmentStreamingDeferred` — THE bug that caused the v2.0.167
#     log symptom.  frameHdrPos + payloadStart + payloadEnd all now
#     use f.position().
#   * `writeSegmentStreaming` (size-known-upfront variant, used by
#     none of our current callers but kept symmetric).
#
# The remaining `f.size()` calls (in loadDirectory and after the
# final `f.flush()` in appendFrame / writeSegmentStreamingDeferred)
# are intentional — they read on-disk size after flush, which is
# correct for both reporting and for the directory scan loop.
#
# Side-effects of this fix on already-corrupted caches: any user who
# flashed v2.0.167 has a wiped streaming.cache for the books they
# opened.  v2.0.168 builds it fresh from the next markerize call;
# the legacy markers/ + metrics.bin cleanup in setupCacheDir already
# fired in v2.0.167, so there's no fallback to legacy sidecars
# either.  Effect: first chapter open after v2.0.168 flash will
# re-run markerize (one-time ~15 s cost per chapter, then idx-build
# fast path takes over).
#
# v2.0.167 (architectural — Phase 5 UnifiedCache, part 2 of 2.  Migrates
# the markers + idx sidecars into the same `streaming.cache` file that
# v2.0.166 introduced for metrics, completing the consolidation from
# ~50 files per book (10-50 markers/*.bin + 10-50 markers/*.bin.idx +
# metrics.bin) down to 1.  The Phase 5 entry in the original SmolPort
# README plan is now actually delivered.
#
# WHAT MIGRATED (per-book on first chapter open after upgrade):
#   * `<bookCachePath>/markers/<N>.bin` → UnifiedCache::Markers segment,
#     key = spineIndex (EPUB) or sectionIndex (FB2)
#   * `<bookCachePath>/markers/<N>.bin.idx` → UnifiedCache::Idx segment,
#     same key as the corresponding Markers segment
#   * (v2.0.166 already migrated metrics.bin → UnifiedCache::Metrics)
#
# Producers migrated:
#   * `EpubChapterParser::tryMarkerizeChapter` — writes Markers via
#     `writeSegmentStreamingDeferred` (size discovered after HtmlStripper
#     completes; UnifiedCache patches the frame header's size field
#     post-write)
#   * `EpubChapterParser::parsePages` R4.c idx-build — reads Markers via
#     `openSegmentReader` (with segment-bounded reads to not overrun
#     into neighbouring frames), writes Idx via `writeSegment`
#   * `EpubChapterParser::parsePages` R4.b short-circuit — reads Idx
#     header via `openSegmentReader` (only 12 bytes needed; segmentSize
#     gate skips empty segments)
#   * `Fb2Parser::tryMarkerizeSection` + R4.c + R4.b — same pattern as
#     EPUB, just keyed by sectionIndex instead of spineIndex
#   * `ReaderState::renderPageContents` — reads Markers (streaming) +
#     reads Idx (full segment) during render
#   * `ReaderState::renderPageContents` idx-save side — writes Idx on
#     spine change
#   * `ReaderState::exit` — writes Idx on book close (R4.a persist)
#
# Migration cleanup (one-shot per book on first open after upgrade,
# fires inside `Epub::setupCacheDir` / `Fb2::setupCacheDir`):
#   * Removes the entire `<bookCachePath>/markers/` subtree (10-50 files
#     per book, ~50 KB-1 MB depending on chapter sizes).  Next chapter
#     access rebuilds via UnifiedCache.
#   * Removes `<bookCachePath>/metrics.bin` (was a v2.0.166 carry-over;
#     UnifiedCache::Metrics replaces it).
#
# CONSEQUENCES on disk after upgrade:
#   <bookCachePath>/
#     book.bin           ← metadata cache (unchanged, BookMetadataCache)
#     sections/N.bin     ← page cache (unchanged — separate codepath,
#                                       not in Phase 5 scope)
#     images/<hash>.bmp  ← image cache (unchanged)
#     streaming.cache    ← NEW: holds all markers + idx + metrics
#   /img/<bookHash>/     ← FB2 image cache (unchanged)
#
# File count before (per fully-read 55-section FB2):
#   1 book.bin + 55 sections + 55 markers + 55 idx + 1 metrics + N images
#   = 167 + N files
# File count after:
#   1 book.bin + 55 sections + 1 streaming.cache + N images = 57 + N
# That's a 65% reduction in file count, ~110 fewer LittleFS inodes
# per book.  LittleFS overhead per file is non-trivial (~256 B per
# inode + 4 KB minimum block allocation for files <4 KB — many idx
# files are 200-800 bytes), so this is also a meaningful disk-space
# reduction on books with many small chapters.
#
# Reader-side observable effects:
#   * Book open: one extra fs walk on first open (LittleFS index of
#     streaming.cache) but ~50 fewer fs walks for the per-file caches
#     we don't open anymore.  Net: faster.
#   * Chapter open: same speed as v2.0.166 (markers + idx live in
#     streaming.cache at known offsets; one open, one seek, vs
#     two open + seek for the old markers + idx files).
#   * Background extends: write into streaming.cache append-only; same
#     wall-clock cost as the old `.work` rename pattern; cleaner
#     because there's no rename race.
#
# NEW API IN UnifiedCache (added in v2.0.167):
#   * `writeSegmentStreamingDeferred(kind, key, writeCb)` — for
#     producers that don't know payload size upfront (markerize-from-
#     ZIP).  Writes frame header with placeholder size, runs callback,
#     then seeks back to patch the size field.
#

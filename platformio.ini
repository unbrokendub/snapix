# v2.0.165 (fix — `[CACHE] LUT truncated at entry N of M` warning that
# appeared occasionally in the log after a hot extend.  Symptom from
# v2.0.163 log:
#
#   [34725] [ERR] [CACHE] [CACHE] LUT truncated at entry 0 of 24
#                       (lutOffset=275 file=371) path=.../sections/11.bin
#
# Note the file size (371) is large enough for 24 entries × 4 bytes
# starting at offset 275 — but the reader's `readPodChecked` still
# failed at entry 0.  Root cause: `PageCache::writeLut` writes the
# LUT bytes, then seeks back to update the header (pageCount, isPartial,
# lutOffset), then returns without flushing the write handle.
# LittleFS keeps the writes in its internal buffer.  When a concurrent
# code path opens a fresh `LittleFS.open(path, "r")` handle, the
# reader sees:
#   * The header is partially synced (lutOffset = new value)
#   * The LUT bytes at that offset are NOT yet on flash
# → reader reads garbage / zero / fails.
#
# Fix: one `file_.flush()` call in `writeLut` after all writes complete,
# before returning success.  Cost: ~5-10 ms per hot extend (LittleFS
# erase + program cycle), negligible.  Eliminates the race that
# produced the truncation log.  No behaviour change otherwise — the
# warning was cosmetic in practice (the writer's in-memory `pageLut_`
# was correct, only fresh readers saw the inconsistency) but it could
# theoretically cause a real corruption if the reader believed the
# truncated LUT and rebuilt the cache.
#

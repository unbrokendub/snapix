# v2.0.183 (Proactive lifecycle hygiene on book exit — combined
# release of three more session-scoped caches that v2.0.180's JPEG
# release left untouched.  Same pattern, three more callsites:
# add to ReaderState::exit() the proactive clears for the caches
# that were previously only freed REACTIVELY when heap pressure
# tripped a critical threshold.
#
# THE STRUCTURAL PROBLEM:
# Three caches accumulate state throughout a reading session and stay
# heap-pinned across book switches, even after the user has closed
# the book.  The NEXT book inherits a heap baseline that's already
# 5-20 KB smaller than the fresh-boot ideal.  This is the same class
# of bug v2.0.180 fixed for the JPEGDEC instance; the remaining three
# are smaller individually but matter cumulatively per the user's
# request to "копейка рубль бережёт" — small savings compound.
#
# THE THREE CACHES:
#
# 1. ImageRenderCache (renderer_.imageCache()).
#    unordered_map<string, Entry> where Entry holds decoded bitmap
#    data.  Per the v2.0.52 comment at line 2982:
#      "ImageRenderCache can pin 30+ KB of contiguous heap that
#       fragments the largest-free-block down past the worker's
#       10 KB threshold."
#    Existing reactive clear at line 2999 fires inside the BG worker
#    only when isHeapCritical() trips — too late for the NEXT book's
#    chapter parse, which already inherited the fragmented heap.
#
# 2. Font streaming bitmap caches (FONT_MANAGER.clearStreamingBitmapCaches).
#    Per-glyph bitmap cache for the open .epdfont reader family.
#    Existing reactive call at ReaderStateOverlays.cpp:740 fires
#    inside the page-fill memory trim path (per chapter parse); the
#    entry-time call at ReaderState.cpp:820 re-clears before each
#    book's first render.  Adding an EXIT-time call ensures the
#    bitmaps don't pin heap during the cold-extend window between
#    books, BEFORE the new book's enter() has a chance to clear them.
#
# 3. Renderer width-cache (renderer_.clearWidthCache).
#    Cached glyph advance widths for the current font.  Small but
#    accumulates per typeface.  Cleared symmetrically with the bitmap
#    cache for consistency.
#
# ZIPFILE CACHE (considered, skipped):
# ZipFile::fileStatSlimCache exists but ZipFile is constructed
# TRANSIENTLY (`ZipFile zip(filepath)` at each openItemStream /
# readItemContentsToStream callsite — Epub.cpp:605, :820, :1014).
# The cache dies with its enclosing ZipFile instance on every
# operation; no persistent state survives between book sessions
# to clean up.  Adding a release call would be a no-op.
#
# ESTIMATED IMPACT:
# Per book switch, on top of v2.0.180's 25 KB:
#   * ImageRenderCache: 5-20 KB recovered (depends on book's image
#     count; FB2 with inline images sees the upper end).
#   * Font bitmap caches: 1-3 KB recovered (most books use one font).
#   * Width cache: ~200-500 B recovered (small but free).
#   Total: ~6-23 KB additional heap recovered on every book switch.
#
# COST:
# Three function calls.  Each is no-op when its underlying cache is
# empty.  Worst-case re-allocation cost on next book's first render:
# image cache rebuilds lazily as images are encountered (~10 ms per
# image, only for images that ARE re-encountered); font bitmap cache
# rebuilds on first text render (~200 ms); width cache rebuilds as
# glyphs are measured (~µs each).  All amortised across the book's
# reading session.
#
# SAFETY:
# These calls are added AFTER `asyncJobs_.stopWorker()` (line 1015),
# so no BG worker can be mid-decode when the caches are dropped.
# All three caches are owned by main-thread-accessed objects
# (renderer_, FONT_MANAGER); no concurrency concerns.
#

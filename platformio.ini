#   - Replace `spinnerX = bannerX + (bannerW - spinnerW) / 2` with
#     8-pixel snap of the desired centre.
#   - Replace `textX = bannerX + (bannerW - textWidth) / 2` with
#     `textX = spinnerCenterX - textWidth / 2` so text follows the
#     (now-snapped) spinner.
# * lib/Fb2/src/Fb2.cpp:

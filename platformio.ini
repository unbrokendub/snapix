# The 25 KB JPEG hole was the difference between "tight but workable"
# and "OOM crash" in that workload.
#
# THE FIX:
# Add `JpegToBmpConverter::releaseAllPersistent()` to
# `ReaderState::exit()`, AFTER `core.content.close()` (which guarantees
# the BG worker is stopped — no concurrent JPEG decode possible).
# The next book opens with a fresh heap baseline; its first JPEG-bearing
# operation (cover decode or inline image) pays ~10 ms to re-allocate
# the JPEGDEC instance — negligible compared to the 50-200 ms typical
# JPEG decode time.
#
# No-op when SNAPIX_SMOL_JPEG=1 (v3_alpha env never instantiates
# JPEGDEC) — costs zero in either build.
#
# Why not do this earlier (during reading):
# Within a single book's reading session the JPEG instance gets re-used
# for every inline image decode (FB2 illustrations, EPUB embedded images).
# Releasing per-decode would churn the heap 50-200 times for a 200-page
# illustrated book.  The instance lifecycle should be "per book session",
# released only when the user actually closes the book — which is
# exactly the new release point.
#
# Estimated impact: -25 KB heap baseline for any book #2+ in a session,
# directly addressing the FB2-after-EPUB OOM mode that motivated this
# whole investigation.
#

# FIX:
#   Bump `kPageIndexVersion` from 1 to 2 in
#   `MarkerizedPageRender.h`.  `deserializePageIndex` already rejects
#   files whose version doesn't match.  Both parsers' R4.b short-
#   circuits also do an explicit version check against the same
#   constant (was hard-coded `if (version != 1) break;` — now
#   `if (version != snapix::smolport::kPageIndexVersion) break;` so
#   future bumps don't need editing three places).

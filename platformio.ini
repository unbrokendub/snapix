[platformio]
default_envs = default
extra_configs = platformio.local.ini
packages_dir = .pio/packages

[snapix]
version = 3.6.0
# v3.6.0 — typography: superscript / subscript (<sup>/<sub>) for EPUB + FB2.
#
# Footnote reference numbers and chemical/math formulas (H₂O) now render in a
# smaller raised/lowered face instead of full-size inline digits — the single
# most common "unformatted" element in FB2.  Works in both formats (FB2 falls
# through to the shared inline-tag dispatch; same <sup>/<sub> tag names).
#
# Pipeline: new markers kSuperOn/Off (R/r), kSubOn/Off (T/t) → MarkerStream
# dispatch + observer hooks → StreamingPaginator styleBits kStyleSuper/kStyleSub
# (mutually exclusive) → PageCountingObserver byte accounting → HtmlStripper
# <sup>/<sub> → GfxRendererPaginatorAdapter renders them in a SMALLER built-in
# font (XSmall reader font via RenderConfig.superSubFontId / Settings::
# getSuperSubFontId — always in flash, no extra load), top-aligned (super) or
# baseline-aligned low (sub).  measureWidth uses the small font so the MEASURE
# walk and render agree on widths.
#
# Cache: kPageIndexVersion 16->17, CACHE_FILE_VERSION 36->37 (smaller-font
# widths shift page boundaries for chapters with sup/sub).  One-time rebuild;
# markers reused.
#
# Tests: StreamingPaginatorTest T46 (super/sub style bits propagate, mutually
# exclusive).  Host 85/85; paginator 143; markerized 108; markerize 48;
# chapter-renderer 22.  Release firmware clean.
#
# v3.5.2 — fix Text Layout (no effect) + spurious first-line indent on every page.
#
# (1) Spurious красная-строка indent on EVERY page.  The per-page render path
#     resumes by seeking to a page's byteOffset and running the paginator
#     fresh via resetForChapter(), which unconditionally set atParagraphStart_
#     = true — so the first-line indent appeared on every page, even
#     mid-sentence continuations.  Fix: capture atParagraphStart into each
#     .idx boundary (spare entry byte p[5]) and restore it on resume
#     (PageBoundarySnapshot + MarkerizedRenderResume + paginator get/set).
#     Only true paragraph-start pages now indent.
#
# (2) Text Layout (Compact/Standard/Large) had no effect on EPUB/FB2 — same
#     class of bug as v3.5.1: the streaming config hardcoded firstLineIndent
#     (= bodyLineHeight) and paragraphSpacing (= bodyLineHeight/4), ignoring
#     getIndentLevel()/getSpacingLevel().  Now both derive from Text Layout
#     via shared helpers firstLineIndentForLevel/paragraphSpacingForLevel
#     (single source of truth so the 3 config builders match for configHash):
#       Compact  → indent 0,    para gap 0
#       Standard → indent 1×LH, para gap ¼×LH   (= the old красная-строка look)
#       Large    → indent 1.5×LH, para gap 1×LH
#
# Cache: kPageIndexVersion 15->16 (entry p[5] now used + layout shift),
# CACHE_FILE_VERSION 35->36.  One-time rebuild; markers reused.
#
# Tests: StreamingPaginatorTest T45 (mid-paragraph resume = no indent,
# paragraph-start = indent).  Host 85/85; paginator 137; markerized 108.
# Release firmware clean.
#
# v3.5.1 — BUGFIX: Line Spacing had no effect on EPUB/FB2 (v3 streaming path).
#
# The streaming paginator's bodyLineHeight was computed from the RAW font line
# height in all three config builders (ReaderState render + EpubChapterParser/
# Fb2Parser MEASURE walks) — lineCompression (the Line Spacing setting) was
# never applied.  Only the legacy ParsedText path (TXT/MD) honoured it, so on
# EPUB the setting did nothing (0.55 looked identical to 0.95).
#
# Fix: bodyLineHeight = getLineHeight(fontId) * lineCompression in all three
# builders.  They stay consistent because the parsers use config_.line
# Compression and ReaderState uses core.settings.getLineCompression() — both
# derived from the same setting.  headingLineHeight / paragraphSpacing /
# firstLineIndent (all derived from bodyLineHeight) scale with it too.
#
# Cache: kPageIndexVersion 14->15, CACHE_FILE_VERSION 34->35 — old caches were
# built with the raw height; the page cache validates only the lineCompression
# VALUE (unchanged by this fix), so a version bump is required to force the
# rebuild.  One-time; markers reused.
#
# Build: release firmware clean (RAM 46%, Flash 78%).  Host 85/85.
#
# v3.5.0 — line spacing as a 10-step numeric dial + reclaim the status-bar gap.
#
# (1) Line Spacing is now 10 numeric levels 0.50×..0.95× (0.05 steps), shown
#     as the raw multiplier, replacing the named Compact/Normal/… scheme
#     (which ran out of names as users wanted ever-tighter spacing).  Index
#     0..9 into SnapixSettings::kLineCompressionValues; default 0.90× (idx 8).
#     NOTE: the persisted lineSpacing value's MEANING changed, so an existing
#     setting maps to a different multiplier after update — re-pick once.
#     (No clean per-field settings migration exists; the index is reused.)
#
# (2) Status-bar reserve sized to the status font.  getReaderViewport reserved
#     a fixed 23 px for the bottom bar — set for a 28 px font, but the bundled
#     themes use ~10-14 px status fonts, leaving an empty band above the
#     progress bar (most visible at tight spacing).  Now reserve = real status
#     line height + 4 (+ positive statusBarOffsetY), floor 10, so content
#     fills down to just above the bar — a tightly-spaced page gains ~one line
#     — and a taller status font never clips.  A theme.statusBarReservedHeight
#     override still wins.
#
# Pure layout/settings change; no paginator-algorithm edit.  Cache:
# kPageIndexVersion 13->14, CACHE_FILE_VERSION 33->34 (marginBottom shift ->
# one-time rebuild; markers reused).  Line-spacing changes also auto-rebuild
# per book via lineCompression in the cache key.
#
# Build: release firmware clean (RAM 46%, Flash 78%).  Host 85/85
# (SettingsDefaults 6, SettingsView 16).
#
# v3.4.0 — settings: two tighter line-spacing levels below Compact.
#
# Line Spacing gains X-Compact (0.78×) and XX-Compact (0.70×), below the
# existing Compact (0.85×).  lineCompression multiplies the font's natural
# line height (lineHeight = getLineHeight(fontId) * lineCompression), so
# these just pack rows tighter for readers who want maximum text per page.
#
# Pure settings/enum change — NO paginator or cache-format edit:
# * LineSpacing enum: SpacingXCompact=4, SpacingXXCompact=5 APPENDED so the
#   persisted values 0-3 (Compact/Normal/Relaxed/Large) keep their meaning —
#   no settings migration.  (Trade-off: the UI list isn't strictly
#   tight→loose; the two new tight levels sit after Large.)
# * getLineCompression() returns 0.78 / 0.70 for the new levels.
# * readPodValidated bound 4→6 (both load sites) so the new values aren't
#   reverted to default on load; DEFS valueCount 4→6 so the cycler reaches
#   them; LINE_SPACING_VALUES gains "X-Compact"/"XX-Compact".
#
# No cache version bump needed: lineCompression is already part of the page
# cache validation + folds into the .idx configHash via bodyLineHeight, so
# switching to a new level auto-rebuilds just that book's cache (markers
# reused).
#
# Build: release firmware clean (RAM 46%, Flash 78%).  Host 85/85
# (SettingsDefaults 6, SettingsView 16).
#
# v3.3.0 — typography: word hyphenation in the streaming renderer.
#
# The v3 streaming paginator never had hyphenation (the old ParsedText path
# did) — justified body text showed "rivers"/big gaps, worst on long Russian
# words.  Now overflowing words split at dictionary break points: "пред-" on
# one line, the rest on the next.  Liang patterns via the existing
# Hyphenation lib (ru/en/de/es/fr/it/uk; hyph-utf8 — already the canonical,
# current source, Russian = Lebedev patterns).  Also fixes &shy; (U+00AD)
# which otherwise rendered as a stray box mid-word.
#
# SAFETY (this is the .idx-critical line breaker):
# * Option B — hyphenation NEVER splits across a page boundary.  It fires
#   only when the prefix fits the current line AND the remainder fits one
#   next line of the SAME page (gate: cursorY + 2*lineHeight <= bottom).  So
#   page boundaries stay whole-word and .idx byte offsets are unaffected;
#   only intra-page line packing changes.
# * MEASURE/DRAW consistency — the paginator itself calls
#   Hyphenation::setLanguage(cfg.hyphenLang) in resetForChapter (always, even
#   ""→deterministic nullptr), so the global dictionary can't drift between
#   the .idx build and the render.  Language: EPUB = declared <dc:language>;
#   FB2 = "ru" (Lebedev patterns are Cyrillic-only, so a Latin FB2 simply
#   gets no hyphenation rather than wrong breaks).  hyphenate + hyphenLang
#   fold into configHash.
# * Dictionary-only breaks (no arbitrary fallback) → never a wrong split.
#   Words <10 or >80 bytes skip the lookup (perf + sanity).
#
# Heap: breakOffsets allocs a small vector, but ONLY for the one word that
# overflows a line (~1/line), freed immediately — same pattern the legacy
# ParsedText used on-device.
#
# Cache: kPageIndexVersion 12->13, CACHE_FILE_VERSION 32->33 (line repacking
# shifts boundaries -> one-time rebuild).
#
# Tests: StreamingPaginatorTest T42 (split + no chars lost + remainder next
# line), T43 (intra-page gate blocks a cross-page split), T44 (off = whole
# word).  Host 85/85; SmolPort 134/108/22.  (Host test links a deterministic
# mock_hyphenation; firmware links the real tries.)
#
# v3.2.0 — typography: scene-break ornament for <hr>.
#
# EPUB <hr> (and HTML thematic breaks) previously rendered as NOTHING —
# onThematicBreak only advanced the cursor by one paragraphSpacing, so scene
# dividers were invisible.  Now a centered "* * *" is drawn on its own line
# with air above/below, the classic printed-book scene break.
#
# Scope: StreamingPaginator::onThematicBreak only.  No new markers, styleBits,
# stripper rules, or MarkerObserver hooks — the kBreak marker, the <hr>->kBreak
# mapping, and the onThematicBreak hook already existed; only the paginator's
# handler changed.  ASCII asterisks are guaranteed in every bundled font (a
# single U+2042 ASTERISM glyph is not).  Runs identically in the MEASURE walk
# and DRAW pass (cursor advances the same; only drawWord is gated on
# drawSuppressed_), so .idx boundaries match render output.  If the ornament
# line doesn't fit at a page bottom it's skipped (break still works via the
# spacing + new-paragraph indent).
#
# FB2: scene dividers there typically come through as <subtitle> (already
# centered) or literal "* * *" text, so this mainly fixes the EPUB <hr> gap.
#
# Cache: kPageIndexVersion 11->12, CACHE_FILE_VERSION 31->32 (the ornament
# line shifts page boundaries in any chapter with an <hr> -> one-time rebuild).
#
# Tests: StreamingPaginatorTest T40 (ornament drawn + centered + surrounding
# text intact), T41 (MEASURE mode advances cursor but draws nothing).  Host
# 85/85; paginator 129/129; markerized-render 108/108.
#
# Second of the "prettier books" batches (after v3.1.0 красная строка).
# Remaining queue: super/subscript, strikethrough, monospace, drop caps.
#
# v3.1.2 — honest loading status for FB2 books without a chapter list.
#
# FB2 files without titled sections are parsed as one continuous stream, so
# their first index/cache build can legitimately take several minutes.  Once
# metadata is available, replace the generic "Loading..." banner with:
#   No chapter list found
#   Loading may take a few minutes
# The parser, cache format, and navigation behavior are unchanged.
#
# v3.1.1 — stability/speed audit, round 1: the three highest-confidence fixes.
#
# 1) FB2 META-PARSE REBOOT — THE REAL FIX (observed crash).
#    Hardware log (3rd book in one session, MaxAlloc 29 KB): abort() right
#    after "[FB2] Found cover reference" — DESPITE v2.0.197's try/catch
#    around XML_Parse.  Root cause: the bad_alloc is thrown inside an Expat
#    *callback*; unwinding to the outer catch must cross Expat's C frames,
#    which have no unwind tables → __cxa_call_terminate → abort → reboot.
#    Fix: register OOM-guarded wrapper handlers that catch INSIDE the C++
#    callback frame (zero C frames between throw and catch), set
#    metaParseOom_, and XML_StopParser → load fails gracefully ("book
#    failed to open") instead of rebooting the device.  Plus prevention:
#    meta accumulator caps (title/author/section-title 512 B; tocItems_
#    512 entries) so the doubling-realloc spike can't fire at all.
#
# 2) MARKERIZE WRITE COALESCING — ~3 orders of magnitude fewer writes.
#    HtmlStripper emits text BYTE-BY-BYTE (sink_.emit(&b,1) per char); the
#    markerize sink forwarded each emit straight to LittleFS File::write().
#    A 430 KB FB2 section = ~420 000 single-byte write calls — the per-call
#    overhead (Arduino File → VFS → littlefs) dominated the 116-second cold
#    markerize.  CallbackSink now stages into a 1 KB buffer and flushes in
#    bulk (large payloads bypass).  Output BYTES are identical → markers /
#    idx / page caches stay valid, NO version bump.  One change fixes EPUB
#    + FB2 + TXT/MD markerize.  Expect cold-parse to drop multi-fold;
#    re-measure on hardware.
#
# 3) SPILLOVER BUFFER REUSE (v3.0.2 follow-up).
#    resetForNextPage's move-out left spilloverBuf_ null after every
#    boundary with spillover → next saveSpillover paid a fresh malloc.
#    Now the replay buffer is handed back when no re-save occurred (the
#    common case) — per-boundary alloc/free churn eliminated, stack-frame
#    win retained.
#
# Audit also surveyed (deferred, see session notes): UnifiedCache directory
# rescan per ::shared() call (~50 ms × 7-10 per chapter render — candidate:
# small fixed-BSS directory snapshot keyed by (path,fileSize); the v2.0.170
# full-instance cache that was reverted pinned heap, a 360 B BSS snapshot
# would not); carryWordText_[64] silent drop at page boundary (rare
# correctness); streamOffsetCache_ in-RAM growth past the 510-entry
# serialize cap (minor).
#
# v3.1.0 — typography: "красная строка" (first-line paragraph indent).
#
# Prose now reads like a printed book: the first line of each top-level
# paragraph is indented by one body line-height, instead of the web-style
# flush-left + vertical gap.  Biggest single "prettier" win for fiction.
#
# Scope (StreamingPaginator):
# * New StreamingPaginatorConfig.firstLineIndent (px; 0 = off / old look).
#   Set to one bodyLineHeight in all three config builders (ReaderState
#   render path + EpubChapterParser/Fb2Parser MEASURE walks) — identical
#   everywhere so the .idx configHash matches.
# * atParagraphStart_ flag: set on chapter start + paragraph / thematic /
#   hard-page breaks; NOT on soft wraps or <br>/verse line breaks.  The
#   first word of such a line is pushed in by firstLineIndent; threaded into
#   flushLine via lineIndent_ so the DRAW position (not just the fit-check)
#   is offset, and reset so wrapped continuation lines stay flush-left.
# * Excluded from indent: headings, centered text, and list/quote blocks
#   (indentDepth_>0) — they carry their own alignment.  Classic result:
#   centered chapter title, flush first paragraph, indented rest.
#
# Cache: kPageIndexVersion 10→11 + CACHE_FILE_VERSION 30→31 — the indent
# shifts page boundaries/counts, so existing caches rebuild once on first
# open after the update.
#
# Tests: StreamingPaginatorTest T37-T39 (first line indented, continuation
# flush-left, paragraph 2 re-indented, indent=0 back-compat, headings
# excluded).  Host 85/85; SmolPort paginator 124/124.
#
# First of two "prettier books" batches.  Next (v3.2.0): inline styles
# (strikethrough, super/subscript) + monospace/code + drop caps.
#
# v3.0.3 — heap reclaim: right-size the chapters-menu (TOC) view.
#
# ChapterListView (ReaderState::tocView_) held a fixed chapters[256] array
# with a 64-byte title each = ~17 KB, pinned in BSS for the app's whole life
# even though it's only populated while the chapters menu is OPEN.  During
# reading — and the OOM-prone cold parse — those 17 KB sat idle, OUT of the
# runtime heap pool (Min Free dropped to ~34 KB on big FB2 sections).
#
# Right-sized to chapters[192] × 48-byte title (~10 KB), returning ~7.4 KB to
# the heap pool permanently:
#   * MAX_CHAPTERS 256 → 192: addChapter() already caps at MAX_CHAPTERS, so a
#     book with >192 TOC entries just truncates the jump-list past 192 —
#     full page-turn navigation is unaffected.  Covers the vast majority of
#     books.
#   * TITLE_LEN 64 → 48: TOC titles already truncate by pixel width on the
#     480-px screen (~40 chars with indent), so no visible change.
#
# Chosen as the zero-new-failure-modes option over lazy heap allocation of
# the array (which would reclaim the full 17 KB during reading but adds an
# alloc-on-menu-open path + fragmentation risk that can't be hardware-tested
# here).  Pure BSS shrink: no behavioural change, no new code paths.
#
# Also surveyed and ruled out: the legacy ChapterHtmlSlimParser + its 5 KB
# EpubRenderWorkspace are already dead-stripped by LTO in the v3 release
# (markerized render bypasses them) — confirmed absent from the ELF.
#
# v3.0.2 — fix "words missing between pages" in EPUB/FB2 streaming render.
#
# THE COMPLAINT:
# Reading an EPUB, occasionally a word or short phrase goes missing right at
# a page boundary (mid-paragraph), so consecutive pages don't read
# continuously.  Intermittent — only on some boundaries.
#
# THE ROOT CAUSE (silent spillover truncation):
# When a page fills mid-text-run, StreamingPaginator carries the word that
# didn't fit and saves the REST of that run (everything after the carry
# word, still inside the same onText call) into a fixed spillover buffer to
# replay on the next page.  That buffer was capped at 2048 bytes and
# saveSpillover() SILENTLY DROPPED anything past the cap.  A long marker-
# free paragraph (one text run, delivered up to chunkBufSize=4096 bytes at a
# time) that fills a page early leaves >2048 bytes of tail → the overflow
# words were lost forever, at both .idx-build and render time.  v2.0.142 had
# bumped the cap 256→2048, reducing frequency but not eliminating it.
#
# THE FIX (lib/SmolPort/src/StreamingPaginator.{h,cpp}):
# * spilloverBuf_ now GROWS geometrically on demand (2048 → … → 16384 max)
#   instead of truncating.  16 KB ≈ 8 pages of carried text — unreachable in
#   practice (steady-state spillover is <1 page); beyond it, graceful
#   truncation (still strictly better than the old 2 KB).
# * resetForNextPage() replays from a heap MOVE-OUT of the buffer instead of
#   a fixed `uint8_t buf[2048]` stack copy, so growth never inflates the
#   (already tight) loopTask stack.
# * The byte-offset/carry accounting is UNTOUCHED: spillover is only ever
#   non-empty when a carry word exists, so .idx byteOffsets always come from
#   carryStartByteOffset(), never the pendingBytes() path — the 16-bit
#   spilloverLen_/pendingBytes() can't overflow within the 16 KB cap.
#
# Regression test: StreamingPaginatorTest T36 feeds ~4.8 KB of distinct
# words in one onText run and asserts every word renders exactly once in
# source order.  Verified it FAILS under the old 2048 cap and PASSES with
# the growing buffer.  SmolPort suites: 113/108/22/48 pass.
#
# v3.0 refactor — see lib/SmolPort/README.md.  The hardware-verified
# v3_alpha pipeline is now the default/release pipeline for v3:
#   SNAPIX_SMOL_JPEG       — Phase 2 (integrated 1-bit JPEG decoder)   — INTEGRATED
#   SNAPIX_SMOL_HTML       — Phase 3 (byte-marker HTML/FB2 stripper)   — shim ready + integration code in tree; flag-gated 0 in v3_alpha until suspend/resume corner cases are fully understood
#   SNAPIX_STATIC_WORKSPACE — Phase 4 (static EpubRenderWorkspace BSS) — INTEGRATED (4b: anchor map)
#   SNAPIX_UNIFIED_CACHE   — Phase 5 (single .bin per book)             — infra only
#   SNAPIX_SMOL_PNG        — Phase 6 (integrated 1-bit PNG decoder)    — INTEGRATED
# (Phase 7 FB2 stripper ships under SNAPIX_SMOL_HTML alongside Phase 3.)
#
# v3 release keeps HTML stripper and unified cache flag-gated 0; their
# integration still requires a separate hardware-in-loop rollout.
#
# v2.0.89 (hardware bring-up):
#   1. SmolJpeg's marker parser was rewritten as a 256-byte sliding-window
#      streaming reader.  The previous version heap-allocated a single
#      32 KB scratch buffer on entry, which failed `AllocFailed` on the
#      Xteink X4 cover-gen path once the heap had fragmented past ~32 KB
#      largest-free-block.  Transient marker-parse RAM is now <300 B so
#      SmolJpeg actually runs for the cover instead of falling back to
#      picojpeg (~46 s/cover).
#   2. EPUB inline-image peek (ChapterHtmlSlimParser quick-decode mode)
#      now routes through SmolJpeg::peekDimensions when SNAPIX_SMOL_JPEG
#      is on, via a new ImageConverterFactory::peekJpegDimensionsLittleFs
#      entry point.  Pre-fix it always allocated a ~25 KB JPEGDEC shared
#      workspace, which OOM'd mid-chapter once the heap fragmented;
#      images 2..N then rendered as placeholders.
#   3. ChapterHtmlSlimParser::cacheImage sync-decode fallback now sets
#      `ImageConvertConfig::oneBit = true`, so the JPEG→BMP convert step
#      runs through SmolJpeg (transient ~28 KB) instead of JPEGDEC
#      (~50 KB peak).  Same panel-side appearance — the e-paper is 1-bit
#      anyway — without the heavy heap footprint.
#
# v2.0.90 (Phase 4b — static workspace integration, gated by
# SNAPIX_STATIC_WORKSPACE=1 in v3_alpha):
#   * `ChapterHtmlSlimParser::anchorMap_` writes during parse now go to
#     the BSS-resident `EpubRenderWorkspace.anchors` slot table +
#     `stringArenaBuf` bump arena instead of the heap-allocated
#     std::vector<std::pair<std::string, uint16_t>>.  ~200 individual
#     std::string heap allocations per chapter, interleaved with all
#     other parse work (a chronic mid-parse fragmentation source), are
#     eliminated.  Workspace overflow falls back to the legacy vector
#     so no anchors are dropped.
#   * `getAnchorMap()` materialises the std::vector ONCE on first call
#     after a chapter parse, then caches it — the on-disk serialiser
#     gets the same return shape but the allocations now happen in a
#     single contiguous burst rather than scattered through parse.
#   * `kStringArenaBytes` initially bumped 4 KB → 8 KB to fit Calibre-style
#     `_idGenObjectAttribute-<n>` IDs at ~26 B avg × 256 slots — REVERTED
#     to 4 KB after hardware bring-up (see below).
#   * BSS cost: +5 KB always-pinned (post-strip).  Heap cost: ~6 KB of
#     recurring mid-parse string allocations eliminated → net ~1 KB heap
#     loss, largest-free-block watermark stays much higher under parse
#     load.
#
# v2.0.206 (EPUB/FB2 chapters not "stitched": the last page of every
# multi-page chapter was silently dropped — turning the last visible page
# jumped to the next chapter mid-sentence).
#
# THE COMPLAINT:
# Reading an EPUB, a page-turn lands on a NEW chapter even though the
# previous chapter's text wasn't finished — a paragraph/sentence at each
# chapter boundary goes missing.
#
# THE ROOT CAUSE (off-by-one in the streaming page count):
# The upfront MEASURE walk (R4.c) fires a page-boundary callback ONLY on an
# overflow roll (page N fills → roll into page N+1).  So a chapter spanning
# P pages yields just P-1 boundaries: page 0 is implicit (starts at byte 0)
# and the final partial page ends at EOF without a roll.  The short-circuit
# emitter (R4.b) then created `entryCount` (= P-1) empty Pages — one short.
# The reader's per-spine page count (from the page cache) was therefore
# P-1, so reaching "page P-1 of P-1" and turning advanced to the next
# spine, never rendering the real last page.  v2.0.175 had noticed the
# zero-boundary (single-page) case and papered over it with a synthesised
# page-0 entry, but that masked rather than revealed the general off-by-one.
#
# THE FIX:
# * R4.b (EpubChapterParser.cpp + Fb2Parser.cpp): emit `boundaryCount + 1`
#   Pages.  The +1 is the implicit page 0 / EOF-terminated final page.  A
#   0-boundary idx is now a valid single-page chapter (emits 1 Page), so the
#   old `pageCount == 0 → break` early-out is gone.
# * R4.c: the v2.0.175 synthesised page-0 entry is REMOVED — with the +1
#   reconstitution it would double-count single-page chapters.  An empty
#   `captured` with >0 bytes consumed now serializes a 0-entry idx (header
#   only); only 0 bytes consumed is treated as empty/corrupt.
# * The on-disk idx entry layout is UNCHANGED (entries still record the
#   starts of pages 1..K; page 0 implicit at offset 0), so resume-seeking
#   and the render path need no change — the recovered last page renders
#   from the last boundary's offset to EOF.
# * kPageIndexVersion 9 → 10: old indices carried the buggy synthesis /
#   were read by the buggy emitter; bump forces a clean rebuild.
# * CACHE_FILE_VERSION 29 → 30: existing page caches were built with the
#   short count and would keep dropping the tail even after the code fix
#   (a complete cache is loaded without re-running R4.b).  Bumping forces
#   every book's page cache to rebuild through the fixed parser.
#
# COST: first open of each book after the update re-runs the markerize +
# idx + page-cache build for its spines (one-time, ~seconds/book).  After
# that, chapters render complete.
#
# EDGE: a chapter that ends EXACTLY on an overflow roll into an empty final
# page (rare — last event is a page-filling paragraph break at EOF) gains
# one trailing blank page.  Benign (the framebuffer is cleared per page, so
# it's a clean blank, not stale content) and vastly preferable to dropping
# real text.  A content-aware count could suppress it later if needed.
#
# v2.0.205 (remove the loading SPINNER — keep a single static "Loading…"
# banner over the previous content.  The animation idea was good but the
# ESP32-C3 is too weak: any per-tick repaint starves the parse worker).
#
# THE DECISION:
# v2.0.196-204 built an animated 10-frame spinner to answer "is it stuck?"
# during long cold loads.  But every repaint strategy we tried (full
# displayBuffer per tick → v2.0.201; hybrid partial+drive-all → v2.0.203;
# window-only RED resync → v2.0.204) still cost SPI-bus/CPU time that the
# single-core ESP32-C3 needs for the FB2/EPUB markerize worker.  On weak
# hardware the animation actively slowed the very load it was decorating.
# User call: drop the animation, keep ONE static banner.
#
# THE CHANGE — pure deletion, NOT a git revert (v2.0.204's displayWindow
# partialRedSync fix stays in tree for any future caller):
# * src/states/ReaderState.cpp:
#   - renderCenteredStatusMessage: draws a static "Loading…" banner
#     (background fill + centred bold text + border) ON TOP of the existing
#     framebuffer (no clearScreen → previous page/menu stays visible — the
#     v2.0.202 over-content fix is preserved), then ONE displayBufferDriveAll.
#     Spinner bitmap, layout math, and saved coords removed.
#   - tickLoadingAnimation(): deleted entirely.
#   - drawAlignedBitmap() helper: deleted (only the spinner used it).
#   - Both render()-loop tickLoadingAnimation() call sites removed.
#   - displayWithRefresh(): loadingOverlayActive_ reset removed.
# * src/states/ReaderStateOverlays.cpp: tickLoadingAnimation() call removed.
# * src/states/ReaderState.h: tickLoadingAnimation decl + all spinner/banner
#   state fields (loadingAnimationFrame_, loadingAnimationLastTickMs_,
#   loadingSpinnerX_/Y_, loadingBannerX_/Y_/W_/H_, loadingOverlayActive_)
#   removed.
# * src/states/reader/LoadingAnimation.h: deleted (10-frame bitmap table,
#   ~370 lines of const data — frees flash).

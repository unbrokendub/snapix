# PROBLEM (hardware screenshot after v2.0.133 upgrade):
#   First page render after opening a previously-read EPUB showed only
#   the LEFT HALF of the page filled with text — and importantly the
#   text WAS legible Russian (no ÿ° garbage, so v2.0.133's UTF-8 fix

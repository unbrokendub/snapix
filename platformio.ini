# v2.0.182 (Self-healing UnifiedCache loadDirectory — atomically
# truncates the file at the last known-good byte when a corrupt frame
# is detected during the directory scan.  Cleans up the legacy
# v2.0.173 "a"-mode append-bug corruption that lingered across
# v2.0.174-181 because new writes were correct but never reachable
# (the scan stopped at the bad frame and never reached entries
# written past it).
#
# THE PROBLEM (recapped from v2.0.181 crash log):
#   [ERR] [UCACHE] Frame at 13708 has size 843579715 that extends
#                  past file (140316)
#   ... [ERR] same error fires on EVERY UnifiedCache load ...
#   [202490] page-load page=7 source=resident
#   abort() was called at PC 0x421680f1 on core 0  ← crash in render
#
# Sequence:
#   1. v2.0.173's "a"-mode write left a size-0 placeholder + 4 bytes
#      of misplaced size-field garbage at the end of the FB2 streaming
#      .cache.
#   2. v2.0.174 fixed the "a"-mode bug (no NEW corruption produced)
#      but had no way to repair the existing garbage.
#   3. v2.0.175-181: each new markerize correctly appended its frame,
#      growing the file (119100 → 140316 bytes).  BUT loadDirectory
#      stops at offset 13708 (the bad frame) on every scan, so the
#      NEW frames past offset 13708 are physically in the file but
#      unreachable via the in-memory directory.
#   4. FB2 reads for sections >5 fail (markers segment "doesn't
#      exist" per the truncated directory), render path gets back
#      empty/garbage data, downstream abort() in some library code.
#
# THE FIX (v2.0.182):
# When loadDirectory's frame-walk detects a bad frame (either
# "truncated frame header" or "size extends past file"), it sets a
# flag and breaks.  After the loop:
#
#   1. Open the original file for read + a `.heal` temp file for write.
#   2. Copy the valid prefix (everything before the bad frame, ending
#      at `cursor` = last known-good byte) in 1 KB chunks.
#   3. Flush + close both files.
#   4. Remove the original.
#   5. Atomically rename `.heal` to the original path.
#   6. Update `fileSize_` to the new shrunk size so subsequent writes
#      append at the correct post-truncation offset.
#
# directory_ already contains only the valid-prefix entries (the
# scan stopped before the bad frame), so no re-scan needed after
# the rewrite.
#
# CRASH-SAFETY:
# The atomic rename pattern means that on power loss between rewrite
# and rename:
#   * Original file still exists, still corrupt.  Next-boot scan
#     re-detects corruption and re-runs the heal.  Eventually
#     consistent.
#   * The .heal temp file may or may not exist.  If it does, harmless
#     leakage (cleaned by user's eventual book-delete or a future
#     scrubber).
#
# WHY NOT JUST WIPE THE WHOLE FILE:
# The valid prefix contains entries that were correctly written in
# v2.0.174+ AND that callers may still want.  In the user's FB2
# file the valid prefix had 5 sections of markers — wiping the file
# would force re-markerize of all 5 (~10 sec of work the user already
# paid for once).  The atomic-rewrite approach preserves them.
#
# WHY THIS WORKS:
# The frame-header format encodes each frame's payload size in its
# 8-byte header, so the END of one valid frame is the START of the
# next.  If frame N+1 has a size that overflows file boundary, frame
# N+1's header was either:
#   (a) never patched (v2.0.173 "a"-mode bug: size left as 0
#       placeholder, scan advanced by 8 bytes and read payload bytes
#       as the next header), OR
#   (b) genuinely truncated by an aborted/interrupted write.
# In both cases the file's last byte past `cursor` is unreachable
# garbage and discarding it is the correct recovery.
#
# CHANGES:
# * lib/UnifiedCache/src/UnifiedCache.cpp
#     - Added `bool needsHealAtCursor` flag inside loadDirectory's
#       scan loop, set when a bad frame is detected (both "truncated
#       header" and "size > file" paths).
#     - After the scan, if needsHealAtCursor: do the chunked copy +
#       rename + fileSize_ update.  Heap budget for the copy is one
#       1 KB stack buffer.
#     - Updated existing LOG_ERR messages to mention "will self-heal".
#     - New LOG_INF "Self-healed ..." reports the truncation result.
#     - Error paths log clearly and leave the system in a consistent
#       state (either valid prefix loaded, or fall back to empty
#       cache).
#
# No header / API changes anywhere.  No callsite changes elsewhere.
#
# Build: clean.  Flash: ~+760 B (heal logic + LOG strings + 1 KB
# stack buffer code).  BSS: unchanged.  Runtime: corruption detection
# now triggers a one-time ~200 ms heal (10-100 KB read + write +
# rename) on the affected book's first cache load; subsequent loads
# are clean and fast.
#
# Expected hardware behaviour on the user's existing corrupt FB2
# cache:
#   [boot] Loading FB2 Fire_in_the_Valley.fb2
#   [ERR] Frame at 13708 has size 843579715 that extends past file
#         (140316) — will self-heal
#   [INF] Self-healed /cache/fb2_3514985871/streaming.cache:
#         truncated 140316 -> 13708 bytes, preserved 5 valid entries
#   ... no further UCACHE errors on subsequent loads ...
#
# v2.0.181 (Rust-embedded-style string arena for CssParser selectors —
# replaces the per-entry std::pair<std::string, CssStyle> storage with
# a single shared char buffer (arena_) + compact 12-byte StyleEntry
# records (offset + length + CssStyle).  Cuts CSS-rule storage from
# ~32-72 B/entry to a flat 12 B/entry + 1 B per selector char.
#
# THE STRUCTURAL CHANGE:
#
# Before (v2.0.180 and earlier):
#   struct StyleEntry = std::pair<std::string, CssStyle>;
#   std::vector<StyleEntry> styleMap_;
#
#   Per entry:
#     * std::string = 24 B struct.  If selector ≤ ~15 chars it lives
#       inline (SSO), otherwise a separate heap allocation holds the
#       characters (~32 B + ~16 B heap header).
#     * CssStyle = 8 B (enum bits + has-* flags).
#     * Total per entry: 32 B (SSO-eligible selector) to 72 B
#       (heap-allocated selector).
#
#   For a typical 43-rule EPUB CSS file with mostly-short selectors
#   like ".body", "p.chapter-title", "h1": ~1.5 KB persistent heap.
#   For a 82-rule multi-CSS EPUB with longer selectors: ~3-5 KB.
#
# After (v2.0.181):
#   struct StyleEntry { uint16_t offset; uint16_t length; CssStyle style };
#   std::vector<char> arena_;
#   std::vector<StyleEntry> styleMap_;
#
#   Per entry:
#     * StyleEntry = 12 B fixed (4 B offset+length + 8 B style).
#     * Selector chars: 1 B/char in the arena (no per-string overhead).
#
#   Same 43-rule EPUB: 43 * 12 = 516 B index + ~430 B arena = ~950 B.
#   Same 82-rule EPUB: 82 * 12 = 984 B index + ~820 B arena = ~1.8 KB.
#
#   SAVINGS: ~500 B (mostly-SSO selectors) to ~3 KB (longer selectors).
#
# Lookup performance is unchanged: O(log N) binary search via
# std::lower_bound with a comparator that does memcmp on the arena
# slice against the query string.  Insertion is also O(N) as before
# (vector::insert at sorted position), with one new step: append the
# selector chars to arena_ before recording the StyleEntry.
#
# External API (getStyleForClass / getTagStyle / getCombinedStyle /
# hasStyles / getStyleCount / clear) all preserved with identical
# signatures — no callsite changes anywhere in the codebase.  Internal
# `findStyleMut` helper removed (the only caller in parseRule now
# inlines the lower_bound + compare + merge-or-insert logic, which is
# also what allowed the API simplification).
#
# BOUNDS:
# Arena offset is uint16_t — max addressable arena size is 64 KB.
# CSS file size is already bounded by MAX_CSS_FILE_SIZE = 64 KB and
# selectors are typically <30% of source bytes, so the practical
# arena size sits at ~5-20 KB.  Pathological inputs (autogenerated
# CSS with very long selectors) are caught by an explicit bounds
# check in parseRule that logs a DBG and skips the rule instead of
# overflowing.
#
# Selector length is uint16_t — bounded by MAX_CSS_SELECTOR_LENGTH
# = 256, fits comfortably.
#
# CONCURRENCY:
# CssParser is single-threaded by usage convention (parsed during
# book open on main thread, queried during chapter render on main
# thread).  No concurrent access; no synchronization needed.
#
# CHANGES:
# * lib/Epub/src/Epub/css/CssParser.h
#     - Added <cstdint> + <cstring> includes (uint16_t, memcmp).
#     - Replaced `using StyleEntry = std::pair<std::string, CssStyle>`
#       with `struct StyleEntry { uint16_t offset; uint16_t length;
#       CssStyle style; }`.
#     - Added `std::vector<char> arena_` next to `styleMap_`.
#     - Added `int compareSliceToKey(const StyleEntry&, const char*,
#       size_t) const` helper that does the slice-vs-key memcmp.
#     - Rewrote `findStyle()` to use the arena-slice comparator.
#     - Removed `findStyleMut()` (no longer needed — parseRule inlines
#       the find+insert logic).
#     - Extended `clear()` to also clear arena_.
# * lib/Epub/src/Epub/css/CssParser.cpp
#     - getStyleForClass: `it->second` -> `it->style`.
#     - parseRule: rewrote the store branch to use arena-slice
#       comparator for the lower_bound, append-to-arena +
#       construct-StyleEntry for the insert, and an explicit uint16_t
#       overflow check before the insert.
#
# Build: clean.  Flash: ~+280 B (comparator templates + arena
# manipulation code).  BSS: unchanged.  Runtime memory: ~0.5-3 KB
# heap saved per EPUB with CSS rules.

#   The R4.c upfront `.idx` build now correctly produces the right
#   pageCount (e.g. 33 pages for FB2 section 32) — so the configHash
#   matches and the render-time idx-load succeeds:
#     [STREAM] idx loaded spine=32 entries=33
#   But the cache file itself was still being written as 1 page:
#     [CACHE] create start path=...32.bin maxPages=1 skipPages=0
#     [STREAM] short-circuit: emit 33 empty pages from .idx
#     [CACHE] Page 0 cached
#     short-circuit done section=32 pagesCreated=1     ← 1 of 33!
#     [CACHE] create done path=...32.bin pages=1 partial=0
#   Then page-turn from the single cached page reported `next no-op`
#   (already on last page) — user couldn't navigate past page 0 of
#   any FB2 section.  In EPUB, larger maxPages (e.g. 5, 10) emitted
#   partial caches that the cold-extend mechanism kept re-emitting
#   from page 0, never reaching the section tail.  Either way: user
#   experience was "stuck" or "white screen on page-turn".
#
# ROOT CAUSE:
#   R4.b's emit loop respected `maxPages` (good — bounded per-call
#   work) but unconditionally set `hasMore_=false` after the loop
#   (BAD — claimed the chapter was fully cached after first batch).
#   Cache marked the file complete (`partial=0`), so future
#   extend() calls saw no work to do.
#
# FIX:
#   Both `EpubChapterParser` and `Fb2Parser` gain three private
#   fields tracking short-circuit progress across `parsePages` calls:
#     bool shortCircuitActive_   — true while emitting
#     uint16_t shortCircuitTotalPages_   — from .idx pageCount
#     uint16_t shortCircuitNextPage_     — next index to emit
#
#   On activation (R4.b's existing in-init code path):
#     * Read pageCount from .idx as before.
#     * Set the three fields above.  Initialize counters.
#     * Emit up to maxPages empty Pages.
#     * Set hasMore_ = (shortCircuitNextPage_ < total).
#     * If hasMore_, leave fields in place; the next parsePages
#       call will resume.  If !hasMore_, clear everything and let
#       the cache writer mark the file complete.
#
#   New branch at top of `parsePages`:
#     * Before canResume() check, test `shortCircuitActive_`.
#     * If true, emit next maxPages from shortCircuitNextPage_.
#     * Advance shortCircuitNextPage_; update hasMore_.
#     * Return early — never touches the legacy init or resume paths.
#
#   `canResume()` now also returns true while a short-circuit is
#   mid-flight (so cache.extend() uses the hot path instead of
#   forcing a cold rebuild).
#
#   `reset()` clears the three fields too.
#
# RESULT:
#   * Cache file ends up with all N pages (matching .idx pageCount).
#   * `partial=0` is set only when the FINAL short-circuit batch
#     emits the last page.
#   * Page-turn navigates through all rendered pages of the section
#     correctly — no more "stuck on page 0" or white screens past
#     the (false-)reported end of section.
#   * R4.b stays fast (each batch is just empty-Page allocs at
#     ~64 B each, no I/O beyond the cache writer's own bookkeeping).
#
# v2.0.131 (hotfix — plumb real reader-viewport margins into R4.c
# parser so its upfront `.idx` matches the render-time paginator
# config, fixing the FB2 "white screen on page turn" bug from v2.0.130):
#
# PROBLEM (v2.0.130 hardware trace):
#   * R4.c built the upfront `.idx` using parser-side defaults of
#     4-px margins on all sides (parser doesn't have access to
#     theme/viewport state).
#   * ReaderState's streaming-render path (R3.6) loaded the `.idx`,
#     computed its OWN configHash from the REAL viewport margins,
#     and rejected the file as `stale/corrupt` on every first visit
#     to a spine.
#   * Worse: R4.b emitted N empty Page objects based on R4.c's
#     pageCount.  When the real-margin paginator produced FEWER
#     pages than R4.c's count, the cache had ghost pages at the
#     tail.  Navigating to those ghost pages → renderMarkerizedPage
#     returned PageNotFound → fallback to legacy `page.render(empty)`
#     → WHITE SCREEN.
#   * Repro: open any FB2 section, turn pages to the end of the
#     section — last page rendered blank.
#
# ROOT CAUSE:
#   Hard-coded `cfg.marginTop = 4` (and bottom/left/right) in the
#   R4.c blocks of EpubChapterParser.cpp:602-605 and
#   Fb2Parser.cpp:428-431.  The actual ReaderState renderer uses
#   `vp.marginTop/Bottom/Left/Right` from `computeViewport()` which
#   incorporates renderer's orientation TRBL + theme tweaks + user
#   horizontal padding setting.  Typical real margins are ~16-32 px
#   on each side, NOT 4 — produces noticeably different page counts.
#
# FIX:
#   (1) `EpubChapterParser` and `Fb2Parser` gain a public setter
#       `setStreamingViewport(marginTop, marginBottom, marginLeft,
#       marginRight)` plus four private `streamingViewportMargin*_`
#       fields with backward-compatible 4-px defaults (preserves
#       behaviour when caller forgets to set them — though caller
#       always sets them in the v2.0.131 plumbing).
#   (2) R4.c blocks in both parsers now read `cfg.marginX` from
#       these fields instead of hard-coded 4.
#   (3) `ReaderStateAsyncJobs.cpp` call sites (background-cache
#       worker, TOC worker, page-fill worker — six total
#       construction points across EPUB + FB2) call the setter
#       immediately after `new EpubChapterParser/Fb2Parser` with
#       the active `vp.marginTop/Bottom/Left/Right`.
#   (4) `ReaderCacheController::prefetchNextEpubSpineCache` gains
#       an optional `const Viewport&` parameter; the lookahead +
#       transient parser construction inside it also call the
#       setter.  Default `Viewport{}` preserves any future caller
#       that doesn't know about it (no current callers besides
#       the async-jobs site).
#
# RESULT:
#   * R4.c writes `.idx` with hash matching what R3.6 expects →
#     no more `[STREAM] idx stale/corrupt spine=N (deleted)` log
#     spam.
#   * Parser-time pageCount equals render-time pageCount → R4.b
#     emits exactly the right number of empty Pages → no ghost
#     tail pages → no white screen.
#   * MEASURE walk no longer happens twice (once in parser at
#     wrong config, once again in render at right config) — saves
#     ~50-150 ms per first-visit cold extend.
#   * Resume points in the `.idx` are now consistent with the
#     paginator's actual byte positions → direct-seek resume on
#     subsequent renders is correct.
#
# v2.0.130 (R4.c — build `.idx` upfront via MEASURE-only walk during
# cold extend, so legacy parser is bypassed on FIRST chapter visit
# too, not just on repeats):
#
# R4.b (v2.0.129) short-circuited the legacy parser when `.idx`
# already existed.  But on a chapter's FIRST visit, `.idx` was
# absent (it built organically only DURING render via R4.a), so
# the legacy parser still ran the first time around — the chronic
# OOM source on memory-tight chapters.
#
# R4.c closes that gap: after `tryMarkerizeChapter` (R2) writes
# the markers sidecar but before R4.b's `.idx` check, both
# `EpubChapterParser` and `Fb2Parser` now run a MEASURE-only
# walk of the markers stream and write the discovered page-
# boundary table to `.idx`.  R4.b then short-circuits the legacy
# parser on the SAME first-visit call.
#
# IMPLEMENTATION:
#
# (1) `EpubChapterParser::parsePages` init path:
#     * After `tryMarkerizeChapter` succeeds.
#     * Skip if `.idx` already exists (R4.b will handle).
#     * Skip if markers file is missing (markerize failed).
#     * Open markers; build `StreamingPaginatorConfig` from
#       `renderer_.getScreenWidth/Height/getLineHeight(fontId)`
#       plus a conservative default of 4-px margins on all sides.
#     * Build a `GfxRendererPaginatorAdapter` with `drawSuppressed`
#       implied (paginator drawSuppressed_ flips depending on
#       targetPage vs currentPage; with `targetPage=UINT16_MAX`
#       it stays true throughout — no actual draw calls).
#     * Call `renderMarkerizedPage(..., targetPage=UINT16_MAX,
#       captureFn)` to walk the full stream.  Returns
#       `PageNotFound` at EOF; we don't care about the status,
#       only about the captured boundaries via `captureFn`.
#     * Serialize captured boundaries to `.idx` via
#       `serializePageIndex`.  Atomic write through `.work`
#       file → rename.
#     * Log: `[STREAM] idx built upfront spine=N pages=K bytes=B`
#       (skipping legacy parser).
#
# (2) `Fb2Parser::parsePages` init path:
#     * Parallel change with `[CONTENT][FB2]` log prefix.
#     * Uses `markersDir_ + "/" + startingSectionIndex_ + ".bin"`
#       path layout.
#
# COST ANALYSIS:
#
# MEASURE walk on a 100 KB chapter:
#   * ~25 chunks × 4 KB each
#   * Per-chunk: read 4 KB from LittleFS + paginate (no draws)
#   * Empirically: ~50-150 ms total on the BG worker
#   * Compare to legacy parser walk on same chapter: 1500-3000 ms
#     (Expat + Page tree alloc + serialize)
#
# Heap during MEASURE walk: paginator (~528 B) + adapter (~16 B)
# + chunk buffer (4 KB) all on stack.  ZERO heap allocations.
# vs legacy parser's 12-15 KB peak.
#
# Disk: ~800 B `.idx` file written.  Negligible.
#
# BEST-GUESS CONFIG:
#
# Page boundaries depend on viewport margins + font metrics.  The
# parser doesn't know the user's exact theme margins (those live
# in ReaderState), so it uses 4-px defaults.  Effect: pageCount
# may differ by ±1 from the eventual render-time config.  R3
# streaming-render path detects the configHash mismatch on first
# render and rebuilds `.idx` correctly — but the upfront count
# is good enough to bypass the legacy parser at cold-extend time.
#
# FLOW SUMMARY (v3_alpha after v2.0.130):
#
# First-ever visit to spine N:
#   prepare HTML/section            (~1 s — unchanged)
#   markerize sidecar               (~0.2 s — R2)
#   build .idx upfront via MEASURE  (~0.1 s — R4.c, NEW)
#   short-circuit emit empty pages  (~5 ms — R4.b)
#   sections/N.bin: ~600 B (was ~25 KB)
#   ✓ NO legacy ChapterHtmlSlimParser / Fb2Parser-via-Expat run
#   ✓ NO Page tree allocation → NO heap pressure
#
# Subsequent visits:
#   markerize cache hit                (~1 ms — R2)
#   (.idx exists → R4.c skips)
#   short-circuit emit empty pages     (~5 ms — R4.b)
#   ✓ Same: no legacy parser, no Page tree
#
# CHRONIC OOM ELIMINATED:
#
# `Aborting job: heap dangerously low (~15 KB free)` errors
# during cold extends should disappear entirely for chapters
# that successfully markerize.  Only failures of markerize
# itself (extremely rare — HtmlStripper is robust) fall back
# to legacy parser.
#
# v2.0.129 (R4.b — short-circuit legacy parser when `.idx` sidecar
# exists; emit empty Page objects to bypass Page-tree heap allocs):
#
# R4.a (v2.0.128) persisted the page-offset table to `.idx` so
# subsequent book-open sessions could skip the MEASURE-only walk
# inside the streaming render path.  But the cold-extend code
# path still ran `ChapterHtmlSlimParser` / `Fb2Parser` legacy
# Expat passes to populate `sections/<N>.bin` with serialized
# `Page` objects, allocating the heavy Page tree (~12-15 KB peak)
# even when streaming render later ignored those Page contents.
#
# This is the source of the chronic "Aborting job: heap dangerously
# low" failures during cold extends in v2.0.122-128 — the legacy
# parser is heap-heavy and the v3 streaming render path doesn't
# need its output.
#
# FIX (this commit): in both `EpubChapterParser::parsePages` and
# `Fb2Parser::parsePages` init paths, AFTER markerize runs and
# BEFORE the legacy parser is constructed, check if `.idx`
# exists for this spine/section.  If yes:
#   1. Read the .idx header (12 bytes — magic + version + hash +
#      pageCount).
#   2. Validate magic + version (don't validate config hash here —
#      page count is approximately stable across small font/margin
#      changes; the streaming render path validates strictly and
#      rebuilds .idx on mismatch).
#   3. Emit `pageCount` EMPTY `Page` objects via the cache-writer
#      callback.
#   4. Mark parser state as fully done (no resume).
#   5. Return success.
#
# The empty Page objects (~64 B each: just the `elements` vector
# header + reserved space for 48 entries that's never used)
# serialize to a tiny `sections/<N>.bin` file (~12 B per page +
# small overhead).  When the render path opens that page, the
# streaming path (R3.5) detects the markers sidecar and ignores
# the page contents entirely — no visible behaviour change.
#
# WHAT LANDED:
#
# (1) `lib/PageCache/src/EpubChapterParser.cpp` (~50 LOC):

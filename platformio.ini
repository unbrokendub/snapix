# v2.0.193 (TXT/Markdown cold-extend speculative headroom — amortise
# parser warmup across multiple pages instead of 1-page-at-a-time).
# Quick fix that gives ~half the SmolPort-for-TXT win at ~1/100th
# the refactor cost.
#
# THE OBSERVATION (from v2.0.190 hardware log):
# TXT cold-extend takes ~2.2 seconds to produce ONE page:
#   [458897] [CACHE] create start ... maxPages=1 skipPages=0
#   ...
#   [461106] [CACHE] create done  ... pages=1 partial=1
#   [461110] [CACHE] [PERF] cache-create: 2207 ms (pages=1 partial=1)
# Why maxPages=1?  In ReaderStateAsyncJobs::nextBatchSize() the EPUB
# branch adds +2 pages of speculative headroom (so a single-page
# request becomes a 3-page cold-extend), but TXT/Markdown fall
# through to the literal `remainingPages` count.  For a fresh book
# open at page 0 with cache empty, remainingPages = 1.
#
# So TXT users pay the full cold-extend overhead (open file, parse
# paragraphs through utf8NormalizeNfc, line-break + layout, persist
# 1 page, close file) for EVERY page-turn until the background
# worker catches up.  On heap-tight sessions the background worker
# is gated off entirely (the v2.0.190 log shows
# `skip background cache: heap critical (free=18852 largest=7668)`)
# so cold-extend per page-turn becomes the steady state.
#
# THE FIX:
# Extend the EPUB speculative-headroom code path to also cover TXT
# and Markdown.  Same kEpubInteractivePageFillHeadroomPages constant
# (2), same heap-tight guard.  So when a TXT user is on page 0 with
# empty cache, we ask for 1+2=3 pages in one cold-extend pass —
# amortising the parser warmup over 3 page outputs instead of 1.
#
# WHY THIS IS NOT THE FULL SmolPort INTEGRATION:
# Full TXT-through-SmolPort would replace PlainTextParser with a
# streaming markerized pipeline (TxtChapterParser + PlainTextMarkerize
# + UnifiedCache spine).  ~1500-2000 lines of new code + significant
# integration risk.  Deferred per user decision in this session.
# This v2.0.193 change gets ~50% of the perceived TXT-cold-extend
# win (cold-extend per N page-turns instead of per 1) at 3 lines
# of code + heap-tight safety net.
#
# CHANGES:
# * src/states/ReaderStateAsyncJobs.cpp — extend the EPUB branch
#   in nextBatchSize() to also include ContentType::Txt and
#   ContentType::Markdown.  Heap-tight check preserved.
#
# Build: clean.  Flash: ~0 (single condition change).  BSS: 0.
# Heap: 0 at steady state (more pages per cold-extend ≠ more
# memory, just less overhead per page).  Heap-tight guard keeps
# the headroom OFF in low-heap sessions so we don't compound the
# pressure that triggers the gate in the first place.
#

# immediately replaced by EPUB's ~88 B mutex.  Same size, allocated
# from same pool, lands in roughly the same heap region.  Fragmentation
# pattern unchanged.
#
# The real culprit is the v2.0.170 std::mutex addition itself.  Before
# v2.0.170, UnifiedCache instances were scope-bound to the caller's
# function: created, used, destroyed.  No mutex member, no FreeRTOS
# semaphore handle, no per-instance pinned bytes alive during the
# InflateReader allocation.  v2.0.168 worked.  v2.0.170 broke it.
# v2.0.171 was cosmetic-only and unchanged the breakage.  v2.0.172
# moved bytes around but didn't free any net bytes.
#
# FIX:
# Revert the entire v2.0.170 instance-caching layer.  Specifically:
#   * `UnifiedCache::shared(path)` becomes a plain factory:
#       return std::make_shared<UnifiedCache>(path);
#     Each call creates a fresh instance.
#   * The registry (CurrentEntry + currentMutex) is deleted.
#   * The per-instance `mutable std::mutex stateMutex_` is deleted.
#   * All `std::lock_guard<std::mutex> lk(stateMutex_)` in segmentSize,
#     readSegment, openSegmentReader, appendFrame,
#     writeSegmentStreamingDeferred, and liveSize are deleted.
#   * `#include <mutex>` removed from both .h and .cpp.
#
# This is functionally equivalent to v2.0.168 behaviour: per-call fresh
# UnifiedCache, no inter-call cache, no inter-thread sharing of one
# instance (each thread that needs a UnifiedCache calls `::shared()`
# and gets its own).  The v2.0.170 "latent concurrency bug" claim
# turns out not to apply in the no-cache regime: pre-v2.0.170 readers
# create their UnifiedCache INSIDE their read call (scan → read in one
# uninterrupted sequence), so there is no scan-then-later-read gap for
# a concurrent writer to race against.

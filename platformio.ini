#   v2.0.185's revert) showed 14 pages read after v2.0.189 with
#   ZERO multi_heap_free asserts.  Safe to re-apply lifecycle
#   hygiene on top.
#
# WHY THE CLEARS HELP:
# All three caches pin heap throughout a reading session and stay
# resident across book switches.  The NEXT book inherits a heap
# baseline 5-20 KB smaller than fresh-boot, which compounds with
# every subsequent switch.  Each cache HAS a reactive clear callsite
# that fires when free heap drops below a critical threshold — but
# reactive means "after the damage is done."  By the time the next
# book's chapter parse OOMs in cold-extend, the parser's allocations
# have already been forced into the smaller fragmented blocks.
# Clearing on exit gives the next book the fully-recovered heap
# from the very first allocation.
#
# COMBINED HEAP RECOVERY (v2.0.180 + v2.0.190):
#   * JPEGDEC instance release      ~25 KB (v2.0.180, always-on)
#   * ImageRenderCache clear         ~5-30 KB (v2.0.190, depends on

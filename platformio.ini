# bit-equivalent to v2.0.93 for chapter parsing behaviour.  SmolJpeg /
# SmolPng / EpubRenderWorkspace / FB2-image-routing fixes from
# v2.0.89–v2.0.95 stay intact — they're orthogonal to the HTML
# integration.
#
# Net Phase 3e status:
#   * Step 1 (shim infrastructure + unit tests):     DONE, in tree.
#   * Step 2 (integration into parseLoop/resume):    in tree, gated 0.
#   * Step 3 (debug the resume-zero-progress fault): pending; needs
#     hardware-in-loop tracing of `stopRequested_` / `aborted_` /
#     `fatalAbortRequested_` sets during a stuck-state resume.
#
# v2.0.97 (Phase 3e step 2 byte-cursor desync fix, gated by
# SNAPIX_SMOL_HTML):
#
# The post-v2.0.96 resume path on image-aborted chapters spun a second
# kind of "no-progress retryable" loop: spine=17 of Дорофеев "Путь
# джедая.epub" starts with an inline image whose extract aborts under
# heap pressure, and every retry on the same parser instance produced
# `parsePages resume done success=0 pagesCreated=0 hasMore=1
# suspended=1`.  Root cause was a cursor desync between the byte
# stream and the parser's observed-event stream.
#
# When an observer (the shim) returned `Stop` from a handler,
# `MarkerStreamReader::feed` bailed and `HtmlStripperToReaderSink`
# latched `stopped_=true`.  But `HtmlStripper::feed` kept processing
# the rest of the chunk, emitting markers that landed in the latched
# sink — dropped.  Stripper byte cursor advanced through the whole
# chunk; observer event cursor stopped at the marker that triggered
# the stop.  `bytesRead_` was bumped by the full chunk size before the
# feed, so on resume the file was seeked past the un-emitted-to-parser
# tail.  The parser never saw those events.  On short chapters whose
# remaining content fit in that tail, resume found nothing new to feed
# and returned with zero pages.
#
# v2.0.97 fixes the cursor mismatch by giving `HtmlStripper` a
# cooperative-stop hook (`HtmlStripperSink::shouldStop`) and changing
# `HtmlStripper::feed` to return the count of bytes actually consumed.
# `HtmlStripperToReaderSink::shouldStop` returns its latched stopped_
# flag; the stripper checks at every byte boundary and bails as soon
# as the sink reports stop.  `parseLoop` then rewinds `bytesRead_` and
# `srcSeek`s the file back by the un-consumed tail so the next resume
# starts feeding from the exact byte where events stopped reaching
# the parser.  Default env still passes a sink whose `shouldStop`
# returns false (the base-class default), so the legacy synchronous
# drain stays bit-identical.
#
# v2.0.96 (Phase 3e step 2 hot-extend regression fix, gated by
# SNAPIX_SMOL_HTML):
#
# `ChapterHtmlSlimParser::resumeParsing` opens with a guard:
#     if (!suspended_ || !xmlParser_) return false;
# Under `SNAPIX_SMOL_HTML=1` the parser never creates expat
# (`xmlParser_` stays nullptr by design — the byte-marker pipeline
# replaces it), so the `!xmlParser_` half of the guard short-circuited
# every resume call to a no-op `false`.  EpubChapterParser then
# reported `parsePages resume done success=0 pagesCreated=0 hasMore=1
# suspended=1` and the hot-extend retry loop spun forever on partial
# chapter caches.  Visible symptom on the user's Дорофеев "Путь
# джедая.epub" at spine=16: the first 3 pages rendered fine, the
# 4th-onwards never appeared, and the BG cache hot-extend cycled
# `parsePages resume retryable no-progress` indefinitely.
#
# v2.0.96 splits the guard along the `#if SNAPIX_SMOL_HTML` axis:
# under the flag we check just `suspended_` (the stripper / reader /
# shim chain state already lives in parser members, no parallel-state
# pointer needs the null-check).  Default env keeps the original
# guard exactly.
#
# v2.0.95 (FB2 image decode routing through SmolJpeg, gated by
# SNAPIX_SMOL_JPEG):
#
# Mirror of the v2.0.89 EPUB fix for the FB2 side.  `Fb2::decodeImageDirect`
# was the last call site still going straight to JPEGDEC's two-tier
# allocation pattern (~25 KB shared workspace + ~12-15 KB per-decode
# scratch arena); on a tight heap (image-heavy chapter + concurrent
# UI render) the arena alloc OOM'd and the image stayed a placeholder
# until N retries either succeeded or the .failed sentinel was
# written.  Reproduced on Дорофеев "Путь джедая" (FB2 build) at
# spine=17 page=1, where image i_030.jpg got stuck despite the
# JpegState pooling and stripper rewrite shipped in v2.0.92-94 —
# those covered the EPUB call path only, FB2 has its own
# Base64JpegPump → JPEGDEC pipeline.
#
# v2.0.95 adds a `Base64PumpInputStream` adapter in Fb2.cpp that
# bridges the forward-streaming base64 pump onto SmolJpeg's
# random-access `InputStream` (handled via rewind + forward-skip
# through a 128 B throwaway buffer; backward seeks are vanishingly
# rare on the EPUB / FB2 corpus).  `Fb2::decodeImageDirect` now
# attempts SmolJpeg first and falls through to the JPEGDEC path on
# any decoder error, with the tmp BMP file closed-and-reopened
# between attempts so a partial SmolJpeg 1-bit header doesn't
# contaminate the JPEGDEC 2-bit output.
#
# v2.0.94 (Phase 3e step 2 — HTML stripper integration, gated by
# SNAPIX_SMOL_HTML in v3_alpha; default env keeps expat):
#
# The chapter parse loop now drives `HtmlStripper` →
# `MarkerStreamReader` → `MarkerStreamShim` → ChapterHtmlSlimParser's
# existing static handlers, instead of feeding expat.  Expat is no
# longer constructed under the flag — `XML_ParserCreate` etc. are
# gated `#if !SNAPIX_SMOL_HTML`, so the ~5-10 KB heap allocation that
# expat performs per chapter parse is eliminated.
#
# Suspension / resumption: the byte-marker pipeline replaces
# `XML_StopParser` / `XML_ResumeParser` with a flag-driven
# `markerSink_.wasStopped()` latch.  Handlers that want to suspend set
# `stopRequested_` (resumable) or `fatalAbortRequested_` (non-resumable);
# `MarkerStreamShim::propagateStop()` translates these to
# `ObserverStatus::Stop` on its next return, which bails the reader's
# feed, latches the sink, and lets the parseLoop driver decide between
# suspend-and-srcClose vs cleanup-and-return.  All 7 legacy
# `XML_StopParser(xmlParser_, …)` sites stay in place under the `if
# (xmlParser_)` guard already there — they're skipped at runtime when
# `SNAPIX_SMOL_HTML=1` because `xmlParser_` stays null.
#
# State across suspend: the four pipeline members (htmlStripper_,
# markerReader_, markerSink_, markerShim_) are value-typed members of
# `ChapterHtmlSlimParser`, so their state survives a suspend / resume
# trivially — `resumeParsing` just reopens the source at `bytesRead_`,
# clears the sink's stopped latch, and drops straight back into
# `parseLoop`.  No replay, no XML_ResumeParser equivalent needed.
#
# What this gives up (documented in MarkerStreamShim.h):
#   * Class- / style- / dir- / role- / epub:type- / aria-hidden-based
#     parser logic.  HtmlStripper only forwards `src` and `id`.  In
#     practice: CSS-class bold/italic/centre/RTL inheritance, Pandoc
#     aria-hidden empty-anchor skip, `<div role="doc-pagebreak">` skip
#     all degrade silently to "as if the attribute wasn't there".
#   * Most non-styled tag opens.  The shim wraps text runs in synthetic
#     `<p>` ... `</p>` pairs to keep block-boundary dispatch firing.
#
# Size impact (v3_alpha): +6.8 KB Flash (new parse path + Markers /
# Stripper / Reader / Shim libs linked in), no BSS delta — the
# pipeline members live inside the parser instance, not as BSS.
# Default env (flag=0) is bit-identical.
#
# v2.0.93 (Phase 3e step 1 — HTML stripper shim infrastructure):
#
# `lib/Epub/src/Epub/parsers/MarkerStreamShim.{h,cpp}` adds a
# MarkerObserver subclass that translates SmolPort byte-marker events
# into expat-compatible `startElement` / `characterData` / `endElement`
# calls into `ChapterHtmlSlimParser`'s existing static handlers.  This
# is option 1 ("adapter shim, lower risk") from
# `lib/SmolPort/README.md`'s Phase 3 integration sketch.
#
# What the shim CAN'T preserve (documented in MarkerStreamShim.h):
#   * `class` / `style` / `dir` / `role` / `epub:type` / `aria-hidden`
#     attributes — `HtmlStripper` only forwards `src` and `id`.  Loses
#     CSS-class-based bold / italic / centre / RTL, `<div>` pagebreak
#     skip, Pandoc-style aria-hidden empty-anchor skip.
#   * Most non-styled tags (`<div>`, `<span>`, `<p>` opens) — silently
#     elided.  The shim synthesises a `<p>` wrapper around each
#     paragraph-bounded text run so the block-dispatch path still fires.
#   * `<img alt="...">` text.
#
# What ships in v2.0.93:
#   * Shim class + tests at host-compile level.  Builds cleanly under
#     both `SNAPIX_SMOL_HTML=0` (dark code, dropped by LTO; flash bit-
#     identical to v2.0.92) and `SNAPIX_SMOL_HTML=1` (currently
#     unused — the chapter parser's main loop still drives expat).
#
# What's deferred to Phase 3e step 2:
#   * Wiring the shim into `parseAndBuildPages` / `resumeParsing`.
#     expat's `XML_StopParser` / `XML_ResumeParser` mechanism is hit
#     from 7 sites for cooperative-abort + page-boundary suspend; the
#     `HtmlStripper` is a pure forward state machine and needs a
#     parallel suspension scheme (probably a "save byte cursor, restart
#     stripper at cursor" replay).  Each `XML_StopParser` call site
#     needs an alternative for the shim path before we can swap.
#
# v2.0.92 (SmolJpeg state pooling, gated by SNAPIX_SMOL_JPEG):
#
# `decodeTo1BitBmp` used to allocate a fresh ~8.4 KB `JpegState` on the
# heap per call and free it before return.  Under concurrent UI render
# + BG cache parse + image drain the largest-free-block routinely fell
# below the JpegState size, producing the `SmolJpeg(flash) decode failed
# (alloc-failed)` cascade and forcing the slow picojpeg fallback (see
# v2.0.89 hardware log).
#
# v2.0.92 holds the JpegState as a single BSS instance protected by a
# FreeRTOS mutex.  Idle heap is ~8.5 KB lower in v3_alpha (BSS shifted)
# but the JpegState allocation never affects largest-free-block at
# parse time — the watermark we actually watch for layout aborts.  In
# the default env LTO drops the entire SmolJpeg call graph (no
# references through the disabled flag), so the BSS reservation costs
# nothing there.
#
# v2.0.91 (image-blacklist regression fix):
#
# `ChapterHtmlSlimParser::cacheImage` used to session-blacklist any image
# whose extract or convert phase aborted with `LowMemory` OR `Timeout`.
# That made sense for Timeout — a genuinely oversized JPEG will burn the
# same wall-clock budget on every cold-extend retry — but LowMemory was
# misclassified as permanent.  In practice LowMemory is the cooperative
# `MIN_FREE_HEAP=8 KB` abort firing because the UI page-render task is
# concurrently decoding a different BMP and momentarily compresses the
# heap below the threshold.  Two seconds later largest_free is 16 KB+ and
# the image would extract fine — but the blacklist had already poisoned
# the srcHash, so the image stayed a placeholder until reboot.  The user
# hit this on image/38.jpg in Дорофеев Максим — Путь джедая.epub at
# spine=25, page=2.
#
# v2.0.91 narrows the blacklist condition to Timeout only.  LowMemory now
# returns `retryable=true` (matching the StopRequested branch), so the
# BG cache cold-extend re-attempts on the next chapter visit when the
# heap will typically have recovered.
#
# v2.0.90 hardware-bring-up follow-up (the "stripped workspace" pass):
#
# The first cut shipped the full `EpubRenderWorkspace` struct from
# Phase 4a (htmlReadBuf 2 KB, wordWidths 512 B, lineBreaks 128 B,
# partWordBuf 256 B, align/list stacks, anchors 1 KB, arena 8 KB) —
# total 12 KB BSS.  Only the anchor map + arena are wired in 4b; the
# other fields are placeholders for Phase 4c.  Carrying them in BSS
# pre-integration cost 7 KB of heap headroom for no functional win,
# which pushed image-heavy Calibre chapters below the
# `MIN_LAYOUT_FREE_HEAP = 10 KB` watermark — chapter 23/24 of the user's
# test EPUB reported `Insufficient memory for layout (7668 bytes)` /
# (9204 bytes) and aborted with no pages produced.  Stripping the
# struct to just `anchors[256]` + `stringArenaBuf[4096]` returns
# ~7 KB to the runtime heap; Phase 4c will re-add the other fields
# alongside their integration sites so each KB of BSS earns its keep.

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

build_unflags = -fno-lto -Os

board_upload.flash_size = 16MB
# v2.0.60: factory partition is 6.25 MB (0x640000) — see partitions.csv.
# Was 16 MB (whole-flash) before the OTA-drop repartition; that was a
# meaningless overshoot that hid app-bloat from build-size reports.
board_upload.maximum_size = 6553600
board_upload.offset_address = 0x10000

build_flags =
  -flto=auto
  -O2
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
# Disable Arduino HAL internal SPI/UART/I2C locks.  On single-core ESP32-C3
# with the ESP-IDF SMP FreeRTOS port, releasing a priority-inheriting mutex
# (xSemaphoreCreateMutex) triggers an xTaskPriorityDisinherit assertion
# crash (pxTCB == pxCurrentTCBs[0]).  SharedBusLock already serialises all
# SPI access, so the Arduino-internal paramLock / spi->lock are redundant.
  -DCONFIG_DISABLE_HAL_LOCKS=1
# Enable UTF-8 filenames for Cyrillic and other non-ASCII characters
  -DUSE_UTF8_LONG_NAMES=1
# SdFat: close file handle in FsFile destructor (defense-in-depth against FD leaks)
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=1
# Enable DTD processing so XML_UseForeignDTD works for HTML entity resolution
  -DXML_DTD
  -DXML_CONTEXT_BYTES=512
  -std=c++2a
  -Isrc
  -Ilib
  -Ilib/Epub
  -Ilib/Fb2

; Board configuration
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

extra_scripts =
  pre:scripts/build_html.py

; Libraries (SDK libs now in lib/ folder)
lib_deps =
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  kikuchan98/pngle @ 1.0.2
  file://lib/Hyphenation

[env:default]
extends = base
build_flags =
  ${base.build_flags}
  -DSNAPIX_VERSION=\"${snapix.version}-dev\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DSNAPIX_PERF_LOG=1
# v3 release flags.  These match the hardware-verified v3_alpha pipeline:
# Smol JPEG/PNG decoders, marker sidecars, and markerized streaming render
# are now the normal dev build.  SMOL_HTML and UNIFIED_CACHE remain off
# until their own rollout completes.
  -DSNAPIX_SMOL_JPEG=1
  -DSNAPIX_SMOL_HTML=0
  -DSNAPIX_STATIC_WORKSPACE=1
  -DSNAPIX_UNIFIED_CACHE=0
  -DSNAPIX_SMOL_PNG=1
  -DSNAPIX_MARKERIZER=1
  -DSNAPIX_MARKERIZED_RENDER=1

[env:release]
extends = base
build_flags =
  ${base.build_flags}
  -DSNAPIX_VERSION=\"${snapix.version}\"
  -DLOG_LEVEL=0
  -DSNAPIX_PERF_LOG=0
  -DSNAPIX_SMOL_JPEG=1
  -DSNAPIX_SMOL_HTML=0
  -DSNAPIX_STATIC_WORKSPACE=1
  -DSNAPIX_UNIFIED_CACHE=0
  -DSNAPIX_SMOL_PNG=1
  -DSNAPIX_MARKERIZER=1
  -DSNAPIX_MARKERIZED_RENDER=1

[env:gh_release]
extends = release

# v3_alpha is retained as an explicitly logged/dev alias for the v3 pipeline.
[env:v3_alpha]
extends = base
build_flags =
  ${base.build_flags}
  -DSNAPIX_VERSION=\"${snapix.version}-v3alpha\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DSNAPIX_PERF_LOG=1
  -DSNAPIX_SMOL_JPEG=1
  -DSNAPIX_SMOL_HTML=0
  -DSNAPIX_STATIC_WORKSPACE=1
  -DSNAPIX_UNIFIED_CACHE=0
  -DSNAPIX_SMOL_PNG=1
# v2.0.116 Phase R2 — markerize side-channel ON in v3_alpha.  Writes
# `<cachePath>/markers/<spine>.bin` once per chapter (best-effort);
# legacy parser path still drives the actual page-cache build.  Phase
# R3 will switch the render path to consume markers instead of the
# old Page tree.
  -DSNAPIX_MARKERIZER=1
# v2.0.122 Phase R3.5 — streaming render path.  Enabled in v3_alpha
# starting v2.0.124 for hardware verification.  When the markers
# sidecar exists for the current spine, render goes through the v3
# streaming pipeline (StreamingPaginator + GfxRendererPaginatorAdapter)
# instead of the legacy `page.render()` Page-tree path.  Logs
# `[STREAM] markerized render done spine=N page=P skipped=K bytes=B`
# on success, falls back silently to legacy on any failure.
  -DSNAPIX_MARKERIZED_RENDER=1
  ; v2.0.88: bump loopTask stack from default 8 KB to 16 KB.  SmolJpeg /
  ; SmolPng decoders run on loopTask via the cover-gen / inline-image
  ; path; the outer call chain (ReaderState → ContentHandle → Epub →
  ; ZipFile extract → ImageConverter → SmolJpeg → decodeBaselineStream)
  ; bottoms out at ~4 KB of stack consumed BEFORE the decoder runs, and
  ; the decoder itself adds ~1 KB at the deepest call site even after
  ; the v2.0.88 heap-allocation pass (BitReader / coef / pix moved to
  ; OwnedArray).  8 KB total left ~3-4 KB unused which observed cover
  ; JPEG (1026×1500) consistently overran.  16 KB gives ~8 KB headroom
  ; and costs +8 KB always-pinned heap — acceptable in v3_alpha for
  ; alpha-testing the new decode pipeline; default env stays at 8 KB.
  ;
  ; v2.0.184: re-bumped 16384 → 24576 (24 KB) after hardware repro of
  ; stack-protection panic in loopTask during cold-extend rebuild of
  ; a chapter with an inline image (EpdFontLoader::loadForStreaming
  ; at the bottom of a render→cacheImageForStreaming→JPEG-pump→font
  ; chain that consumed 18.7 KB).  See src/main.cpp comment block at
  ; getArduinoLoopTaskStackSize() for the heap-cost trade-off
  ; (v2.0.180+183 lifecycle-hygiene wins more than cover this 8 KB).
  -DCONFIG_ARDUINO_LOOP_STACK_SIZE=24576

# THE ALLOCATION STRATEGY:
# init(true, externalBuffer) now uses a three-tier scheme:
#   1. PRIMARY: dedicated 32 KB BSS `gInflateScratch[]`, guarded by a
#      single `gInflateScratchInUse` flag.  Used whenever the flag is
#      clear, which is the common case — only one inflate operation
#      runs at a time in the current architecture.
#   2. CONCURRENT FALLBACK: if the BSS scratch is somehow already in
#      use (shouldn't happen — see CONCURRENCY note below), fall back
#      to the caller's externalBuffer if provided.
#   3. LAST-RESORT FALLBACK: if no external buffer, malloc 32 KB from
#      heap.  This is the v2.0.176 primary path, kept as a defensive
#      net for unanticipated edge cases.
#
# CONCURRENCY:
# A single global BSS buffer is sufficient because the codebase only
# runs ONE inflate operation at a time:
#   * EPUB metadata load (container.xml, content.opf, NCX, NAV, CSS)
#     — main thread (loopTask), during book open, before the BG
#     ReaderAsync task is spawned.
#   * Chapter markerize (R-series streaming pipeline) — BG ReaderAsync
#     thread, after metadata load completes.
#   * Image extract during streaming render (cacheImageForStreaming)
#     — BG ReaderAsync thread, sequential within the chapter render
#     pipeline (markerize finishes before any image extract begins).
#   * Cover decode — uses JPEGDEC, not uzlib; no overlap possible.
# If a future workload introduces genuinely concurrent inflate (e.g.,
# parallel chapter pre-fetch), tier-2 (externalBuffer) catches the
# conflict and tier-3 (heap) catches it again with a fresh malloc.
# A TODO comment in the .cpp notes the place to add per-instance
# buffers if the architecture changes.
#
# DISPLAY-CORRUPTION ELIMINATION:
# v2.0.174 routed streaming inflate through the display framebuffer
# (renderer.getFrameBuffer() returned via sharedZipDictBuffer()) to
# dodge heap-32 KB fragmentation failures.  That dodge introduced a
# display-side data race: the e-paper driver's deferred RED-RAM
# upload (which fires ~450 ms after each BW upload, to preload the
# inverse layer for the next refresh) reads the framebuffer a second
# time.  If inflate started during that 450 ms window, the RED-RAM
# upload shipped uzlib dictionary bytes to the panel — right half of
# the screen turned black/random on every chapter parse.  v2.0.176
# mitigated by preferring heap when available.  v2.0.177 closes the
# loop: tier-1 (BSS) handles every real call, the framebuffer is
# never touched for streaming inflate, and the display-corruption
# symptom is structurally impossible.
#
# WHY NOT ALSO MOVE THE JPEG DECODER TO BSS:
# Considered but deferred.  The JPEGDEC instance is ~25 KB (Huffman
# tables + MCU buffer + dither workspace) and the per-decode arena is
# another ~13 KB — total ~38 KB, doesn't fit a 32 KB shared buffer.
# Putting the JPEGDEC instance in BSS as its own 25 KB allocation
# would relocate but not save memory (the instance is already kept
# heap-pinned across decodes via gSharedJpegDec).  The arena could
# in principle share gInflateScratch's 32 KB, since inflate and JPEG
# decode never run at the same time — but the JPEGDEC C++ API
# doesn't accept an external arena pointer, so making this work
# would require either patching JPEGDEC (out of scope) or sharing
# via union/placement-new (fragile, error-prone for a marginal gain).
# Leave for a future refactor if JPEG-decode-related fragmentation
# becomes a measured problem.  Currently it isn't — JPEG only runs
# at book-open time, when the heap is at its boot state and has
# plenty of contiguous space.

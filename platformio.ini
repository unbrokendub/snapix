# Cost: spinner's final centre can be up to 4 px off the banner's
# true centre (the snap rounds to nearest 8 — max error ±4).  Banner
# is symmetric ±padH=24 around the content, so 4 px off is invisible
# in practice.  Text follows spinner, so they STAY aligned regardless.
#
# FIX 2 — FB2 XML parse heap-OOM crash handler.
#
# Hardware repro: opening Chang_H FB2 (different book, first cold load)
# crashed with abort() during expat parse → vector<TocItem>::push_back
# → _M_realloc_append → __throw_length_error (actually bad_alloc on
# OOM).  The backtrace decoded as:
#   __cxxabiv1::__terminate → __cxa_call_terminate → __gxx_personality_v0
#   → _Unwind_RaiseException_Phase2 → uw_init_context_1 → panic_abort
# Standard C++ "uncaught exception → terminate → abort" path.
#
# Root cause: `Fb2::endElement` calls `tocItems_.push_back(...)`.  When
# the vector needs to grow but realloc fails (heap fragmented or
# exhausted by this large FB2 file's parse-time allocations), libstdc++
# throws `std::bad_alloc`.  expat is C — its callback dispatch can
# propagate C++ exceptions THROUGH it, but `parseXmlStream` had no
# try/catch around `XML_Parse(...)`, so the exception escaped up the
# task stack to the root → terminate.
#
# This is a pre-existing latent bug exposed by Chang_H specifically
# (more TOC items than other tested books).  v2.0.196 didn't cause it
# but didn't catch it either; v2.0.197 makes it survivable.
#
# Fix: wrap the XML parse loop in `parseXmlStream` in try/catch for
# `bad_alloc`, `length_error`, `std::exception`, `...`.  All paths
# set `success = false`, which propagates as a load failure.  The
# user sees a "Failed to load FB2" toast/log instead of the device
# rebooting with a panic stack dump.
#
# Followup TODO (not in this version): make FB2 parse memory-aware —
# track heap during parse, bail out early when toc/binary indexes
# grow past a threshold.  Currently the parse runs to completion or
# OOM; better to fail fast with a "book too complex for available
# heap" error than fragment the heap and then fail later.
#
# CHANGES:

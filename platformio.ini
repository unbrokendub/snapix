#   The `.idx` sidecar (R4.a) stores byte-offset-per-page produced by
#   the paginator's earlier run.  Upgrading from v2.0.132 to v2.0.133
#   leaves on-disk `.idx` files holding offsets from the OLD layout.
#   When v2.0.133's render path resumes at those offsets, it starts
#   mid-(previous-page) in the NEW layout — renders the tail of page
#   N-1 (which fits in half a page or so), hits pageFull, stops.
#   User sees a half-filled page with content that doesn't even match
#   what page N is supposed to be.

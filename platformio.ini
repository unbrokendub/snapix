# THE REGRESSION (v2.0.198 hardware repro):
#
# v2.0.198 switched the per-frame animation refresh from `displayWindow`
# (partial region) to `displayBuffer(FAST_REFRESH)` (full screen) to
# eliminate cross-talk ghosting that v2.0.197 showed.  Side effect: full-
# screen refresh writes 96 KB to display RAM per tick (BW + RED).  At
# the e-ink SPI throughput of ~250 KB/s, that's ~400 ms of bus traffic
# every 500 ms (the v2.0.196 tick cadence).  ESP32-C3 is single-core;
# while the main task held the SPI bus, the BG worker — which needs
# LittleFS reads for page cache I/O — got starved.
#

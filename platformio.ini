# THE FIX (UX-only, no perf change):
# 10-frame rotating spinner bitmap, centred in the banner above the
# status text.  Each frame is a 64x64 1-bit packed bitmap (512 B
# in flash); 10 frames = 5120 B total in `.rodata` — zero RAM cost.
#
# Animation cadence: ≥500 ms between frames.  Driven by a tick called
# from every render() iteration while a pending load is active; the
# tick itself rate-limits internally (a tick within the 500 ms window
# is a ~µs no-op).  Each frame transition uses `displayWindow` (fast
# partial refresh of just the 64x64 spinner region — ~470 ms total)
# instead of a full-panel refresh.
#
# Why 500 ms / 2 fps and not faster:
#   E-ink fast partial refresh wall time on Xteink X4 is ~420 ms
#   (per `Wait complete: fast (423 ms)` in the monitor log).  Anything
#   under 500 ms queues refreshes faster than the panel can complete
#   them.  2 fps is the practical ceiling for e-ink animation and
#   matches the rotation cadence well — each tick advances the leader
#   segment by 36° (10 frames × 36° = 360°), so a full rotation takes
#   ~5 s.
#
# Why programmatic spinner instead of converting the user's GIF:
# The user supplied a 480x438 GIF (117 frames) of a fading-trail
# spinner.  Converting the trail's grayscale gradient to 1-bit via
# threshold OR dither produced inconsistent frames — some "later"
# segments disappeared entirely at small sizes (64x64), making the
# rotation look broken.  Generated 10 frames programmatically: 12
# uniform-width segments arranged in a circle, with ONE leader segment
# drawn thicker + longer (acts as the rotation cue).  Cleaner on 1-bit
# AND smaller (deterministic encoding, no gradient artefacts).
#
# Layout:
#   +-- bannerW ------+
#   |   [64x64 ☼]    |  ← rotating spinner (animated)
#   |   Loading...   |  ← status text below
#   +----------------+
# Banner size grows from ~250x70 (pre-v2.0.196 box-icon banner) to
# ~150x130 (compact, text-width-or-spinner-width whichever is larger).
# Drive-all refresh on first render (no ghosting); subsequent tick
# refreshes use fast partial-window for just the spinner region.
#
# CHANGES:
# * load_animation/generate_spinner.py (new) — Python script that
#   renders 10 PNG frames + emits `LoadingAnimation.h` with packed
#   bitmaps.  Re-run after editing if you want to tune segment count,
#   size, leader styling.
# * src/states/reader/LoadingAnimation.h (new, generated) — `kFrames[]`
#   array of 10 const uint8_t[512] in `.rodata` namespace
#   `snapix::loading`.  Width/height/count constants alongside.
# * src/states/ReaderState.h — added `tickLoadingAnimation(Core&)`
#   declaration + state members (frame index, last-tick ms,
#   spinner XY for tick-time fast-redraw, overlay-active flag).
# * src/states/ReaderState.cpp:
#   - Top-of-file: `#include "reader/LoadingAnimation.h"`.
#   - `renderCenteredStatusMessage` rewritten to centre the 64x64
#     spinner above the status text (replaces the old 14x20 box+X
#     icon next to the text).  Saves spinner XY for tick reuse.
#   - New `tickLoadingAnimation()` method.  Rate-limited 500 ms;
#     advances frame index; redraws spinner bitmap at saved XY;
#     fast partial-window refresh.  Skips if `needsRender_` (full
#     page render is about to wipe the banner anyway).
#   - `displayWithRefresh()` start: clear `loadingOverlayActive_`
#     so any full-frame refresh deactivates the spinner ticker
#     (next pending wait starts fresh from frame 0).
# * src/states/ReaderStateOverlays.cpp `processPendingEpubPageLoad`
#   — after `renderCenteredStatusMessage`, call `tickLoadingAnimation`
#   on each iteration.  Rate-limited internally.
# * src/states/ReaderState.cpp `render()` (TOC-jump + page-load
#   branches) — same tick call after the banner setup.

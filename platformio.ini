# THE EXPLICIT TWO-STEP REASSIGN (cur.ptr.reset() before
# cur.ptr = new ...) matters: it guarantees the old shared_ptr's
# destructor runs (and the old instance is potentially destroyed)
# BEFORE the new instance's constructor runs.  Single-step
# `cur.ptr = std::make_shared<...>()` would order constructor-before-
# destructor; on a fragmented heap that briefly holds BOTH instances
# is exactly the failure mode we're fixing.

# v2.0.179 (Rust-embedded style refactor #5: replace small
# std::unordered_map<std::string, ...> instances with sorted-vector +
# binary search.  Drops ~40 B/entry hash-bucket overhead from per-book
# metadata structures.  Three maps converted:
#   * ContentOpfParser::manifestIndex (transient during OPF parse,
#     ~30-150 entries) — saves ~1-6 KB transient heap during book open.
#   * Fb2::binaryIndex_ (persistent per FB2 book, ~5-50 entries) —
#     saves ~200 B - 2 KB persistent heap during reading.
#   * Fb2::peekedSourceDims_ (per-FB2-session cache, ~5-15 entries) —
#     converted to linear-scan vector (small N, hashing not worth it),
#     saves ~200-600 B per FB2 reading session.

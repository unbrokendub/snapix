# v2.0.166 (architectural — Phase 5 UnifiedCache, part 1 of 2.  Introduces
# a new `lib/UnifiedCache` library that wraps a single per-book
# `streaming.cache` file holding log-structured frames for the
# streaming-sidecar caches the v3 pipeline writes (markers, idx,
# metrics).  This build migrates ONLY the `metrics.bin` cache as a
# proof-of-concept; markers and idx files keep their existing
# per-spine layout until v2.0.167.
#
# WHY two-build split: the format is the largest on-disk layout change
# since v2.0.60 moved the page cache from SD to LittleFS.  Validating
# the format end-to-end with one small cache type (metrics, ~400 bytes
# per book) before migrating the bigger markers/idx (~50 KB per book,
# 10-50 segments) is the safer rollout — if the UnifiedCache format
# has a bug it can only hurt metrics, which already has a graceful
# fallback (slow probe loop) when the cache miss.
#
# NEW LIBRARY (`lib/UnifiedCache/`):
#   * `UnifiedCache` class — opens/creates `<bookCachePath>/streaming.cache`,
#     in-memory directory built by sequential frame scan on first open
#   * API: `readSegment(kind, key, &out)`, `writeSegment(kind, key,
#     data, size)`, `openSegmentReader(...)` for streaming reads,
#     `writeSegmentStreaming(...)` for streaming writes,
#     `removeSegment(...)` via tombstone frame
#   * `Kind` enum: Markers / Idx / Metrics (markers + idx wired in
#     v2.0.167)
#   * Format: 16-byte header (magic "UCAC" + version + flags) followed
#     by 8-byte frame headers (kind + flags + key u16 + size u32) and
#     payloads.  Updates are append-only — latest frame for a (kind,
#     key) wins.  Old frames become garbage; compaction is a future
#     manual pass (not implemented yet, but log-structured layout
#     keeps the file readable until then).
#   * Total LOC: ~330 (h) + ~250 (cpp) = ~580 across the new library
#

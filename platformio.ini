# v2.0.135 (hotfix — fix spurious inter-word spaces at inline-style
# toggles in StreamingPaginator.  Root cause of half-page rendering
# and "hieroglyphs" reported on Russian EPUBs even after v2.0.134's
# .idx invalidation):
#
# PROBLEM (hardware screenshot — Russian «Гибкий ум» EPUB after v2.0.134):
#   * Lines wrap at HALF the screen width (left half filled with
#     text, right half blank or noisy).
#   * Some characters appear shifted/glued in ways that look like
#     garbled glyphs ("hieroglyphs" per user).
#   * Persists after Clear Book Cache, so NOT a stale-.idx issue
#     (v2.0.134's fix was real but addressed a different bug).
#
# ROOT CAUSE (audit):
#   v2.0.133's partial-word buffer was needed to fix UTF-8 corruption
#   at chunk boundaries — but it introduced a sibling bug at INLINE
#   STYLE TOGGLES.  HTML `хо<b>ро</b>шо` strips to:
#     onText("хо"), onBoldStart, onText("ро"), onBoldEnd, onText("шо")
#   v2.0.133 buffers each text run as a partial, then commits it via
#   flushPartWord from the style-change event handler.  Each commit
#   creates a separate WordSlot in the paginator's per-line buffer.
#   `flushLine` then walks the slots and inserts `spaceWidth` between
#   every adjacent pair → visible rendering "хо ро шо" with two
#   spurious spaces where source had none.
#
#   In Russian non-fiction with frequent italics and bold (foreign
#   terms, emphasis, footnote markers), an average paragraph emits
#   30-50 spurious spaces.  Cumulative width pushes line breaks
#   far earlier than intended — visible as the half-page wrapping.
#
#   The bug ALSO existed pre-v2.0.133 (pre-fix submitted each text
#   run as a separate word immediately), but was less visible because
#   pre-fix ALSO had UTF-8 corruption at chunk boundaries which
#   masked the alignment shift.  After v2.0.133 fixed UTF-8 but kept
#   the per-slot space, the alignment shift became the dominant
#   visual artifact.
#
# FIX:
#   1. `WordSlot` gains a `bool noLeadingSpace` field.  Default
#      false (normal inter-word spacing).
#
#   2. `StreamingPaginator` gains a `bool partWordContinuation_`
#      member.  Set true when:
#        - `flushPartWord(setContinuation=true)` submits a partial
#          word (called from every non-text event handler — line
#          break, paragraph break, style start/end, page break).
#        - onText's buffer-overflow branch flushes a truncated
#          partial that has more bytes coming.
#      Cleared when:
#        - Consumed by `tryAddWord` (one-shot per submission).
#        - Start of onText with leading whitespace (source had a
#          normal word break).
#        - `resetForChapter` / `resetForNextPage` / `emitCarryWord`.
#
#   3. `tryAddWord` consumes `partWordContinuation_` at entry; the
#      consumed value becomes the new slot's `noLeadingSpace`.  The
#      cursor-advance arithmetic skips the leading spaceWidth when
#      `noLeadingSpace` is true.
#
#   4. `flushLine` honours `slot.noLeadingSpace` — only inserts
#      `spaceWidth` between slots that have it false.
#
#   5. `onText`'s partial-continuation path (whitespace arrived to
#      complete a buffered partial) calls `tryAddWord` DIRECTLY (not
#      via `flushPartWord`), so it does NOT raise the continuation
#      flag — the natural whitespace separator means the next word
#      gets normal inter-word spacing.
#
# RESULT:
#   * `хо<b>ро</b>шо` renders as visible "хорошо" with three slots
#     for style purposes but ZERO inter-word spaces — correct.
#   * `хо <b>ро</b>шо` renders as "хо рошо" — space between "хо"
#     and "ро" (source had space), but "ро" and "шо" glue (source
#     had no space).
#   * Russian paragraphs no longer accumulate spurious widths from
#     inline emphasis; lines wrap at the actual right margin.
#   * UTF-8 chunk-boundary fix from v2.0.133 still works (chunk-
#     boundary partial completion goes through `tryAddWord` direct
#     path which doesn't raise the flag).
#
# UNIT TESTS (6 new — T17-T22 in StreamingPaginatorTest.cpp):
#   T17: `abc<b>def</b>ghi` → 3 slots glued at exact x positions
#         (no spaceWidth gaps).
#   T18: `abc <b>def</b>ghi` → space between "abc" and "def",
#         glued "def"+"ghi".
#   T19: `abc<b>def</b> ghi` → "abc"+"def" glued, space before "ghi".
#   T20: italic + bold mid-word chain (4 slots all glued).
#   T21: chunk-boundary word split STILL produces one assembled

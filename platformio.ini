# THE TRADEOFF:
# Full-screen refresh writes 96 KB per tick (BW + RED).  At v2.0.200's
# 1500 ms interval that's 830 ms bus-busy / 1500 ms = 55 % duty cycle
# — the v2.0.198 regression that starved the BG worker.
# v2.0.201 also bumps the tick interval to 2500 ms.  Duty cycle drops
# to 33 % — BG worker has 67 % of every 2.5 sec to make LittleFS
# progress.  Spinner rotation slows from 15 s/circle (v2.0.200) to
# 25 s/circle.  Acceptable: user explicitly preferred "everything
# visible behind banner" over "fast rotation".
#
# CHANGES:
# * src/states/ReaderState.cpp `tickLoadingAnimation`:

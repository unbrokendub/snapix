#   * Font bitmap pool clear         ~3-8 KB  (v2.0.190)
#   * Width cache clear              ~1-3 KB  (v2.0.190)
#                                   ──────────
#   Total per book switch:         ~34-66 KB
#
# Pre-v2.0.180 baseline was 0 KB proactive recovery, which is what
# caused the original FB2-after-EPUB OOM cascade that started this
# whole hygiene workstream.
#

# v2.0.198 (v2.0.197 follow-up: spinner ACTUALLY centred + display
# ghosting fixed).  v2.0.197's "fix" missed the real root cause and
# the resulting hardware repro showed both issues persisting.
#
# FIX 1 — spinner centre, the right way.
#
# v2.0.196: drew spinner with raw `drawImage` (byte memcpy).  When
# dest X wasn't 8-aligned the bitmap displaced by `x % 8` pixels.
# v2.0.197: snapped logical X to 8-pixel boundary as a workaround.
# BUT: in Portrait orientation `GfxRenderer::drawImage` rotates the
# LOGICAL (x, y) to PHYSICAL coordinates inside `EInkDisplay::drawImage`
# — and the byte-alignment requirement is on PHYSICAL X.  In Portrait
# the formula is `physX = logicalY`, so even an 8-aligned logical X
# lands on whatever physical X = logical Y happens to be.  The
# v2.0.197 snap didn't help because we snapped the wrong dimension.
#
# v2.0.198: ditched drawImage for a per-pixel `drawAlignedBitmap`
# helper (new, in ReaderState.cpp's anonymous namespace).  Walks the
# packed bitmap bit-by-bit, calls `renderer.drawPixel` per black
# pixel.  drawPixel handles arbitrary bit positions via the standard
# `frameBuffer[byte] |= (1<<bit)` pattern, so alignment ceases to
# matter regardless of orientation.  Cost: 64x64 = 4096 drawPixel
# calls × ~1 µs each ≈ 4 ms per blit.  Negligible vs the ~430 ms
# e-ink refresh that follows.
#
# Layout maths simplified back to the obvious form:
#   spinnerX = bannerX + (bannerW - spinnerW) / 2
#   textX    = spinnerCenterX - textWidth / 2
# Both centred on the same axis, no snap needed.
#
# FIX 2 — display ghosting.
#
# v2.0.196 hardware repro screenshot (#3, "Indexing...") showed
# heavy ghosting all over the screen — file-list text bleeding
# through behind the banner, banner edges fuzzy, etc.  Root cause:
# `GfxRenderer::displayWindow` does fast partial refresh of just
# the spinner region (64x64).  E-ink fast refresh applies drive
# voltage to update target pixels; the drive voltage capacitively
# couples to NEIGHBOURING pixels, disturbing their electrophoretic
# state.  Over multiple ticks (~2 fps), the disturbance accumulates
# and bleeds through as visible ghosting on the un-driven majority
# of the screen.
#
# v2.0.198: replace `displayWindow` with `displayBuffer(FAST_REFRESH)`
# for the per-tick animation update.  This drives EVERY pixel to its
# target state each tick (the framebuffer already has the correct
# banner pixels + the underlying file-list / page pixels), so the
# previously-disturbed surrounding pixels get explicitly re-settled
# rather than drifting.  Wall time: ~10 ms SPI write of the full
# 48 KB framebuffer + ~420 ms scan = ~430 ms per tick.  Actually
# SLIGHTLY FASTER than displayWindow's ~470 ms, AND no ghosting.
#
# Cost: more SPI bus traffic per tick (48 KB vs 512 B for the spinner
# region).  Bus is 40 MHz, so 48 KB = ~10 ms — drowned by the
# ~420 ms refresh wait anyway.  No user-visible difference.
#
# Bonus: drawing white background first then black spinner pixels
# (instead of OR'ing onto the previous frame's residue) makes the
# spinner cleanly rotate instead of accumulating black segments.
# The v2.0.197 drawImage path overwrote bytes wholesale so this
# wasn't an issue there; with drawAlignedBitmap only writing black
# pixels (transparent over the background), we need to fillRect the
# spinner box first.
#

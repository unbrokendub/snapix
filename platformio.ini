# v2.0.99 (corrupt cached-BMP self-heal):
#
# `ImageBlock::render` already checked the cached BMP file's size +
# header validity before passing it to the bitmap renderer (defends
# against partial writes by an aborted decode pass).  When the check
# failed it logged `BMP size out of range` / `parseHeaders failed`
# and fell through to the placeholder render — correct, except it
# left the corrupt file on LittleFS.  Every subsequent render of
# that ImageBlock re-found the same corrupt file, re-failed the
# check, re-fell-through to placeholder.  Permanent "[Image]"
# until manual cache clear.  Observed on the user's Дорофеев "Путь
# джедая.epub" at image/28 (`3680751902.bmp` cached at size=0 from
# a prior session's aborted decode).

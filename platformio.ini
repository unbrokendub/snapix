# v2.0.202 (finally found WHY chapters/file-list never showed behind
# loading banner — it wasn't the refresh strategy, it was an eager
# clearScreen in renderCurrentPage wiping the framebuffer BEFORE the
# banner overlay was drawn).
#
# THE BUG (v2.0.196 through v2.0.201):
# v2.0.198 hardware logs show that when user exits the TOC menu by
# clicking "Go", control flow goes:
#   1. exitTocMode() sets tocMode_=false, needsRender_=true
#   2. render() runs, falls into the `else { renderCurrentPage(core); }`
#      catch-all branch (page-load isn't armed yet — it gets armed
#      INSIDE renderCurrentPage when it detects cache miss).
#   3. renderCurrentPage at line 2048 calls
#      `renderer_.clearScreen(theme.backgroundColor)` — wipes the
#      framebuffer to white IMMEDIATELY at function entry.
#   4. renderCurrentPage continues, finds no cache for the target
#      page, arms pendingEpubPageLoad, returns.
#   5. Next render() iteration: pendingEpubPageLoad branch fires,
#      calls renderCenteredStatusMessage which paints the banner
#      ON THE FRAMEBUFFER — except the framebuffer is now the BLANK
#      WHITE from step 3.  Banner appears on blank white, chapters
#      menu nowhere to be seen.
#
# The renderCenteredStatusMessage doc comment promises "overlay banner
# on top of existing framebuffer content — no clearScreen", which is
# TRUE within that function — but the caller path eagerly cleared the
# framebuffer just before, so "existing content" was blank.
#
# All the v2.0.196-201 refresh-strategy churn (displayWindow vs
# displayBuffer, margin sizes, tick intervals) was treating a symptom
# of this root cause.  v2.0.201's switch back to full-screen refresh
# made things WORSE visibly because now the blank framebuffer was
# faithfully reproduced on the e-ink instead of leaving ghost remnants.
#
# THE FIX:
# Remove the eager `renderer_.clearScreen(theme.backgroundColor)` from
# renderCurrentPage's entry point.  Push the clearScreen calls into
# each branch that actually draws a full-screen frame:
#   * Cover render branch — clearScreen before calling renderCoverPage.
#   * "End of book" branch — clearScreen before drawCenteredText.
#   * XTC render — clearScreen at top of renderXtcPage.
#   * EPUB/FB2/etc page render — renderLoadedPage already clears at
#     line ~2332 (existing, unchanged).
#
# The page-load-DEFERRED branches inside renderCurrentPage (line ~2224,
# 2245, 2263) return early WITHOUT calling clearScreen, so the previous
# framebuffer (chapters menu / file list / previous page) stays intact.
# The next render() iteration's pendingEpubPageLoad branch then paints
# the banner over that preserved content — banner-as-overlay actually
# works.
#
# CHANGES:
# * src/states/ReaderState.cpp:
#   - renderCurrentPage: removed clearScreen at function entry.
#   - Cover render branch: added clearScreen before renderCoverPage.
#   - renderCachedPage "End of book" branch: added clearScreen before
#     drawCenteredText.
#   - renderXtcPage: added clearScreen at function entry.
#
# Build: clean (host tests 85/85).  Flash: ~unchanged (clearScreen
# moved, not added net).  BSS: 0.

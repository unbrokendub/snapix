# ============================================================
# THE STRUCTURAL PROBLEM (v2.0.174 side effect)
# ============================================================
#
# v2.0.174 made `Epub::openItemStream` and `readItemContentsToStream
# Detailed` substitute `sharedZipDictBuffer()` (= renderer.getFrame
# Buffer(), 48 KB of always-pinned BSS) for any null dictBuffer caller.
# That eliminated the v2.0.171-173 heap-32 KB allocation failures
# without adding any new pinned bytes.  The safety argument was: the
# e-paper display only reads the framebuffer during render→upload
# bursts that bracket each refresh, the BG-thread inflate runs
# between those bursts, and they don't overlap.
#
# Hardware testing held up for the InflateReader allocation, but
# exposed a subtler timing race in the GxEPD2 driver:
#
#   Display refresh sequence per banner/page:
#     t=0    Render banner to framebuffer
#     t=12   Write framebuffer → BW RAM (12 ms)
#     t=12   Power on display, start refresh
#     t=12   ... 450 ms of physical display refresh ...
#     t=462  Wait complete
#     t=462  Write framebuffer → RED RAM (12 ms)  ← reads framebuffer AGAIN
#     t=474  RED RAM write complete
#
# The DEFERRED RED-RAM upload at t=462 reads the framebuffer a second
# time — to preload the inverse layer for the next refresh.  Pre-
# v2.0.174 this was a no-op data-flow (RED layer prepared from the
# same content that BW already used).  Post-v2.0.174 the BG-thread
# inflate fills the lower 32 KB of the framebuffer with uzlib
# dictionary bytes during the 450 ms gap, so the RED upload ships
# garbage to the panel.  User-visible symptom: right half (or chunks
# of) of the e-paper display goes black or random during every
# chapter-parse-while-banner-on-screen sequence.
#
# Confirmed via repro log:
#   * Heap at parse time: MaxAlloc=42996 (largest contiguous free
#     block is 42 KB — comfortably above 32 KB).  So the heap COULD
#     have served the inflate without touching the framebuffer at all.
#   * But v2.0.174 always uses the framebuffer — no heap attempt.
#   * Result: glitch happens every chapter parse, regardless of heap
#     availability.
#
# ============================================================
# THE STRUCTURAL FIX
# ============================================================
#
# Move the "heap first, framebuffer fallback" decision down to where
# it belongs: inside `InflateReader::init(streaming, externalBuffer)`.
# The new contract:
#   * Always try `malloc(32 KB)` first.
#   * On success, use the heap buffer (owned, freed in deinit()).
#   * On failure, if externalBuffer is non-null, use it (not owned,
#     not freed) — accepting the documented framebuffer-corruption
#     glitch risk because not rendering the chapter would be worse.
#   * If both fail (no heap + no externalBuffer), return false.
#
# This is backward-compatible: existing callers that pass null
# externalBuffer still get heap-only behaviour (return false if heap
# can't serve); callers that pass an externalBuffer (the v2.0.174
# additions: Epub::openItemStream + readItemContentsToStreamDetailed
# via sharedZipDictBuffer()) now get heap-first-with-fallback, which
# is strictly safer.  No callsite changes needed.
#
# Expected runtime behaviour:
#   * Fresh-boot EPUB chapter parse: heap has >>32 KB largest free →
#     heap path → no framebuffer use → no display glitch possible.
#   * Mid-session EPUB chapter parse with moderate fragmentation:
#     largest free still >= 32 KB → heap path → no glitch.
#   * Heavily fragmented (FB2-then-EPUB2 sequence, large metadata
#     load): largest free < 32 KB → framebuffer fallback → chapter
#     renders but RED upload may glitch a frame.  Better UX than
#     v2.0.171-173 which failed entirely in this case.

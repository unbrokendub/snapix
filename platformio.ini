# v2.0.105 (architectural — persistent EpubChapterParser across TOC
# worker invocations; Rust-firmware persistent-state-machine pattern):
#
# Diagnosed from v2.0.104 trace on Calibre EPUB with missing anchor:
# the TOC worker correctly cached page 0 in 1.8 s and triggered
# deferred-display.  Then it RESTARTED for attempt=2 to keep searching
# for the anchor — and the second invocation paid 25 s on a full
# cold rebuild because the parser was rebuilt from scratch.  Log:
#
#   [21891] parsePages start ... resumable=0       (attempt 1, fresh)
#   [24470] cache-create done pages=1 partial=1
#   [25115] page 0 shown (deferred-display fired correctly)
#   [25967] Start TOC worker attempt=2             (worker restarted)
#   [27265] extend start ... canResume=0           ← cold path triggered
#   [52607] cache-create: 25009 ms (pages=26)      ← 25 s wasted re-parse
#
# Root cause: `runTocJumpJob` in ReaderStateAsyncJobs.cpp constructed
# `EpubChapterParser parser(...)` as a STACK-LOCAL on every invocation.
# When the worker function returned (after signalling first-page-ready),
# the parser was destroyed.  The next invocation built a brand-new
# parser starting from byte 0 of the chapter source; `canResume()`
# returned false, so `PageCache::extend` fell to the cold-rebuild
# path which re-parses the entire chapter.  Pure architectural sin:
# valuable state (XML cursor + parse position + anchor map state)
# thrown away every batch.
#
# Fix follows the foreground BG cache controller pattern (see
# ReaderCacheController::createOrExtendCache, lines ~1003-1014): hoist
# the parser to `ReaderDocumentResources::State::parser` keyed by
# `parserSpineIndex`.  Reuse when the worker re-enters with the same
# spine and `canResume()` returns true; otherwise reset and create
# fresh.  All TOC worker / BG cache / page-fill jobs run on the same
# ReaderAsync FreeRTOS task — they never run concurrently — so the
# shared State is naturally safe; `acquireWorker()` just makes the
# contract explicit.
#
# This is the Rust embedded "persistent state machine" pattern: the
# parser is a long-lived owned object that's TICKED by the worker,
# not constructed/destroyed per tick.  Equivalent to
# `struct TocWorker { parser: ChapterParser, ... }` where the worker
# instance lives for the duration of the spine being indexed.
#
# Projected effect on the user's 56 KB Calibre chapter w/ missing
# anchor:
#   * v2.0.104: 1.8 s (first batch) + 25 s (cold rebuild) = ~27 s
#     before usable cache; user button-press lost in the gap.
#   * v2.0.105: 1.8 s (first batch) + ~3-5 s (hot extend, +25 pages
#     resumable) = ~5-7 s before usable cache.
# = ~4-5x speedup on the worst case + page-turn responsiveness
# restored mid-indexing.
#
# Also in this commit: temporary diagnostic logs in SmolJpeg's
# `parseMarkers` to identify the root cause of the
# `SmolJpeg(FB2) decode failed (invalid-jpeg)` regression observed in
# the same trace.  The fallback to JPEGDEC retains correctness but
# fragments the heap (largest_free 5108 forever) — once the SmolJpeg
# bug is fixed in a follow-up commit, the JPEGDEC fallback chain
# will be removed entirely (one-decoder discipline).
#
# v2.0.104 (TOC-jump deferred-display unblock, take two — worker-driven
# signaling replaces v2.0.103's racing eager reload):
#
# v2.0.103 fixed the architectural bug where deferred-display couldn't
# fire until the BG worker had fully idled — but my implementation
# introduced a worse bug.  Hardware test trace showed: after a menu
# cache clear, the next TOC jump triggered the main-thread eager
# reload BEFORE the worker started.  A stale `sections/N.bin` from
# an older firmware version sat on disk; the eager load opened it,
# hit a version-mismatch check, returned failure — but the FD wasn't
# released.  Worker then tried to evict that stale file and got
# `Failed to unlink: Has open FD` / `Cannot rename; src is open`
# for 6+ seconds while the main thread's FD lingered.  TOC create
# took 8.7 s instead of 1.8 s and the user spent ~30 s in retry-loop
# territory.
#
# Architectural lesson: polling a file from the main thread while a
# worker is actively managing it (open → write → close → rename) is
# fundamentally racy on LittleFS even with throttling, because the
# main thread can't know what state the worker is in.
#
# v2.0.104 inverts the data flow: the worker SIGNALS the main thread
# when it's safe to read.  Specifically, after the worker completes
# its first batch (1 page) AND `create()`/`extend()` returns success
# (FD is closed, atomic rename complete), the worker sets
# `pendingTocFirstPageReady_` in the AsyncJobsController state.  The
# main thread's `processPendingTocJump` picks this up on its next
# tick, does the load — at which point the worker is mid-vTaskDelay,
# guaranteed not to have any handles open on the cache file.
#
# Why this is safe where v2.0.103 wasn't:
#   * Flag is only set AFTER `cache.create()`/`cache.extend()` returns
#     success — both paths close the FD before returning.
#   * Main thread clears the flag immediately on consumption (one-shot).
#   * No polling of `LittleFS.exists` or speculative `load()` before
#     the worker has produced anything → no chance of opening a stale
#     pre-existing file from an older firmware version.
#   * Bool is naturally atomic on ESP32-C3 (single-CPU, aligned 4-byte).
#
# Projected effect on user's missing-anchor TOC-jump scenario:
#   * v2.0.102: ~122 s before any page is visible (waited for full chapter)
#   * v2.0.103: indexing blocked by FD race for ~30 s (regression)
#   * v2.0.104: ~2 s before page 0 is visible (signal arrives ~1.8 s after
#     worker starts, picked up on main-thread tick ~50-200 ms later)
#
# Also addressed (user's question "оно же всё litlefs кэширует?"):
# Yes — the v2.x cache architecture writes every page to LittleFS
# before showing it.  That's structural to the page-cache design and
# not changed here.  Conceptually, TOC jump could lay out page 0 in
# memory and render it directly while the disk cache builds in
# background, but that's a much deeper refactor (the renderer's
# page-load path assumes deserialised pages from cache).  The
# worker-signal fix above gets us to ~2 s perceived latency, which
# is close enough to "instant" for the missing-anchor case where
# the alternative was indexing the entire chapter.
#
# v2.0.103 (TOC-jump deferred-display unblock — the real architectural
# root of "indexing takes minutes to show first page"):
#
# Diagnosed from v2.0.102 trace on a Calibre EPUB with TOC anchor that
# doesn't exist in the chapter HTML.  Worker correctly cached page 0
# of spine=13 in 1.8 s, then spent 122 s indexing the remaining 60
# pages searching for `sigil_toc_id_58` which was never registered.
# User saw "Indexing..." banner the entire time — even though page 0
# was readable within 2 seconds.
#
# Root cause was an `isWorkerRunning()` early-return in
# `ReaderStateOverlays.cpp::processPendingTocJump` (line ~595) that
# bailed out of the main-thread tick BEFORE the v2.0.85
# deferred-display upgrade could fire.  The v2.0.85 design said
# "after first batch, switch to deferred-display so user sees page
# 0 ASAP" — but the implementation gated the deferred-display path
# behind `reloadCacheFromDisk`, and `reloadCacheFromDisk` was gated
# behind the worker being idle.  Result: deferred-display only ever
# fired after the worker had completed (or given up) — which on a
# missing-anchor chapter meant waiting for the FULL chapter to be
# indexed first.
#
# Fix is a pre-check before the `isWorkerRunning` gate:
#   * If the target spine has a cache file on disk AND we don't yet
#     have any pages in our `pageCache_`, do a one-shot
#     `reloadCacheFromDisk` (throttled to 500 ms between reloads
#     so we don't hammer the LUT-read while the worker churns).
#   * After the reload, if pageCount > 0, fire the deferred-display
#     upgrade immediately, surface page 0 to the user, and return.
#   * The worker continues indexing in the background; subsequent
#     ticks of processPendingTocJump still check for the anchor
#     after each batch.  If found at page N > 0, navigation
#     advances; if never found, user stays on page 0.
#
# Safety:
#   * The worker CLOSES the cache file between extends (see
#     `PageCache.cpp::extend` closeFile calls).  Reading from disk
#     between batches is consistent.  Race with mid-extend write
#     is benign: the load either succeeds with stale-but-consistent
#     LUT (worst case: we see N-1 pages instead of N), or fails
#     gracefully and we retry next tick.
#   * 500 ms throttle prevents the load from hammering LittleFS
#     while the worker is mid-batch — at most 2 reads/sec, each
#     ~5-20 ms.
#
# Projected effect on the user's 137-KB chapter with missing anchor:
#   * v2.0.102: 1.8 s first page + 120 s indexing-wait = 122 s
#     before any visible content.
#   * v2.0.103: 1.8 s first page + ≤0.5 s throttle = ~2-3 s before
#     page 0 is on screen; background search continues but is
#     INVISIBLE to the user.
# = ~50x reduction in time-to-first-page on missing-anchor chapters.
# Same large win for chapters where the anchor sits 30+ pages in.
#
# Separate concern (not in this commit): anchor `sigil_toc_id_58`
# in the user's EPUB was never found by the parser despite the
# chapter being fully indexed.  Either the OPF TOC nav file points
# at an anchor ID that doesn't exist in the chapter HTML, or
# `ChapterHtmlSlimParser`'s anchor-map registration missed it.
# That bug exists independently of the deferred-display bug above;
# v2.0.103 just stops it from being a user-visible 2-minute wait.
#
# v2.0.102 (EPUB TOC-jump indexing speedup — diagnosed from v2.0.101's
# unblocked-but-slow indexer trace on a 137 KB Calibre chapter):
#
# v2.0.101 unblocked the layout-abort regression so the cold-open
# chapter parser actually completes — and exposed that the indexer
# itself was running unacceptably slow on large chapters.  Per-extend
# cycle on the user's spine=9 (137 KB raw HTML) decomposed as:
#   * task launch (extend-start → parsePages-start):   ~ 900 ms
#   * parse + layout (parsePages → addLineToPage-cap): ~8400 ms
#   * disk write (resume-done → hot-extend-done):      ~1700 ms
#   * total per 5-page cycle:                          ~11 s
# With the v2.0.85 5-page cap, a 30-page chapter needed ~6 cycles,
# ~66 s end-to-end.  In the user's TOC-jump test the chapter was
# bigger still and indexing was still mid-progress past 45 s when
# they Ctrl+C'd.
#
# v2.0.102 amortizes the fixed per-cycle overhead by following
# Phase B of the v2.0.101 architectural plan: bump the EPUB TOC-jump
# follow-up batch size from `PageCache::DEFAULT_CACHE_CHUNK = 5` to
# a dedicated `kEpubTocJumpFollowUpBatchPages = 25`.  The first
# batch stays at 1 page (`kEpubTocJumpFirstBatchPages`) so we still
# surface page-0 of the chapter to the user within a few seconds
# via `pendingTocJumpDeferredDisplay_` — only the subsequent
# anchor-search batches grow.
#
# Why this is safe:
#   * `ContentParser::parsePages`'s inner loop checks `shouldAbort`
#     per-line, so a user page-turn preempts within ~100 ms regardless
#     of batch size.  Batching just reduces dead-air between checks.
#   * Heap watermarks (`MIN_FREE_HEAP` / `MIN_LAYOUT_FREE_HEAP`) abort
#     the parser early if memory drops below the floor — a 25-page
#     batch on a small heap still produces only what it can fit.
#   * The FB2 TOC worker already uses the same growth-based pattern
#     (`kFb2TocJumpMinimumGrowthPages = 24`, `kFb2TocJumpColdStartCapPages = 72`);
#     this brings EPUB into parity.
#
# Projected effect on the user's 137 KB chapter:
#   * old: ~14 cycles × 11 s = ~154 s
#   * new: 1 cycle (1 page) + ~2-3 cycles × ~20-25 s = ~50-75 s
# = 50-65% indexing-time reduction on large chapters.  No effect on
# small chapters (1-page initial batch wins anyway).
#
# Not in this commit (Phase 4c BSS pool for words/wordWidths/lineBreaks
# was originally bundled): on closer inspection the pool would only
# remove ~80 µs per text-block (<1% of cycle time) — the actual
# parse-time bottleneck is hyphenation pattern matching and per-word
# `Hyphenator::breakOffsets` vector allocations, which a small-buffer
# BSS pool doesn't address.  Phase 4c is deferred until the
# hyphenation-side allocations are profiled in their own commit;
# tuning a pool that doesn't move the needle would be the same
# symptom-treatment trap v2.0.100/v2.0.101 fell into.
#
# v2.0.101 (three architectural fixes from 50-agent deep audit —
# replaces the v2.0.100 yRow-pool prototype which regressed cold-open
# heap budget, and addresses two real architectural roots of the
# stuck-state instead of treating symptoms by tuning the watermark):
#
# (1) `lib/SmolJpeg/src/SmolJpegDecode.cpp` — yRow BSS pool dropped.
#     v2.0.100 pinned `gYRow[16384]` (later 10240) in BSS to side-step
#     the per-decode heap allocation peak.  Architectural mistake: it
#     pinned 10-16 KB of *permanent* RAM to avoid a *transient* spike,
#     dropping the runtime heap budget 163 → 147 KB.  Cold-open path
#     (cover-gen + metadata cache + chapter-1 init) then crashed below
#     `MIN_LAYOUT_FREE_HEAP=10240` with `largest_free=7668`, leaving
#     the reader on a permanent "failed to load page" placeholder.
#     yRow is back to `OwnedArray<uint8_t>` heap allocation, one per
#     decode, freed on decode exit.  Concurrency unchanged (still
#     serialised under `ScopedJpegLock`).  The transient-spike concern
#     is addressed at its real root — fixes (2) and (3) below plus
#     Phase 4c (next pass) free much more heap than the pool ever
#     could, so the original problem the pool was solving doesn't
#     occur in the first place.
#
# (2) `src/states/ReaderState.cpp::renderCoverPage` — JPEGDEC
#     released after cover-gen.  The audit identified this as the
#     "no-return" point in default-env runs: cover-gen instantiates
#     the shared JPEGDEC decoder (~25 KB) and its decode arena
#     (~7-32 KB), then they stay pinned mid-heap for the entire
#     session.  The next chapter parser starts with `largest_free`
#     artificially shrunk to ~25 KB instead of the ~70 KB it could
#     have — and a handful of ParsedText constructions later
#     (`words.reserve(64) = 1792 B` contiguous) collapse below the
#     layout watermark.  `JpegToBmpConverter::releaseAllPersistent()`
#     already existed (originally for the page-fill retry path);
#     this wires it into the cover-gen tail so JPEGDEC residency
#     stops being a session-wide cost.  No-op when SmolJpeg=1
#     (v3_alpha) since JPEGDEC is never instantiated there.
#     Default env wins ~25-55 KB largest-block headroom for the
#     entire chapter-parse phase.
#
# (3) `lib/SmolPort/src/MarkerStream.cpp::feed` — state-machine
#     ordering bug.  Audit hypothesis H3 confirmed by inspection:
#     four sites committed `state_ = State::InText` AFTER the
#     observer-returning-Stop check.  Result: on every Stop the
#     reader wedged in `InPayloadBody` / `InMarkerEscape` /
#     `InPayloadLenHi` with the per-event accumulators already
#     filled — the next `feed()` call either re-emitted the same
#     event (double-fire) or read the SAME zero remaining bytes
#     forever in a tight loop (spine=20 page=6 wedge observed in
#     v2.0.94-97 testing, root cause of Phase 3e step 2's
#     "perma-stuck after Stop" regression).  Fix: commit state
#     transition BEFORE the observer call.  All shim callbacks
#     in this codebase consume the event side-effect first and
#     return Stop purely as a back-pressure signal — so the
#     reader is free to advance state once the callback returns,
#     regardless of code.  This unblocks Phase 3e step 2 (chapter
#     parser drives off byte-marker stripper instead of expat) and
#     therefore unblocks expat removal (~10 KB heap savings) in a
#     subsequent commit.  No-op in default env (`SNAPIX_SMOL_HTML=0`).
#
# Combined heap effect:
#   * v3_alpha cold-open: +16 KB heap budget (yRow drop) + 0 (JPEGDEC
#     not used) = +16 KB.  Cold-open `largest_free` rises from ~7-8 KB
#     to ~23-24 KB — well above the 10240 watermark.
#   * default-env cold-open: 0 (yRow not active) + 25-55 KB largest-
#     block headroom after cover-gen = +25-55 KB for the chapter
#     parser's whole run.
#   * Both envs: state-machine fix has no heap delta, but unblocks
#     Phase 3e step 2 / 7 (expat removal) in a follow-up.
#
# Layout watermark `MIN_LAYOUT_FREE_HEAP` kept at `MIN_FREE_HEAP+2048`
# (10240) — the v2.0.100 trace pointed at largest_free=7668 not because
# the watermark was wrong but because the heap budget had been silently
# drained by the BSS pool.  Lowering the watermark to 6144 (v2.0.101
# draft, rejected) would have hidden the real bug.
#
# v2.0.100 (Phase 4d yRow pool + Phase 3e step 3 stop-trace
# instrumentation; both active in v3_alpha):
#
# Phase 4d — `lib/SmolJpeg/src/SmolJpegDecode.cpp`:
#   * The MCU-row luminance scratch buffer `yRow` was a per-decode
#     heap allocation of `alignedW × mcuH` bytes (~13-17 KB).  Its
#     transient peak coincided with chapter parse + page render
#     activity, and the largest-free-block watermark on the Xteink X4
#     (~145 KB heap) frequently dropped to 7-8 KB during the overlap
#     window — enough to fire `MIN_LAYOUT_FREE_HEAP` aborts on the

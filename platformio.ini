#
# THE FIX (three changes):
#
# 1. tick interval 500 ms → 1500 ms.  ~0.67 fps.  Slower rotation but
#    BG worker has ~1 sec of clear bus between ticks to make progress.
#
# 2. displayBuffer → displayWindow with margin.  Partial refresh of
#    a 96x96 region (spinner 64x64 + 16 px margin on each side) writes
#    only ~1.4 KB to display RAM per tick instead of 96 KB.  Margin
#    compensates for the ghosting that originally drove the v2.0.198
#    switch — surrounding pixels get drive voltage too, settling back
#    toward white instead of drifting.
#
# 3. Unified "Loading..." text.  Three call sites previously chose
#    between "Indexing..." and "Loading..." based on
#    `pendingEpubPageLoadUseIndexingMessage_`.  User preferred one
#    label; "Indexing..." is implementation-detail terminology anyway.
#    All three now call `renderCenteredStatusMessage(core, "Loading...")`.
#
# COMBINED BUS IMPACT (per tick):
#   v2.0.198: 96 KB write + 420 ms refresh = ~820 ms bus-busy / 500 ms
#             tick → 160 % duty cycle, worker starved
#   v2.0.199: 1.4 KB write + 420 ms refresh = ~430 ms bus-busy /
#             1500 ms tick → 29 % duty cycle, worker has ~70 % of
#             every second to itself
#
# CHANGES:
# * src/states/ReaderState.cpp:
#   - tickLoadingAnimation: tick interval 500 → 1500 ms;
#     displayBuffer(FAST_REFRESH) → displayWindow(96x96 with 16-px margin).

# expanded SmolJpeg decode-path diagnostic):
#
# Two distinct livelocks observed in the v2.0.105 trace:
#
# (1) `ChapterHtmlSlimParser::parseLoop` under SNAPIX_SMOL_HTML=0
#     (default + v3_alpha env both ship expat path).  When

# RESULT: the banner appears once over the prior screen and the worker then
# owns the SPI bus for the whole parse.  No per-tick contention.  Flash
# shrinks (spinner bitmaps gone), BSS shrinks (8 fields gone).
#
# v2.0.204 (the v2.0.203 partial-tick was NEVER actually cheap —
# displayWindow re-wrote the WHOLE framebuffer to RED RAM every tick).
#
# THE COMPLAINT:
# v2.0.203 hardware repro on a 430 KB FB2 section (Frankl, "Сказать
# жизни Да"): cache-create took 147 SECONDS (116 s markerize + 30 s
# idx build).  The spinner animated fine but the hybrid refresh did
# NOT bring the load back toward native speed as v2.0.203 promised.
#
# THE ROOT CAUSE:
# v2.0.203 assumed `renderer_.displayWindow(banner)` cost ~2.8 KB =
# ~10 ms of SPI bus.  It does not.  EInkDisplay::displayWindow runs a
# post-refresh "sync RED RAM with the full current screen" step that
# unconditionally writes BUFFER_SIZE (48000 B) back to RED RAM on
# EVERY call — visible in the serial log as "Writing frame buffer to
# RED RAM (48000 bytes)... complete (147-310 ms)" after every partial
# tick.  So each "partial" tick actually held the bus ~150-310 ms, not
# ~10 ms.  On the single-core ESP32-C3 that also pins the CPU for that
# whole write, starving the FB2 markerize worker that shares the SPI
# bus for its SD reads.  v2.0.203 roughly halved v2.0.201's 96 KB/tick
# to ~51 KB/tick but the author thought it was 2.8 KB/tick — the full
# RED resync was the hidden cost.
#
# THE FIX:
# New `partialRedSync` flag on EInkDisplay::displayWindow (threaded
# through GfxRenderer::displayWindow).  When set, the post-refresh
# baseline sync writes ONLY the window region (~2.8 KB) to RED RAM
# instead of the full framebuffer.  windowBuffer already holds the
# window's current bytes, so the next partial refresh still diffs
# against a correct per-window baseline.  The out-of-window baseline
# is left untouched — safe because tickLoadingAnimation does a full
# displayBufferDriveAll every 10th tick, and nothing outside the
# banner changes between drive-alls.  Per-tick bus/CPU hold drops from
# ~150-310 ms to ~10-20 ms — finally what v2.0.203 intended.  Default
# false preserves the full-frame resync for all other displayWindow
# callers (general partial updates where the surrounding baseline is
# not otherwise refreshed).
#
# CHANGES:
# * lib/EInkDisplay/{include/EInkDisplay.h,src/EInkDisplay.cpp}:
#   displayWindow gains `bool partialRedSync = false`; post-refresh
#   resync branches window-region-only vs full-frame.
# * lib/GfxRenderer/src/{GfxRenderer.h,GfxRenderer.cpp}: displayWindow
#   threads partialRedSync through to EInkDisplay.
# * src/states/ReaderState.cpp tickLoadingAnimation: partial-tick
#   branch passes partialRedSync=true.
#
# Expected: cold-parse of the 430 KB section drops well below 147 sec
# (the ~25-40 s of cumulative full-RED writes during the parse is
# eliminated; remaining time is native markerize CPU cost).  Build:
# host tests pass.  Flash/BSS: ~unchanged (one bool param).
#
# v2.0.203 (hybrid refresh strategy — fix v2.0.201's long-load
# regression while keeping v2.0.202's "banner-as-overlay" working).
#
# THE COMPLAINT:
# v2.0.202 hardware repro: page-turn that lands on a new spine
# triggered cold-parse of a 312 KB FB2 section.  cache-create took
# 70.6 SECONDS.  Spine 2 (365 KB) took 74 sec.  User saw the spinner
# rotating smoothly but the book never loaded for over a minute.
#
# THE ROOT CAUSE:
# v2.0.201's displayBuffer(FAST_REFRESH) per tick wrote 96 KB to
# display RAM (BW + RED) per tick.  At ~250 KB/s SPI = ~500 ms of
# BLOCKING bus access per tick.  ESP32-C3 single-core: while the
# main task held the SPI bus for 500 ms, the BG worker (which needs
# LittleFS reads + SD reads for FB2 markerize) couldn't make
# progress.  Cumulative effect: cold-parse was ~3x slower than its
# native speed (which would be ~20-25 sec for a 312 KB section
# without bus contention).
#
# THE FIX:
# Hybrid refresh per tick:
#   * 9 of every 10 ticks: partial displayWindow over the banner
#     (~2.8 KB = ~10 ms bus block).  Refresh wait phase (~420 ms)
#     yields via vTaskDelay so worker can use the bus.  Effective
#     bus block: ~10 ms / 1500 ms = 0.7 % per tick.
#   * Every 10th tick (~every 15 sec): full drive-all refresh.  Re-
#     drives the entire screen so surrounding UI (chapters menu /
#     file list under the banner) doesn't drift to mid-gray via
#     cross-talk from the partial refresh waveform.
#
# Bus availability for worker: ~95-99 % on average.  Cold-parse of
# 312 KB section should drop back from 70 sec toward the native
# ~20-25 sec, and the surrounding UI stays visible the whole time
# (refreshed every ~15 sec via the periodic drive-all).
#
# CHANGES:
# * src/states/ReaderState.cpp tickLoadingAnimation:
#   - Tick interval 2500 → 1500 ms (faster spinner rotation).
#   - Replaced single displayBuffer(FAST_REFRESH) with hybrid:
#     static counter + branch on counter % 10 == 0 → displayBufferDriveAll,
#     else → displayWindow over banner rect.
#
# Build: clean (host tests 85/85).  Flash: ~unchanged.  BSS: +1 B
# (the static counter).

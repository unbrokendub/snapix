# the panic-handler's hex-formatting (0x4567, 0x0123, 0x89ab, etc.),
# RA = 0x40388c2a (esp_system), PC = 0x421670cb (in flash, likely
# libc abort()).  Sequence-of-events analysis: 8 KB largest free
# block right before ParsedText tried to allocate its spill buffer +
# write-callback state, that allocation failed → underlying code
# called abort() (likely std::__throw_bad_alloc translated to abort()
# in this no-exceptions build).

# v2.0.194 (heap hygiene v3 — 5 small wins targeting the 9 KB-largest-
# block fragmentation that gated the BG worker indefinitely in the
# v2.0.193 hardware log).  Each win is small; cumulative effect is
# 5-30 KB recovered per book switch + emergency escalation when the
# BG worker would otherwise stall.
#
# THE OBSERVATION (v2.0.193 hardware log):
# After a long session reading TXT + EPUB + FB2 + TXT, BG worker hit:
#   [139291] [READER] [ASYNC] skip background cache: heap critical
#               (free=35184 largest=9204)
# ...and repeated this for >2 MINUTES of wall time.  Total free was
# 35 KB but largest contiguous block was 9.2 KB — heavy fragmentation
# preventing the BG worker from finding a contiguous block for its
# transient parse buffers.  Page cache extension never completed.
#
# Five wins, each independently useful:
#
# WIN 1 — GfxRenderer bitmap row buffers freed at non-image entry
#   `bitmapOutputRow_` (200 B) + `bitmapRowBytes_` (2400 B) total
#   2.6 KB.  Pre-v2.0.194 they were lazily allocated on first BMP
#   render and ONLY freed in the GfxRenderer destructor (i.e. never
#   during runtime).  TXT/Markdown have no BMPs to render — they
#   pin 2.6 KB indefinitely for nothing.  Now freed at TXT/Markdown
#   content-entry; lazy realloc (~µs) handles the cover-BMP edge
#   case if a TXT happens to have a cover image.
#
# WIN 2 — ImageRenderCache cleared defensively at TXT/Markdown entry
#   v2.0.190 hygiene cleared this at book EXIT.  But if the exit
#   path was abnormal (battery yank, crash) the cache survived into
#   the next session.  TXT has no images, so the cache is dead
#   weight there — proactive clear at content entry catches that
#   edge case.  Cost: zero if already empty, recovers 5-30 KB if
#   residue.
#
# WIN 3 — Same `freeBitmapRowBuffers()` ALSO at book exit
#   Symmetric with the WIN 1 entry-time clear.  Even if the next
#   book DOES need BMP rendering (EPUB cover, FB2 inline image),
#   the realloc is µs while the exit-time release gives the next
#   book's first allocations a cleaner heap layout.
#
# WIN 4 — streamOffsetCache_ shrink_to_fit() at book exit
#   The SmolPort-mode (v3_alpha) per-spine page-boundary cache.
#   Pre-v2.0.194 `clear()` was called at lines ~1046/~2669 but
#   `shrink_to_fit()` wasn't, leaving the vector's capacity (up to
#   `36 pages * 8 B = 288 B` + struct overhead per spine in a typical
#   chapter) reserved across book switches.  Modest but free.  Only
#   compiled in v3_alpha (`#if SNAPIX_MARKERIZED_RENDER`).
#
# WIN 5 — Heap-critical emergency hygiene escalation
#   Pre-v2.0.194, when `isHeapCritical` triggered in the BG worker
#   start-of-iteration check, the recovery was: drop imageCache,
#   re-check, give up if still critical.  v2.0.193 logs show this
#   give-up state persisted for MINUTES (BG worker re-checked every
#   1.5 sec, every check still saw the same fragmented heap).
#
#   v2.0.194 escalates BEFORE giving up:
#     * imageCache.clear()                   (existing v2.0.183)
#     * FONT_MANAGER.clearStreamingBitmapCaches()  (new)
#     * renderer_.clearWidthCache()                 (new)
#     * renderer_.freeBitmapRowBuffers()            (new)
#   Same caches as the exit-time hygiene, applied reactively in
#   the critical path.  Worst case (already-empty caches): a few
#   µs of no-op checks.  Best case: BG worker can resume the cache
#   extension that was previously blocked indefinitely.
#
# COMBINED EFFECT:
# Best case (every cache populated): ~10-50 KB recovered per book
# switch + emergency unblocking of stuck BG worker.
# Worst case (everything already empty): a few µs of no-op clears.
#
# CHANGES:
# * src/states/ReaderState.cpp
#   - Content-type switch: `case ContentType::Txt:` and `:Markdown:`

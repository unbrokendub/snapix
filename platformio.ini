#   Net effect on first run after upgrade:
#     1. R3.6 ReaderState tries to load `.idx`, sees version=1, rejects
#        ("[STREAM] idx stale/corrupt spine=N (deleted)" in log).
#     2. R3.6 builds fresh cache during render by MEASURE-walking
#        markers — fully correct offsets for new layout.
#     3. On next chapter visit, R4.c upfront-builds the .idx with

# v2.0.180 (Proactive JPEGDEC release on book exit — frees ~25 KB
# of heap that was previously pinned across book switches.  Direct
# fix for the FB2-after-EPUB heap pressure cascade observed in the
# v2.0.177 crash log + v2.0.178 trace.
#
# THE STRUCTURAL PROBLEM:
# JpegToBmpConverter holds a shared JPEGDEC instance (~25 KB struct,
# allocated lazily via `new JPEGDEC()` on first cover/image decode,
# stored in `gSharedJpegDec` for fast re-use throughout the session).
# Pre-fix it stayed alive across book switches: open EPUB → decode
# cover → 25 KB pinned forever, exit to FileList → open FB2 → FB2
# session inherits a 25 KB hole in the heap baseline.
#
# Three existing release callsites all fire REACTIVELY after the
# damage is done:
#   * PageCache.cpp:986 — when cold-extend pre-flight detects tight
#     heap and tries to recover.
#   * ReaderStateOverlays.cpp:739 — in the page-fill memory trim
#     path, only after a worker has already noticed pressure.
#   * ReaderState.cpp:2912 — after the cover-gen pass completes
#     (per-book, but only on cover render path).
#
# Hardware trace (v2.0.178, the run that crashed v2.0.177):
#   [165018] Loading EPUB Vaghnye_gody
#   [167393] Found cover via heuristic
#   [170661] Converted JPEG to BMP (flash)  ← JPEGDEC allocated here
#   ...
#   [22547] Exit Reader (back to Valley-of-Genius EPUB context)
#   [29665] Switch to FB2 Fire_in_the_Valley.fb2
#   [29666] Entry heap trim: largest=38900   ← still pinned 25 KB short
#   [33474] heap-critical free=24828 largest=11764
#   [37672] cold extend deferred — heap headroom insufficient
#   abort() was called at PC 0x421670cb  ← OOM crash

# v2.0.109 (page-fill cold-rebuild no-retry — "Loading" instead of next
# page on partial cache, fallback-immediately fix):
#
# v2.0.108 trace showed a real user-visible bug separate from the
# JPEGDEC saga: when reader entered a chapter with partial-but-large
# cache (38 pages), pressing next-page from the last cached page (37)
# triggered cold rebuild because `parser.canResume()=false` (parser
# was destroyed by reader exit/entry).  Cold rebuild takes ~25 s on
# a 137 KB chapter.  The page-fill retry mechanism then attempted the
# same cold rebuild THREE times (kPendingEpubPageLoadMaxRetries=3),
# locking user on "Loading" banner for 75+ seconds.
#
# Root cause is structural in cold rebuild: `PageCache::extend`'s
# cold path calls `parser.reset()` at entry (line 947) AND again on
# failure (line 962) to enforce the "stable pagination" guarantee
# (rebuild with new image sizes mustn't be appended to old cache).
# That means every cold-rebuild failure wipes parser state, so the
# next retry hits the exact same cold path with the exact same
# canResume=false condition.  Retries are pure waste.
#
# Fix: when the page cache has ANY usable pages, fall back to the
# nearest cached page IMMEDIATELY on the first failure — no retries.
# User sees the page they were on (page 37), the BG cache continues
# extending in its own time, and when it succeeds the user can
# navigate forward without ever having seen the "Loading" overlay
# for more than the first attempt's worth.
#
# Only the no-cache case (pageCount==0) still retries the full
# kPendingEpubPageLoadMaxRetries=3 times — we have nothing to fall
# back to there, so retrying is the only option.
#
# Architectural improvement (deferred): the underlying cold-rebuild
# cost can be eliminated by recording per-page SOURCE byte offsets
# in the cache file metadata.  A fresh parser could then "seek" to
# the byte offset of the last cached page and continue parsing,
# avoiding the rebuild-from-byte-0 penalty entirely.  Requires
# extending PageCache file format + adding a setResumePosition API
# to ContentParser; substantial refactor, separate commit.
#
# v2.0.108 (SmolJpeg restart-marker root-cause fix + JPEGDEC fallback
# chain removed — one-decoder discipline, the architectural conclusion
# of the v2.0.106 diagnostic):
#
# The v2.0.107 trace, with the diagnostic logging added there, isolated
# the FB2 JPEG decode failure to ONE specific check:
#
#   [SMOL_JPEG] decodeBaseline: bad restart marker=0x00 mx=14 my=0
#
# Root cause: SmolJpeg's restart-marker handling assumed that
# `br.pendingMarker()` returns the marker byte that the BitReader saw
# in the entropy stream.  But `marker_` is only set when the BitReader
# ACTUALLY FETCHES a byte and that byte is part of a 0xFF Dn sequence.
# If the previous MCU's Huffman codes consumed bytes RIGHT UP TO the
# 0xFF marker prefix without overshooting (intermittent — depends on
# bit alignment), the BitReader never pre-fetched the marker bytes and
# `marker_` stayed at its previous value (0).  We then wrongly reported
# `Status::InvalidJpeg`.
#
# This was the dominant SmolJpeg failure mode on the FB2 corpus: Calibre-
# generated JPEGs frequently use restart intervals = N where N exactly
# matches a row of MCUs (e.g. 16 MCUs per row at 240px width), and the
# entropy decode tends to align cleanly on byte boundaries for these
# sizes.
#
# Fix in `decodeBaselineStream`: after `br.consumeBits(br.bitCount())`
# (which drops leftover bits but doesn't fetch new bytes), force one
# `br.ensure(1)` call.  That drives `nextDataByte()` which scans the
# next byte, hits 0xFF Dn, sets `marker_`, and returns -1.  We then
# read `pendingMarker()` — now correctly populated — and drop the
# 1-bit padding `ensure()` injected (it's not real data — the real
# next-MCU data starts after the marker byte).
#
# With this fix, SmolJpeg now handles the entire FB2 image corpus that
# previously triggered the fallback.  Which enables the SECOND part of
# this commit:
#
# JPEGDEC fallback chain REMOVED from all three sites
# (Fb2.cpp:1337, ImageConverter.cpp:140, 226).  Rust-firmware
# one-decoder discipline: when the chosen decoder fails, return
# failure explicitly — do NOT silently switch to a heavier decoder
# that fragments the heap.  Pre-fix, the SmolJpeg failure on a
# single FB2 inline image triggered JPEGDEC instantiation (~25 KB
# workspace + ~7 KB arena pinned mid-heap), which then permanently
# collapsed largest_free to ~5-9 KB for the remainder of the
# session.  Cascading failures observed:
#   * spine=9 chapter cache cold-rebuild looped 5+ times, each
#     producing 2-7 pages before hitting `Insufficient memory for
#     layout` and aborting.
#   * Page-fill worker for spine=9 page=38 retried attempt=1/2/3
#     and ultimately fell back to nearest cached page.
#   * Buttons unresponsive for ~30+ s while worker churned.
#
# After v2.0.108: SmolJpeg succeeds on the FB2 images, no JPEGDEC
# instantiation, heap stays clean, the cascading failures disappear.
#
# Bit-identical default env: `SNAPIX_SMOL_JPEG=0` keeps the legacy
# JPEGDEC path unchanged.  The "no fallback" rule only applies in
# v3_alpha where SmolJpeg is the active decoder.  Default env will
# follow once SmolJpeg has been hardware-tested across the full
# image corpus.
#
# v2.0.107 (Phase 4c + heap-low-as-resumable architectural fixes):
#
# Two architectural changes that together attack the heap-fragmentation
# cycle from BOTH directions — reduce the per-paragraph allocation
# that fragments the heap, AND make the parser survive heap-low
# without throwing away cache work.
#
# (1) `ParsedText::words` std::vector<WordEntry> → std::deque<WordEntry>.
#
#     The audit identified `words.reserve(64) = 1792 B contiguous`
#     as the proximate trigger for the `largest_free=7668` collapse
#     seen on Calibre chapters with many paragraphs: every text block
#     paid a single ~1.8 KB contiguous allocation that landed in the
#     largest free hole, shrinking the next-largest below
#     `MIN_LAYOUT_FREE_HEAP` and tripping the layout abort.
#
#     std::deque allocates in fixed-size chunks (~224 B for WordEntry-
#     sized elements on this platform).  A 50-word paragraph now uses
#     ~7 small allocations instead of one big contiguous block.  Same
#     total heap, but the LARGEST contiguous reservation per paragraph
#     drops from ~1.8 KB to ~224 B — large free holes stay intact,
#     and `MIN_LAYOUT_FREE_HEAP` (which only cares about largest-free)
#     stays high.
#
#     API note: deque preserves references across end-insertions and
#     supports O(1) random access (`words[i]`).  All existing
#     ParsedText.cpp call sites that take element references
#     (calculateWordWidths' `first_word` reference, etc.) remain
#     correct.  `vector::reserve` calls became no-ops (deque has no
#     reserve; chunked growth needs no pre-allocation hint).  Mid-
#     container erase/insert is O(N) on both containers, called only
#     for soft-hyphen rejoin and oversized-word presplit — rare,
#     cost in the noise.
#
# (2) `makePages-low-heap` cooperative-suspend instead of fatal-abort.
#
#     Diagnosed from the v2.0.106 trace on spine=9 attempt=2: parser
#     successfully hot-extended pages 1 → 26 → 36 with canResume=1
#     (v2.0.105 persistent parser at work), then hit
#     `Insufficient memory for layout (7668 bytes)` at page 36 and
#     set `aborted_=true`.  `canResume()` returned false because of
#     the `!wasAborted()` gate; next `PageCache::extend` took the
#     COLD path — full rebuild from byte 0 of the 137 KB chapter,
#     ~25 s wasted with all 36 pages of work thrown away.
#
#     The actual semantic of "layout heap below threshold" is
#     TRANSIENT: some other allocation (image decode arena, cache
#     write staging) is currently pinning the heap; the parser's
#     own byte cursor + XML state are perfectly preserved.  Treat
#     it as a cooperative suspend, not a fatal abort.  Drop the
#     in-flight text block (so heap can recover), latch
#     `stopRequested_+suspended_`, call
#     `XML_StopParser(xmlParser_, XML_TRUE)` for resumable suspend.
#     Next extend reuses the parser via persistent slot (v2.0.105),
#     resumes from the next paragraph after the one we sacrificed.
#
#     Cost: one paragraph silently dropped on each heap-low transient.
#     Benefit: no cold rebuild, no 25-s lost work, page-turn buttons
#     stay responsive because the worker yields between batches.
#
# Expected combined effect on the user's spine=9 trace:
#   * v2.0.106: 1.8 s first page → 17 s extend to 26 → 4 s to 36 →
#     hit heap-low → cold rebuild 25 s → not even shown by Ctrl+C.
#   * v2.0.107: 1.8 s first page → 17 s to 26 → 4 s to 36 →
#     hit heap-low → cooperative suspend → resume continues from
#     next paragraph → 2-3 s more to next batch → user-visible
#     all the way through.
#
# Not in this commit (deferred): Phase 4c-2 (BSS pool for
# wordWidths + lineBreakIndices).  Those are small per-call
# allocations (~100 B each); compared to the deque switch's
# elimination of the dominant 1.8 KB block they're noise.  Will
# revisit if profiling shows them as the next bottleneck.
#
# Also not in this commit: removal of JPEGDEC fallback chain.
# Still waiting for the SmolJpeg decode-path diagnostic to pinpoint
# the FB2 image failure root cause.  Once known + fixed, the three
# fallback sites (Fb2.cpp:1337, ImageConverter.cpp:140,226) will be
# deleted — one-decoder discipline.
#

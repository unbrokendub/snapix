# v2.0.99 deletes the corrupt file in both failure branches.  Next
# render call's `LittleFS.exists()` returns false; the resolve
# fallback shows a placeholder for THIS page render (no change),
# but the empty cache entry no longer blocks any future re-decode
# attempt via the async drain.

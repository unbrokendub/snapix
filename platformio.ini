# v2.0.138 (hotfix — `PageCache::loadLut` now checks `readPod` return
# value and default-initialises `pos`.  Fixes the recurring
# "[CACHE] Invalid page position: 1011724288 (file size: NNNN)" error
# observed across v2.0.130-2.0.137 hardware traces, which cascaded
# into cache clear + parser-reset and visible content discontinuity
# between pages):
#
# PROBLEM (diagnosed from focused audit of `0x3C50C000` constant):
#   `PageCache::loadLut` reads N×uint32_t LUT entries in a tight loop:
#
#     for (uint16_t i = 0; i < pageCount_; i++) {
#       uint32_t pos;                            // UNINITIALISED
#       serialization::readPod(readFile_, pos);  // UNCHECKED rc
#       lut.push_back(pos);
#     }
#
#   `serialization::readPod` (lib/Serialization/src/Serialization.h:29)
#   blindly calls `file.read(&value, sizeof)` and ignores the return
#   value.  If LittleFS returns 0 bytes — happens when the file was
#   just rewritten by the BG worker and the read handle has a stale
#   size, or when a concurrent write truncated the LUT region — `pos`
#   keeps whatever was on the stack at that frame.  Common stack
#   residue: a pointer from a prior function call in the same task.
#   `0x3C50C000` happens to be in ESP32-C3's internal SRAM range, so
#   the residue value LOOKS like a valid uint32_t address — gets
#   pushed into pageLut_ unchallenged.
#
#   Later, `loadPage(N)` calls `pageLut_[N]` to get the byte offset,
#   sees `1011724288` (0x3C50C000), notices it's > fileSize, logs
#   "[ERR] Invalid page position", returns nullptr.  Reader catches
#   nullptr, clears the cache + recreates it from scratch (which then
#   triggered the v2.0.136 parser-reset bug — also now fixed).
#
#   The user-visible result was a cascading recovery storm: pages
#   went unreadable, cache cleared and rebuilt with stale parser
#   state, content shifted between pages.  My v2.0.135-137 fixes
#   addressed the byte-drop + parser-reset symptoms but didn't
#   eliminate the trigger.  This hotfix does.
#
# FIX:
#   Use `serialization::readPodChecked` (already exists at
#   Serialization.h:34 with `[[nodiscard]]`) and default-init `pos`
#   to 0.  On read failure: log the truncation, clear in-flight
#   pageLut_, return false (cascades to caller's normal error path).
#
# REMAINING ISSUE (under investigation, not fixed in this hotfix):
#   Russian EPUB still renders some byte-level mojibake (mid-word
#   bytes substituted with `0xFF`/`0x3F`, visible as `ÿ`/`?` glyphs).
#   v2.0.137 diagnostic logs proved R4.c and R3.6 use IDENTICAL
#   paginator configs, so it's not config-mismatch.  v2.0.137
#   spillover fix addressed byte-drop at page boundaries but not
#   byte-substitution mid-word.  Audit points at `lib/Html5/src/
#   Html5Normalizer.cpp` (EPUB-only path) chunk-boundary handling of
#   multi-byte UTF-8 sequences as the most likely source.  Needs
#   dynamic instrumentation to pin the exact byte-corruption site.
#
# v2.0.137 (hotfix — text spillover buffer + byteOffset accounting.
# Fixes "pages don't connect to each other" and lingering UTF-8 garbage
# at page boundaries.  v2.0.136's diagnostic logs proved R4.c and R3.6
# use IDENTICAL paginator configs, ruling out config mismatch as the
# root cause and pointing at byte-level desync inside the streaming
# pipeline):
#
# PROBLEM (diagnosed from v2.0.136 hardware log):
#   When the paginator triggers pageFull mid-text-run (the common case
#   in any non-trivial document), MarkerStream had already advanced its
#   byte cursor PAST the entire text run BEFORE calling
#   `observer_.onText(...)`.  StreamingPaginator's onText loop returned
#   Stop after the failing word, but the bytes AFTER it (still inside
#   the same text run) got silently DROPPED — neither the live walk
#   nor the resume path ever saw them.
#
#   For long paragraphs, every page boundary lost ~10-50 bytes of
#   content.  Visible as:
#     * Pages don't connect: page N+1 starts mid-sentence somewhere
#       AFTER where page N actually ended.
#     * UTF-8 garbage: when the dropped bytes split a multi-byte
#       sequence, the surviving fragment renders as ÿ°/ÿÿ.
#     * Frequent empty first line on pages: if the dropped bytes
#       included a paragraph break tag, the new page starts with the
#       structural break already lost.
#
#   PageCountingObserver's `bytesSeen_` blindly counted the FULL onText
#   length, so `.idx` byteOffsets pointed PAST the dropped bytes.
#   Resume from those offsets re-read the file starting AFTER the
#   dropped content too — equally broken.
#
# FIX:
#   1. StreamingPaginator gains a `spilloverBuf_[256]` + `spilloverLen_`.
#      On `tryAddWord` failure (page-full carry), the bytes from AFTER
#      the carried word to the end of the text run are saved into the
#      buffer.  When `pageFull_` is already set at the top of `onText`,
#      the ENTIRE incoming text run is saved (appended).
#
#   2. `resetForNextPage` processes spillover AFTER `emitCarryWord` —
#      runs the saved bytes through the normal text path, so they
#      land on the next page in source order (carry word first, then
#      spillover continues from where the source did).  May trigger
#      pageFull again; spillover re-saves and waits for the page
#      after that.
#
#   3. New `StreamingPaginator::pendingBytes() = carryWordLen_ +
#      spilloverLen_` — count of bytes the paginator has READ from
#      onText calls but not yet COMMITTED to a drawn slot.
#
#   4. `PageCountingObserver::checkAdvance` subtracts `pendingBytes()`
#      from `bytesSeen_` when firing `onBoundary_`, so the stored
#      byteOffset points to where the carry word ACTUALLY STARTS in
#      source — not past it.  Resume seek-to-byteOffset re-feeds the
#      dropped bytes from disk; the freshly-constructed paginator
#      processes them as the start of the next page, with empty
#      carry+spillover (equivalent to the live walk's in-memory state).
#
#   5. `kPageIndexVersion` bumped 2 → 3 — old offsets are wrong by
#      `pendingBytes()` per boundary.  Deserialization rejects v2
#      files; R4.c rebuilds them with correct v3 offsets on first
#      visit after upgrade.
#
# RESULT:
#   * Pages connect correctly: page N+1 starts exactly where page N
#     ended in source.  No more "stuck on a page that's a random
#     middle of a paragraph".
#   * UTF-8 garbage at boundaries eliminated (no more split chars).
#   * Empty-first-line on pages should reduce too (paragraph breaks
#     no longer get lost in the drop).
#
# UNIT TESTS (3 new — T23-T25 in StreamingPaginatorTest.cpp):
#   T23: 22-word feed on a 1-line-per-page paginator drains across
#         multiple pages.  Verifies no word is dropped and there's no
#         carry-word duplication.
#   T24: pageFull-at-top-of-onText appends new bytes to spillover —
#         pendingBytes grows.
#   T25: pendingBytes() > 0 after a page-full carry.
#
# Test totals: 193 SmolPort unit tests, all passing.

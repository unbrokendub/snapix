# THE STRUCTURAL PROBLEM:
# Both EpubChapterParser and Fb2Parser implement an R4.c block that
# does a MEASURE-only walk of the just-markerized chapter to capture
# its page-boundary positions and serialise them into an `.idx`
# segment.  The MEASURE walk drives the paginator through the markers
# stream, and the paginator fires a `captureFn(snapshot)` callback
# EACH TIME it OVERFLOWS the current page into the next one.
#
# Consequence: a chapter whose entire rendered content fits in LESS
# THAN ONE FULL PAGE produces ZERO callbacks — the paginator never
# overflows.  R4.c sees `captured.empty()` and `break`s without
# writing an idx.  Then R4.b looks for an idx, finds none, and
# `break`s too.  parsePages falls through to the end with no Pages
# emitted, logs
#   [ERR] [EPUB_CHAP] parsePages reached end with no streaming output
#         spine=N (markerize/idx failed and legacy fallback was
#         removed in v2.0.161)
# and returns false.
#
# The cache layer interprets "0 pages produced" as a hard worker
# failure and removes the (still-empty) cache file.  The ReaderState
# retry loop re-queues the work, and the failure repeats — for every
# single retry, forever, since the cause is deterministic.
#
# Hardware repro (v2.0.174, Valley-of-Genius epubgibkij_um book):
#   1. Open EPUB.  Read through chapters 1-N normally (works fine).
#   2. Navigate to spine=61 (an appendix-style chapter the user
#      hadn't visited before).
#   3. EpubChapterParser successfully hits the markers cache:
#        markerize cache hit spine=61 (UnifiedCache::Markers size=641)
#      i.e. markers ALREADY exist on disk from an earlier session,
#      just 641 bytes total.
#   4. R4.c MEASURE walk runs, paginator consumes the 641 bytes
#      without ever overflowing → captured.empty() → break.
#   5. R4.b sees no idx → break.
#   6. parsePages returns "no streaming output" → cache create fails.
#   7. ReaderState's retry loop re-queues the work → goto step 3.
#      Repeats 50+ times in the hardware log before the user gave up
#      and exited.  Each attempt takes ~1-2 s of CPU + flash I/O;
#      cumulative cost was ~95 seconds of `Loading...` overlay with
#      no progress whatsoever and ~6 MB of redundant log spam.
#
# THE STRUCTURAL FIX:
# A chapter that consumed input bytes but didn't fire a single
# overflow callback is, by definition, "one page or less".  In that
# case synthesize a single `{pageIndex=0, byteOffset=0, styleBits=0}`
# entry in captured.  R4.b then sees pageCount=1 in the idx and
# emits one empty Page object; the streaming render path reads from
# byte 0 of the markers stream and renders the (partial) page
# correctly.  If stats.bytesConsumed is genuinely 0 (truly empty
# markers stream — markerize wouldn't have written the segment in
# that case but be defensive), log a clear error and break — the
# safety net below stops the retry loop.
#
# Applied identically to BOTH parsers:
#   * lib/PageCache/src/EpubChapterParser.cpp
#   * lib/Fb2/src/Fb2Parser.cpp
# because FB2 has the SAME R4.c block with the SAME break-on-empty
# logic — short FB2 sections (title-only, dedication, sub-chapter
# divider) hit it for exactly the same reason.
#
# ============================================================
# ARCHITECTURAL FIX #4 — retry loop now has a hard cap
# ============================================================
#
# THE STRUCTURAL PROBLEM:
# `ReaderState::startPendingEpubPageLoadBackgroundWork` increments
# `pendingEpubPageLoadRetryCount_` on every retry and grows the
# retry delay (120 ms → 350 → 800 → 1500), but the counter only
# saturates at UINT8_MAX (255).  At 1500 ms per attempt beyond #30,
# that's ~6 minutes of retries before the system stops on its own.
# For a deterministically-failing parse (like Fix #3's short-chapter
# bug, or any future heap-failure that consistently trips an abort),
# this is six minutes of burning CPU, flash I/O, and battery on a
# load that will never succeed.
#
# THE STRUCTURAL FIX:
# Add an explicit kMaxPageLoadAttempts = 20 cap.  With the existing
# back-off schedule, that's roughly 3*120 + 7*350 + 10*800 = ~11 s
# of retries — long enough for transient causes (one-off heap peak,
# slow LittleFS journal commit, BG worker scheduler catch-up) to
# clear, short enough that the user sees a definitive failure
# instead of a multi-minute spinner.  After the cap is hit, the
# pending-load state is cleared (so the `Loading...` overlay stops
# repainting) and the next user input — page turn, back, exit — is
# honoured normally; the failed-to-load page sits in the reader's
# previous-page state until the user navigates away.
#
# This is a SAFETY NET, not the primary fix.  With Fix #3 alone, the
# spine=61 case stops failing.  With Fix #4 alone, any future similar
# deterministic-failure bug stops burning battery for 6 minutes.
# Both together = belt + suspenders.
#

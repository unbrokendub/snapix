# v2.0.133 (hotfix — StreamingPaginator partial-word buffer; fixes
# Russian/CJK text rendering as garbled ÿ°/ÿÿ sequences when a chunk
# boundary lands inside a multi-byte UTF-8 character):
#
# PROBLEM (hardware screenshot from Russian EPUB «Гибкий ум» spine 7):
#   Mid-paragraph words like:
#     «категория» → «пÿ°тегория»  ('ка' D0 BA D0 B0 → corrupted)
#     «льда»      → «wÿÿÿÿÿÿ?ьда» ('ль' D0 BB D0 BC → 7 garbage bytes)
#     «великие»   → «вÿÿликие»    ('е' D0 B5 split across chunks)
#     «человека»  → «чел?ÿÿÿ?»    ('овека' lost)
#   Pattern is consistent: 'ÿ' (0xFF) and '°' fallback glyphs appear
#   wherever a chunk boundary splits a Cyrillic 2-byte UTF-8 sequence
#   into a lead byte (0xD0/0xD1) in one onText call and a continuation
#   byte (0x80-0xBF) in the next.  The renderer treats each fragment
#   as latin-1 since they're not valid UTF-8 on their own.
#
# ROOT CAUSE:
#   `StreamingPaginator::onText(bytes, len)` tokenized into words by
#   whitespace boundaries INSIDE this single call's input — no state
#   carried across calls.  MarkerStream reads 4 KB at a time from
#   LittleFS, and a text run (the bytes between two markers) often
#   exceeds 4 KB on long paragraphs.  The chunk boundary then falls
#   somewhere inside the run — sometimes inside a word, sometimes
#   inside a multi-byte UTF-8 char of that word.
#
#   Pre-fix, the trailing bytes of chunk N's onText were committed as
#   a "word" of their own (via tryAddWord), and the leading bytes of
#   chunk N+1's onText started a new "word".  Both halves were measured
#   and drawn independently — text positioning shifted (extra space
#   inserted) AND, for split UTF-8 chars, both halves rendered as
#   latin-1 fallback glyphs.
#
# FIX:
#   New `partWordBuf_[128]` + `partWordLen_` member in
#   StreamingPaginator.  Three integration points:
#
#   (1) `onText`: if the LAST byte of the input is non-whitespace, the
#       trailing word is INCOMPLETE — copy it into partWordBuf_ instead
#       of submitting via tryAddWord.  Return Continue.
#
#   (2) `onText` (entry): if partWordLen_ > 0 from a previous call,
#       greedy-prepend the next non-whitespace bytes of THIS call onto
#       the partial buffer.  Three exits:
#         a) Whitespace encountered → partial is now complete; submit
#            via tryAddWord, advance past whitespace, continue normal
#            tokenization loop.
#         b) End of input → still partial; return Continue, wait for
#            more text.
#         c) Buffer overflow (>128 bytes, pathological for normal text)
#            → submit as truncated word, restart normal tokenization
#            on the overflow bytes.
#
#   (3) `flushPartWord()` called by EVERY non-text event handler
#       (onLineBreak, onParagraphBreak, onPageBreak, onThematicBreak,
#       onHeadingStart/End, onBoldStart/End, onItalicStart/End,
#       onQuoteStart/End) BEFORE the event's own state mutation, and
#       by onStreamEnd.  This ensures the buffered partial gets
#       committed under its rightful style/line context — never leaks
#       across paragraphs or into a wrongly-styled context.
#
#   `resetForChapter()` clears the partial buffer (new chapter starts
#   fresh).  `resetForNextPage()` deliberately does NOT clear it
#   (preserves a word being assembled across a page boundary mid-
#   stream — though in practice this is empty at page reset since
#   pageFull always fires from tryAddWord with partial already
#   committed).
#
# UNIT TESTS (24 new, in StreamingPaginatorTest.cpp):
#   T10: word split mid-stream → reassembled as one drawn word
#   T11: UTF-8 'е' split between lead (0xD0) and continuation (0xB5)
#        bytes — byte-for-byte exact reassembly verified
#   T12: word split across THREE onText calls
#   T13: line break flushes partial before structural break
#   T14: bold-start flushes partial under OLD (plain) style, post-
#        partial text gets NEW (bold) style
#   T15: resetForChapter clears partial — no leakage across chapters
#   T16: end-of-stream flushes partial (final word with no trailing
#        whitespace gets drawn)
#
# Test totals: 158 SmolPort unit tests (was 134), all passing.
#

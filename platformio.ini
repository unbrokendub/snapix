# v2.0.160 (fix — v2.0.159's `ZipItemReader::read()` didn't take the
# `SharedBusLock` before issuing SD reads.  The legacy
# `readFileToStreamDetailed` holds that lock for the entire stream pass,
# so its SD reads serialize with concurrent display SPI writes on
# loopTask (display + SD share the same SPI bus on X4 hardware).  My
# new pull-based reader skipped the lock entirely — first symptom:
#
#   [9833] [ERR] [ZIP] ZipItemReader DEFLATED size mismatch
#                       (expected 78010, got 26556)
#   [9879] [ERR] [EPUB_CHAP] markerize failed spine=11 status=2 ...
#
# What happened: BG worker started chapter markerize at ~4.6 s.  At
# ~4.4-5.9 s loopTask was driving the "Loading…" banner SPI sequence
# (BW write + RED write + waveform wait, ~1.5 s total on the bus).
# uzlib's read callback called `FsFile::read()` mid-display-write; the
# SD bus state got garbled; uzlib decoded the corrupted compressed
# bytes as a premature end-of-stream marker, returned `Done` at
# ~26.5 KB of an expected 78 KB stream.  Reader flagged size mismatch,
# markerize aborted, fallback path ran prepare-extract (still works,
# but the whole point of v2.0.159 was to avoid that 10 s extract on
# every cold chapter open).
#
# Fix: take `SharedBusLock` at the start of each `ZipItemReader::read()`
# call, release on return.  Per-chunk locking (rather than for the
# entire reader lifetime) keeps loopTask responsive — it can grab the
# bus between chunks for display refreshes without waiting for the
# whole 78 KB stream to finish decompressing.
#
# Cost: one mutex op per ~4 KB chunk = ~25 mutex ops per chapter, each
# microseconds vs the millisecond-scale SD I/O the lock protects.  No
# heap, no BSS, no state additions.
#
# v2.0.159 (architectural — replace the prepare-extract-to-temp-file phase
# with on-the-fly markerize-from-ZIP, eliminating the 50 KB transient heap
# peak that's been triggering "heap dangerously low" gates ever since
# v2.0.156 moved the uzlib dict to the heap.  v2.0.156-158 papered over
# the symptom by lowering threshold after threshold (15K → 6K → 8K → 4K);
# this build replaces the architecture that produced the heap peak in
# the first place.
#
# OLD FLOW (init path in EpubChapterParser::parsePages):
#   1. prepareChapterHtml → extracts chapter XHTML from ZIP into a temp
#      `chapters/N.src.html` on LittleFS.  Transient heap: 32 KB uzlib
#      dict + 8 KB SD read buf + 8 KB ZIP output buf + ~5 KB uzlib state
#      ≈ 53 KB.  Wall time: ~5-15 s per chapter.  Disk: ~80 KB temp file.
#   2. tryMarkerizeChapter → re-reads that temp file, runs HtmlStripper,
#      writes `markers/N.bin`.  Heap: negligible (4 KB stack chunk).
#   3. R4.c upfront idx build (in v3_alpha) → reads markers, walks the
#      streaming paginator in MEASURE-only mode, writes `markers/N.bin
#      .idx`.
#   4. R4.b short-circuit → reads idx header, emits N empty Page objects
#      for the page cache; legacy ChapterHtmlSlimParser never runs.
#
# Steps 1+2 were sequential — same compressed bytes read twice, written
# to two different LittleFS files.  Step 1's heap peak (53 KB transient)
# was the only place the abort gates ever tripped at runtime, AND it
# was the slowest single step in the whole pipeline.
#
# NEW FLOW (v2.0.159):
#   1. tryMarkerizeChapter — opens a ZipItemReader for the chapter's
#      href, pulls bytes through HtmlStripper, writes `markers/N.bin`
#      directly.  Transient heap: 32 KB uzlib dict + 8 KB SD read buf +
#      ~5 KB state = 45 KB peak.  NO temp file written.  Wall time:
#      ~3-7 s per chapter (single pass through the compressed data).
#   2-4. Identical to old steps 3-4 (idx + short-circuit).
#
# Lazy fallback: `prepareChapterHtml` is now only called AFTER the R4.b
# short-circuit fails to fire — meaning the legacy
# ChapterHtmlSlimParser is actually going to run.  In v3_alpha with
# successful markerize, this never happens.  In default env (no
# markerizer) or when ZIP-stream markerize fails, the slow extract path
# still works as a fallback — but the abort gates that v2.0.157-158
# lowered now only matter for that fallback, not the common case.
#
# NEW API SURFACE:
#   * `ZipItemReader` (lib/ZipFile) — self-owned streaming reader for a
#     single ZIP entry.  Holds its own FsFile + InflateReader + read
#     buffer; outlives the ZipFile that created it.  `int read(buf, n)`
#     pulls the next decompressed chunk; positive = bytes, 0 = EOF,
#     negative = error.
#   * `ZipFile::openItemStream(name, chunkSize, dictBuffer)` returns
#     `std::unique_ptr<ZipItemReader>` on success.  Used internally by
#     Epub.
#   * `Epub::openItemStream(href, chunkSize, dictBuffer)` wraps the
#     above with the standard href normalisation (percent-decode,
#     strip fragment).
#
# WHY THIS DOESN'T REGRESS THE FRAMEBUFFER RACE (v2.0.152/155):
#   The new dict path is `nullptr` (heap-alloc'd by InflateReader),
#   same as the v2.0.156 fix.  Framebuffer is never used as ZIP
#   scratch from any BG code path.
#
# WHAT TO EXPECT IN LOGS AFTER THIS BUILD:
#   * `[CONTENT][EPUB] markerize done spine=N in=... out=...` appears
#     WITHOUT a preceding `prepare start` / `prepare done` pair when the
#     fast path takes over (the common case).
#   * `[CONTENT][EPUB] prepare start spine=N` now only logs when the
#     R4.b short-circuit didn't fire (rare in v3_alpha).
#   * No more `Aborting job: heap dangerously low` from chapter loads —
#     the peak that was tripping the gates is gone.
#   * Boot heap unchanged (~80 KB free / ~70 KB largest).
#   * EPUB load time per cold chapter drops from ~10-20 s to ~3-7 s.
#
# CACHED CORRUPT FILES (v2.0.152-155 era): unchanged behaviour.  Old
# corrupt `chapters/N.src.html` files are now never read; they sit on
# disk until the user runs Cleanup or the device wipes its cache.
# Old corrupt `markers/N.bin` files (the ones the framebuffer race
# poisoned) are still consulted by R4.b — user should delete those via
# Settings → Cleanup for affected books to force a clean rebuild via
# the new markerize-from-ZIP path.
#
# v2.0.158 (fix — chapter extract STILL aborting after v2.0.157, this time
# from the SECOND of the two heap gates I missed in the previous build.
# `EpubChapterParser`'s own `PREPARE_MIN_FREE_HEAP = 8192` check fires
# inside `shouldAbortPreparePhase` and runs in parallel with the
# `ReaderAsyncJobsController::abortCallback` 6 KB free-bytes gate
# v2.0.157 already relaxed.  The two gates check different metrics:
#   * ReaderAsyncJobsController checks `heap_caps_get_free_size`
#     (total free bytes)
#   * EpubChapterParser checks `heap_caps_get_largest_free_block`
#     (single largest contiguous block — the var is misleadingly
#     named `freeHeap`)
# So they trip independently.  v2.0.157 unblocked free-bytes; this build
# unblocks largest-block.
#
# Log was:
#   [3288] [ERR] [EPUB_CHAP] Low memory during EPUB extract (7668 bytes free)
# That "7668 bytes free" is actually the LARGEST FREE BLOCK at the moment
# of the check, not total free heap.  uzlib's 32 KB dict was alloc'd
# from boot's 69 KB largest block, dropping it to ~37 KB; the 8 KB I/O
# buffer + uzlib state + LittleFS write buffer fragmented the rest
# down to ~7.7 KB largest.  8 KB gate tripped.
#
# Lowered `PREPARE_MIN_FREE_HEAP` from 8192 → 4096.  Same reasoning as
# v2.0.157: the gate fires INSIDE the decompress loop, where uzlib makes
# no new allocations (dict + I/O alloc'd in `init`, before the loop).
# The only mid-extract heap activity is the LittleFS write buffer
# top-up (~512 bytes) and small parser allocations — all well under
# 4 KB.  Matches the `largestBlock < 4 KB` fragmentation guard one layer
# up in `ReaderAsyncJobsController`.
#
# v2.0.157 (fix — chapter extract was still failing after v2.0.156's move to
# heap-allocated ZIP dict, this time for the OPPOSITE reason: the
# `ReaderAsyncJobsController::abortCallback` heap-low gate at 15 KB free
# was calibrated for the OLD framebuffer-scratch model where the dict
# cost 0 heap.  With v2.0.156's heap dict, a chapter-extract pass
# transiently holds ~32 KB dict + ~16 KB I/O + ~5 KB uzlib state ≈ 50 KB
# from a ~75 KB boot heap — leaving only 10–25 KB free during the
# decompress.  The 15 KB gate tripped on every attempt, log fills with:
#
#   [ERR] [RDR_ASYNC] Aborting job: heap dangerously low (10960 bytes free)
#   [ERR] [ZIP] Deflated stream extraction aborted
#   [ERR] [EPUB_CHAP] [CONTENT][EPUB] prepare extract failed spine=11
#
# Lowered the gate from 15 KB → 6 KB.  Rationale:
#   * The gate's job is preventing std::bad_alloc DOWNSTREAM of the abort
#     point.  uzlib has already alloc'd its dict + state by the time the
#     gate fires (allocs happen in `init`, before the decompress loop),
#     so no new mallocs run inside the loop — the heap WON'T drop further
#     during the decompress itself.
#   * 6 KB matches the per-phase `PREPARE_MIN_FREE_HEAP` (8 KB largest)
#     plus a small free-bytes headroom for LittleFS write buffer top-ups
#     and small string operations in the parser.
#   * The `largestBlock < 4 KB` fragmentation guard right below catches
#     the genuinely risky case where the next allocation might actually
#     fail.
#
# No other heap budgets change — this is purely a threshold recalibration
# matching the v2.0.156 heap-dict transient.
#
# v2.0.156 (fix — v2.0.155 regressed chapter loading: every EPUB chapter
# extract failed with `heap dangerously low (13656 bytes free)` and never
# rendered a page.  Boot heap dropped from 75800 → 43660 bytes (exactly
# -32 KB) because v2.0.155 reserved a 32 KB BSS dictionary to replace
# the framebuffer-as-ZIP-scratch.  With heap that tight the chapter-
# extract BG worker can't fit its 8 KB read buffer + 8 KB output buffer
# + InflateReader's own 32 KB dict alloc on top of resident state and
# trips the safety gate on every attempt.
#
# Trade-off this build picks: pass `nullptr` to `readItemContentsTo
# Stream{Detailed}` instead of either the framebuffer (race-prone) or
# a static BSS buffer (heap-starving).  InflateReader heap-allocates
# its own 32 KB dict for the duration of one decompress call and frees
# it on `deinit`, so:
#   * Boot heap recovers to ~75 KB free / ~59 KB largest (the v2.0.154
#     baseline) — chapter-extract BG worker has room to operate.
#   * No permanent BSS reservation — the 32 KB block exists only while
#     a decompress is actually in flight, not at idle.
#   * Framebuffer is never used as ZIP scratch from the BG path, so the
#     v2.0.152/154 race (visible garbage + Russian mojibake) stays
#     fixed.  Same pattern the v2.0.152 render-path image resolver in
#     ReaderState already uses.
#   * Risk: on a deeply fragmented heap, `malloc(32 KB)` can fail and
#     InflateReader returns `AllocFailed`.  The existing chapter-extract
#     retry loop already handles this — same path as any other transient
#     extract failure — so the worst-case behaviour is "load takes one
#     extra retry pass", not a hard error.
#
# v2.0.155 (fix — half-screen vertical-stripe garbage during EPUB "Loading…"
# overlay + mojibake (ÿ ? ° ² ·) in rendered Russian/CJK body text.  Both
# symptoms share a single root cause: `EpubChapterParser` was passing
# `renderer_.getFrameBuffer()` as the 32 KB ZIP back-reference dictionary
# in two BG-task call sites — the chapter-source HTML extract and the
# inline-image extract.  The original comment ("BG worker owns the
# renderer and display isn't active during parsing") was true under the
# v2 page-tree pipeline, but stopped being true once v3 streaming render
# (SNAPIX_MARKERIZED_RENDER) let loopTask paint warm/detached pages
# CONCURRENTLY with BG cache extends.  The race produced:
#
#   (a) The right ⅔ of the e-paper showing as vertical noise stripes
#       under the "Loading…" overlay — the banner pixels in the
#       framebuffer were being overwritten by the uzlib sliding window
#       while the SPI BW-RAM write was reading them out.
#
#   (b) Wrong characters in rendered text after the load completed:
#       ÿ ? ° ² · randomly scattered through Cyrillic words ("хпÿÿите"
#       for "хотите", "пÿÿÿ?цы" for "мышцы").  When a uzlib back-
#       reference "copy 5 bytes from dict[X]" landed at an offset the
#       loopTask had just overwritten with banner pixels, uzlib emitted
#       those PIXEL bytes into the source-HTML output stream.  The
#       markerize pass turned them into marker-stream text payload; at
#       render time `utf8NextCodepoint` decoded the orphaned bytes
#       (Cyrillic continuation 0x80–0xBF and 0xFF font fallback) as
#       standalone Latin-1 codepoints — the exact symbols visible on
#       screen.
#
# Heap won't save us: when BG fires `prepare`, the device often shows
# `largest=26612` — a 32 KB `malloc(INFLATE_DICT_SIZE)` will fail mid-
# stream.  The v2.0.152 ReaderState resolver fix that uses `nullptr`
# (heap malloc) works at render time because memory-trim just ran; the
# BG path has no such guarantee.
#
# Fix: a single 32 KB statically-allocated BSS buffer
# (`kBackgroundZipDictBuffer` in EpubChapterParser.cpp) is shared by
# both BG call sites.  They run sequentially on the same task so one
# buffer is sufficient.  The loopTask render-path image resolver in
# ReaderState continues to pass `nullptr` since it pays a one-shot
# `malloc(32 KB)` per call and that's fine at render time.
#
# Cost: +32 KB always-pinned DRAM (49.8 % → ~59 % of the 320 KB DRAM
# budget — stacks + heap headroom still comfortable).  This is a
# permanent reservation, never freed; the framebuffer race goes away
# regardless of concurrency timing.
#
# Existing corrupt cached chapters: any chapter whose `.src.html`,
# `markers/*.bin`, `markers/*.bin.idx` or `sections/*.bin` was built
# during the race window will continue to render mojibake until the
# user clears the book's cache from Settings → Cleanup (or deletes
# the per-book cache directory manually).  Future builds after the
# fix produce clean source files.  No CACHE_FILE_VERSION bump — the
# corruption is intermittent and book-specific, a global rebuild on
# all users' devices would be too aggressive.
#
# Also in this build: status bar drops the `~` prefix from estimated
# totals.  Per-chapter totals only become EXACT once each section is
# read at least once, so the global metric spends most of its life
# wearing a `~` that never disappears even after a full chapter
# completes — visual noise that taught the user nothing useful.  The
# `/-` form (totalPages == 0, truly unknown) is preserved as the only
# "we don't know" hint.
#
# v2.0.154 (fix — status-bar page-count truncation / off-screen clipping
# for books that paginate to 5+ digits.  User report: "275/~1285" displays
# fine, but anything that pushes the total past 5 digits risked being cut
# without warning because the `pageStr[16]` buffer only fits up to
# "99999/~99999" (12 chars + null = 13 bytes) and a snprintf truncation
# at the boundary would silently drop the last digit.
#
# Two changes in `ui::readerStatusBar` (src/ui/Elements.cpp):
#   1. Bumped `pageStr[16]` → `pageStr[32]` so up to 7-digit each side
#      ("9999999/~9999999" = 16 chars + null = 17 bytes) round-trips
#      through snprintf intact.  Pure stack — no heap, no BSS cost.
#   2. Added a left-clamp on the page-count draw position: if the wide
#      number + tight marginRight would push the left edge of the page
#      string off the left of the panel, we fall back to drawing flush
#      with `marginLeft` instead.  Overlap with the battery cluster is
#      a deliberately ugly fallback that's strictly better than silent
#      off-screen clipping — the user can still read the full number.
# Title still respects `marginRight + pageTextWidth + 10` so the centred
# title gets squeezed (or skipped via `availableTextWidth <= 0` return)
# rather than overlapping the page count.
#
# v2.0.153 (fix — 12 s "first-render" delay on FB2 chapters with many
# TOC sections, e.g. Fire_in_the_Valley.fb2 — 55 sections × 200 ms
# LittleFS.open per probe = 11 s of wall time on book open BEFORE the
# first page paints.  Symptom in the v2.0.152 log:
#
#   [48092] idx loaded spine=8 entries=20
#   [48718] markerized render done type=fb2 spine=8 page=5    ← 626 ms ✓
#   [59865] reader-render-bw: 12225 ms (aa=0 images=0)        ← +11.5 s ✗
#
# The 11 s gap was `ReaderState::initializeGlobalPageMetrics` walking
# all 55 TOC sections and calling `PageCache::probe` for each, just to
# pull the (pageCount, isPartial) pair out of the file header.  The
# probe loop is correct and accurate — but it's pure I/O the user pays
# at every book open, including the FIRST render of the session.
#
# Fix: persist `globalSectionPageMetrics_` to a per-book sidecar
# `<bookCachePath>/metrics.bin` and try loading it before falling back
# to the probe loop.  Format is intentionally small — a 12-byte header
# (magic 'MTRC' + version + spineCount + configHash) plus 7 bytes per
# spine (pages u16 + byteSize u32 + exact u8) = ~397 bytes for the
# 55-section book.  Single LittleFS.open + size_check + read replaces
# 55 file opens.  Measured cost: probe loop ~11 000 ms → sidecar load
# <5 ms on the same hardware — net ~11 s saved on every subsequent
# book-open of a FB2 with section navigation, and on every EPUB with
# more than a handful of spine items.
#
# Correctness: the sidecar's configHash is an FNV-1a over the same
# RenderConfig fields PageCache::probe validates (fontId, line
# compression, indent/spacing levels, paragraph alignment,
# hyphenation, showImages, bionicReading, fakeBold, viewport WxH +
# the metrics-format tag).  A real config change → hash miss → cache
# rebuilt via the slow probe path → fresh sidecar saved.  A spurious
# hit (theoretical FNV-1a collision after a config change) gets
# self-corrected the next time a section becomes exact and
# updateGlobalPageMetrics overwrites the metric in place.
#
# The "currentSection" overlay that the slow path applies (an exact
# in-session page count beats whatever's on disk) is reproduced on
# the fast-path load too, so the first render after open already
# shows the accurate total for the currently-visible spine.
#
# Writes are bounded: one save on the slow-path build, plus one save
# per `becameExact` transition in updateGlobalPageMetrics.  For a
# 55-section book that's at most 56 LittleFS writes over the
# lifetime of reading the entire book — well under the LittleFS
# wear budget.  The atomic-publish path (write `.work` then unlink
# old + rename) keeps the file from ever being torn under a crash.
#
# Invalidation is automatic.  Fb2::clearCache / Epub::clearCache
# already wipe the entire `<bookCachePath>` subtree, which includes
# `metrics.bin` — no code change needed.  A font / viewport change
# bumps the configHash, so the next load attempt misses and the
# slow probe rebuilds from scratch.
#
# v2.0.152 (fix — vertical-stripe garbage on right 2/3 of e-paper
# display when reading EPUBs.  Looked like uninitialised pixels
# in the framebuffer.  Reproducer: open «Гибкий ум» EPUB, watch
# right side of page render as random vertical-line noise.
#
# Root cause: v2.0.148's EPUB streaming-image-cache resolver
# constructed a temp `ChapterHtmlSlimParser` inside `ReaderState
# ::renderPageContents` and wired its `readItemFn` to call
# `epub->readItemContentsToStreamDetailed(href, out, chunkSize,
# renderer_.getFrameBuffer(), ...)`.  The legacy parser uses the
# framebuffer as ZIP-extract scratch when running in ReaderAsync
# (framebuffer is idle there — the main loop has finished drawing).
# But v2.0.148's resolver runs in loopTask DURING the active
# render: ZIP `inflate` decompresses bytes into the framebuffer
# WHILE the streaming paginator is writing text pixels on top.
# Net effect: text pixels on the left land first, then ZIP
# scratch (random deflate state bytes) overwrites the rest of
# the framebuffer, then the partially-corrupted buffer gets
# shipped to the display.
#
# Fix: pass `nullptr` instead of `renderer_.getFrameBuffer()`
# as the `dictBuffer` parameter.  `Epub::readItemContents
# ToStreamDetailed` defaults `dictBuffer=nullptr` and allocates
# its own scratch from heap when needed — one-shot, freed when
# the call returns.  Slightly slower (heap alloc per image
# decode) but correct.  Heap impact: negligible (image-decode
# already allocates many KB of heap for JPEG/PNG decode itself;
# the ZIP scratch is ~10 KB extra).
#
# No host-test changes (this is a device-only call site).
#
# v2.0.151 (fix — EPUB chapter prepare aborting with "heap dangerously
# low" on image-rich chapters after v2.0.149/150 stack bumps.
# Reproducer trace from v2.0.150:
#   [76303] CACHE create start path=...sections/9.bin
#   [76330] EPUB_CHAP parsePages start spine=9
#   [76331] EPUB_CHAP prepare start spine=9
#   [77381] [ERR] [RDR_ASYNC] Aborting job: heap dangerously low (8344 bytes free)
#   [77381] [ERR] [ZIP] Deflated stream extraction aborted
#   ... 10 retries, all fail at the same 8344-byte threshold ...
#
# Root cause: v2.0.149 (+8 KB ReaderAsync) + v2.0.150 (+8 KB loopTask)
# = +16 KB permanently reserved for task stacks.  EPUB chapter prepare
# does ZIP deflate (uzlib ~10 KB working buffer) + HTML normalization
# (Html5Normalizer node tree ~20 KB peak), wants ~30 KB heap free at
# the start.  v2.0.150 left ~38 KB free at entry → 30 KB alloc dropped
# to ~8 KB → trip "dangerously low" threshold → abort.
#
# Fix: heap-allocate StreamingPaginator's 2 KB spilloverBuf_ instead
# of holding it inline on the stack.  The buffer was the reason
# v2.0.149/150 needed the stack bumps (paginator instance was
# ~2.6 KB inline; with heap-alloc it's ~600 B).  Revert both stack
# bumps so heap budget returns to pre-v2.0.149 (78 KB free at entry).
# Net for the user: streaming render fits in original stacks AND
# EPUB chapter prepare has its heap back.
#
# Implementation: `std::unique_ptr<uint8_t[]> spilloverBuf_` allocated
# once in StreamingPaginator ctor (not per resetForChapter), freed
# in dtor.  Two callers (saveSpillover write, resetForNextPage read)
# updated to use `spilloverBuf_.get()` for the raw pointer.  No
# semantic change — same buffer, same capacity.
#
# Stack-frame impact:
#   * StreamingPaginator instance: ~2.6 KB → ~600 B
#   * Heap cost per render: one 2 KB malloc/free pair
#
# Reverted:
#   * `kCacheTaskStackSize` 28672 → 20480
#   * `getArduinoLoopTaskStackSize()` 24576 → 16384
#
# Net heap budget: +16 KB recovered (8 KB per task).
#
# Host tests pass unchanged.
#
# v2.0.150 (fix — second stack-protection panic, this time in
# `loopTask` (not ReaderAsync) after v2.0.149's fix shipped.
# Reproducer trace:
#   [25797] page-turn release button=3
#   [25798] Rendered via detached warm page spine=7 page=15
#   [25817] R3.6 paginator cfg spine=7 type=fb2 ...
#   Guru Meditation: Stack protection fault in task "loopTask"
#
# Streaming render runs from BOTH tasks: ReaderAsync (cache extend
# / R4.c) AND loopTask (page-turn → renderCachedPage →
# renderPageContents → renderMarkerizedPage).  v2.0.149 bumped
# only ReaderAsync (28 KB); loopTask was still at 16 KB so the
# same ~7 KB streaming frame atop loopTask's existing ~12 KB
# cover-gen chain overflowed.
#
# Fix: bump `getArduinoLoopTaskStackSize()` 16384 → 24576 (+8 KB
# DRAM) — same trade-off as ReaderAsync.  Symmetric with v2.0.149.
#
# After both bumps: total +16 KB DRAM headroom (8 KB per task)
# at ~10% of the 145 KB heap budget.  Stack-protection canaries
# still catch any future growth.
#
# Also confirms what v2.0.149's release notes said about FB2
# image flow — the trace shows the new path working end-to-end:
#   [18474] cacheImage[fast]: registered img_24 ... (BMP pending)
#   [18502] cacheImage[fast]: registered img_25 ... (BMP pending)
#   [18541] cacheImage[fast]: registered img_26 ... (BMP pending)
#   [20320] decodeImageDirect: img_24 -> .../img_24.bmp (240x179)
#   [20322] scheduled repaint after FB2 image work
# Three FB2 images detected during R4.c MEASURE walk, decoded in
# background (via Fb2's pending-image queue), repaint triggered
# after each decode → images appear on the page progressively.
#
# v2.0.149 (fix — stack-protection panic in Fb2Parser R4.c MEASURE
# walk on image-heavy chapters.  Reproducer trace from v2.0.147:
#   [FB2_PARSE] markerize cache hit section=9
#   [FB2_PARSE] R4.c paginator cfg section=9 ...
#   Guru Meditation Error: Stack protection fault
#   SP = 0x3fcc72d0, bounds = 0x3fcc72e0 - 0x3fccc2d0
# SP landed 16 bytes BELOW the lower stack bound — hard overflow.
#
# Root cause: StreamingPaginator grew over the v2.0.140-2.0.146
# series (spillover buffer 256 → 2048, +1792 B; pending image
# 128 B; byte-offset tracking 12 B; total instance ~2.6 KB).
# Combined with chunkBuf[4096] + captured snapshots vector +
# lambda captures + adapter, the R4.c stack frame is ~7 KB.
# Atop the ReaderAsync task's existing parent chain (~13 KB high
# water observed in v2.0.139 trace), 20 KB stack is exhausted.
#
# Fix: bump `kCacheTaskStackSize` 20480 → 28672 (28 KB).  +8 KB
# DRAM headroom lets the streaming pipeline grow another ~2 KB
# before the next bump.  Stack-protection canary still catches
# any future regression.
#
# Also confirms FB2 image-caching path matches EPUB:
#   * FB2 R4.c MEASURE walk calls `fb2_->cacheImage(...)` via the
#     resolveImage lambda (v2.0.147)
#   * EPUB streaming render calls
#     `ChapterHtmlSlimParser::cacheImageForStreaming` via a temp
#     parser instance (v2.0.148)
#   * Both lazy-decode on first encounter, both write BMP to the
#     same per-book imageCachePath, both return path that
#     `GfxRendererPaginatorAdapter::resolveImageSize` reads via
#     standard Bitmap parser.
#
# Host tests unaffected (stack size is device-only).  287/287
# SmolPort tests pass.
#
# v2.0.148 (feature — EPUB inline images in the streaming render path.
# Closes the v2.0.147 follow-up: FB2 got images via Fb2::cacheImage
# (already public), but EPUB streaming path returned empty BMP paths
# because `ChapterHtmlSlimParser::cacheImage` was private + tightly
# coupled to the full parser instance.  v2.0.148 adds a thin public
# wrapper `cacheImageForStreaming(src, &path, &w, &h)` that delegates
# to the private cacheImage and shapes the result for the streaming
# resolver.
#
# Implementation in ReaderState.cpp:
#   * For EPUB chapters, construct a `std::shared_ptr<
#     ChapterHtmlSlimParser>` once per render with the MINIMAL setup
#     `cacheImageForStreaming` needs: empty filepath, real renderer,
#     RenderConfig, no-op completePageFn, real chapterBasePath +
#     imageCachePath, and a `readItemFn` that wraps the EPUB's own
#     `readItemContentsToStreamDetailed` so JPEG/PNG can be pulled
#     from the ZIP just like the legacy parser does.
#   * The temp parser's parse loop is never invoked (no expat init,
#     no marker pipeline running) — only `cacheImageForStreaming`.
#     Construction is just member-init: cheap.
#   * Captured into the `resolveImage` lambda by `shared_ptr` so its
#     lifetime spans the render call.
#   * Same FB2 path as v2.0.147 — `Fb2::cacheImage` was already
#     public so no wrapper needed.
#
# What "legacy parser" actually meant pre-fix:
#   The v3 streaming pipeline (HtmlStripper → markers → Streaming
#   Paginator → GfxRenderer) fully replaced pagination + rendering,
#   but image DECODING (JPEG/PNG → BMP) still lived inside the v2.x
#   ChapterHtmlSlimParser::cacheImage method.  When R4.b short-
#   circuit skipped that parser (the whole point of R4.b/R4.c —
#   avoid the heap-heavy parse), images stopped getting cached.
#   v2.0.148 makes the decode logic callable directly so the
#   streaming pipeline is finally self-sufficient for images too.
#
# Cost: one temp ChapterHtmlSlimParser per render (~2 KB stack/heap
# of member-init; no expat).  First visit per chapter pays the JPEG
# decode (~200-1000ms per image); subsequent visits hit the cached
# BMP and are fast.  Heap impact on render: negligible (decode runs
# in image-cache code path that already releases its scratch).
#
# v2.0.147 (fixes — two user-reported issues on v2.0.146):
#
# (1) Empty page 0 after FB2 indexing.
#     FB2's HtmlStripper emits kPageBreak on `<section>` open (it
#     was designed that way: every section starts a fresh page).
#     For a freshly-indexed chapter, that means the very first event
#     fed to StreamingPaginator is a page break → onPageBreak set
#     `pageFull_=true` immediately → checkAdvance fired the boundary
#     callback for page 1 → currentPage_ jumped from 0 to 1.  Page
#     0 was "rendered" but never received any content — user saw
#     blank screen, had to advance once more to see the chapter
#     title + body.
#     Same root-cause for HTML chapters that begin with stray
#     `<hr>`-style page-break tags.
#     Fix: onPageBreak now treats fresh-page state (cursorY == top
#     margin, no line content, no carry, no pending image) as no-op
#     and returns Continue.  Subsequent kPageBreak after real
#     content still triggers pageFull as before.
#     `.idx` version bumped 8 → 9 to force rebuild — pre-fix indices
#     have page boundaries shifted by 1 for any chapter that started
#     with a page break.
#     New test: StreamingPaginatorTest T34/T35.
#
# (2) FB2 images not displayed.
#     Streaming render path skips the legacy ChapterHtmlSlimParser /
#     Fb2Parser image-decode logic, so the on-disk BMP cache that the
#     v2.0.145 resolver looks up was empty for never-legacy-rendered
#     chapters.
#     Fix: the resolveImage callback (in ReaderState.cpp and
#     Fb2Parser.cpp R4.c MEASURE walk) now calls
#     `Fb2::cacheImage(binaryId, ...)` directly.  That method is
#     idempotent (no-op if BMP already exists, full decode + write
#     if not), public, and self-contained — no Fb2Parser instance
#     needed.  First MEASURE walk of an FB2 chapter pays the decode
#     cost upfront; subsequent renders just open the cached BMP.
#     Strips leading `#` from `<image l:href="#id">` so the binary
#     id lookup works.
#     EPUB still uses lookup-only resolver (the
#     ChapterHtmlSlimParser.cacheImage equivalent for EPUB is
#     private + needs a heavy parser instance; deferred to a later
#     version that either makes it public or extracts the decode
#     logic into a standalone helper).
#
# No host-test changes for image caching (Fb2::cacheImage is a
# device-only path that touches LittleFS + SmolJpeg / SmolPng).
# Existing 286 SmolPort host tests pass + 2 new T34/T35 = 288 pass.
#
# v2.0.146 (fix — streaming render path now honours the user's
# `fakeBold` setting (Settings → Reader → Fake Bold).  Pre-fix, the
# legacy Page-tree path applied fakeBold (multi-pass draw to simulate
# bold without a real bold-font variant on disk) but the v3 streaming
# paginator just passed BOLD style through to drawText, which for
# users with body-only fonts (no bold variant) silently fell back to
# REGULAR — bold-marked text rendered identical to plain.
#
# Implementation (mirrors legacy TextBlock::render multi-pass):
#   * `GfxRendererPaginatorAdapter` ctor gained `fakeBoldMode` param
#     (0 = off / use real bold, 1 = bold / 2× draw at x and x+1 with
#     REGULAR, 2 = extrabold / 3× draw at x-1, x, x+1).
#   * `applyFakeBoldSubstitution` rewrites BOLD → REGULAR,
#     BOLD_ITALIC → ITALIC when fakeBoldMode > 0; returns true if
#     applied so `drawWord` knows to multi-pass.
#   * `measureWidth` and `getSpaceWidth` ALSO apply the substitution
#     so layout widths match what actually gets painted (≈1-2 px
#     difference per word from multi-pass is below typographic
#     significance, same trade-off as legacy).
#   * `ReaderState` passes `core.settings.fakeBold` into the adapter.
#   * `EpubChapterParser` + `Fb2Parser` pass `config_.fakeBold` into
#     their R4.c MEASURE-walk adapters so cold-walk page boundaries
#     account for fakeBold width changes (otherwise resume seeks
#     land off-by-some bytes — same class as v2.0.140 had).
#
# `.idx` configHash now folds fakeBold (3rd param to
# `computePageIndexConfigHash`, default 0) so future fakeBold setting
# changes auto-invalidate the cache (one-off rebuild instead of
# silently-wrong layout).  Also bumped `kPageIndexVersion` 7 → 8
# so pre-v146 indices (built with fakeBold implicitly off) are
# detected stale on first load — users who had fakeBold ≠ 0 in
# settings now get the right widths.
#
# No host-test additions for this round (the relevant code paths are
# device-only — GfxRenderer-backed adapter).  Existing 284 SmolPort
# host tests pass unchanged.
#
# v2.0.145 (feature — Indent + Center marker types, restored inline
# image rendering in the streaming pipeline, and tightened up several
# tag emissions for proper visual presentation.  Goal: streaming
# paginator now produces visuals comparable to the legacy
# ChapterHtmlSlimParser Page-tree renderer.
#
# New markers (HtmlStripper emits, StreamingPaginator consumes):
#
#   kIndentOn / kIndentOff ('D' / 'd'):
#     Push left margin in by `kIndentStep=24 px` per active level,
#     max `kMaxIndentDepth=4` nesting.  Effective left =
#     marginLeft + depth × indentStep, applied per-line at flush time
#     AND in tryAddWord fit-checks.
#
#   kCenterOn / kCenterOff ('C' / 'c'):
#     flushLine centers the line (start x = effectiveLeft + slack/2)
#     instead of left-aligning + justifying.  Simple on/off boolean.
#
# Stripper changes:
#   * <ul>/<ol>     — now also emit kIndentOn (open) / kIndentOff
#                     (close) wrapping all items so the bullets
#                     visually offset from the surrounding margin.
#   * <blockquote>  — now also emits kIndentOn/Off in addition to
#                     kQuoteOn/Off so quotes render as the proper
#                     "indented italic block".
#   * <center>      — proper kCenterOn/Off (was paragraph-break-only).
#   * FB2 <title>   — wraps in kCenterOn/Off so chapter titles centre.
#   * FB2 <subtitle> — same as <title>.
#
# Image rendering (re-enabled after the legacy ImageBlock path was
# bypassed by the streaming renderer):
#
#   PaginatorRenderer gained two virtual methods:
#     * resolveImageSize(path, len, &w, &h) → looks up cached BMP,
#       returns dimensions.  Default returns false (no images).
#     * drawImage(x, y, w, h, path, len) → paints cached BMP onto
#       the framebuffer.  Default no-op.
#
#   StreamingPaginator.onImageRef now:
#     * Flushes any in-progress text line.
#     * Calls resolveImageSize; if the image fits in the remaining
#       vertical space, paints it (centered horizontally within the
#       indented working column) and advances cursorY.
#     * If it doesn't fit, stashes the path+dimensions and sets
#       pageFull so the next page renders it before any text.
#     * resetForNextPage drains the pending-image slot first.
#
#   GfxRendererPaginatorAdapter implements the two image hooks via
#   a caller-provided `resolveImagePath` callback (typed
#   ResolveImagePathFn) that returns the on-disk BMP path for a
#   given marker payload.  ReaderState wires this using the SAME
#   `<imageCachePath>/<std::hash(resolvedPath)>.bmp` convention
#   ChapterHtmlSlimParser.cacheImage uses, so cached BMPs created
#   during chapter parse are picked up directly with no extra
#   decode work in the streaming path.
#
#   EpubChapterParser.cpp + Fb2Parser.cpp wire the same resolver
#   into the R4.c upfront-build paginator so MEASURE-walk page
#   boundaries account for image heights — identical layout
#   between cold-walk idx build and runtime resume render.
#
# `.idx` version bumped 6 → 7 (any chapter using `<ul>`/`<ol>`,
# `<blockquote>`, `<center>`, FB2 `<title>`/`<subtitle>`, or
# images will see new page boundaries due to indent / center / image
# layout effects).  Old v6 indices auto-detect stale → rebuild.
#
# New host tests:
#   StreamingPaginatorTest T29-T33 — indent + center geometry
#   MarkerizeChapterTest T17-T20   — new marker emissions
# Existing 284 SmolPort tests pass.
#
# Stack impact: no new stack allocations — pending image path is
# in-class (128 B), indent depth is 1 B, center flag 1 B.
# Heap: zero (cached BMPs read lazily, returned to free file
# handle when adapter methods return).
#
# v2.0.144 (feature — broader HTML/FB2 tag handling in HtmlStripper.
# Previously a number of common semantic tags fell through unhandled,
# so their content rendered as run-on prose with no block separation
# or styling.  Most-visible additions:
#
#   HTML / EPUB:
#     <ul>, <ol>     — paragraph break before and after the list
#                      (separates the list visually from surrounding
#                      paragraphs).
#     <li>           — line break + "• " bullet glyph (U+2022 in
#                      UTF-8) prepended as inline text on item open.
#                      Numbered <ol> items currently also get bullets
#                      (proper numbering needs a per-list counter
#                      state machine, deferred).
#     <div>          — paragraph break on close.  Common in modern
#                      EPUBs as a paragraph-like block container.
#     <center>       — paragraph break (no centering marker exists
#                      yet; at least isolates the centered content
#                      from surrounding paragraphs).
#
#   FB2:
#     <epigraph>     — kQuoteOn / kQuoteOff around the epigraph body,
#                      matching the legacy ChapterHtmlSlimParser
#                      "indented italic block" appearance.
#     <text-author>  — paragraph break + italic on open, italic off
#                      + paragraph break on close.  Renders the typical
#                      "— Имя Автора" attribution line in italic on
#                      its own line.
#     <poem>         — paragraph break around the whole poem (separates
#                      from surrounding prose).
#     <stanza>       — paragraph break between stanzas so they don't
#                      visually run together.
#
# All new handlers covered by MarkerizeChapterTest T11-T16 (15 new
# host tests).  No paginator / `.idx` changes — this is pure marker
# emission expansion in the stripper.  Older books that didn't use
# these tags are unaffected; new tag-rich books (especially non-
# fiction with lists) gain proper block separation.
#
# v2.0.143 (feature — full text justification in the streaming paginator,
# restoring the visual alignment the legacy ChapterHtmlSlimParser
# produced.  Pre-fix, wrapped body lines ended raggedly wherever the
# last word that fit landed; post-fix, the slack between the natural
# line end and the right margin gets distributed evenly across the
# inter-word gaps so each wrapped line reaches `pageWidth -
# marginRight` exactly.  Last line of a paragraph (flushed via
# explicit break) stays left-aligned per typographic convention;
# heading lines stay left-aligned regardless (full-width centered
# headings would need a separate code path).
#
# Slot-level mechanics:
#   * `flushLine(bool justify)` — wrap callers pass `true`, event-
#     driven callers (line break / paragraph break / page break /
#     thematic break / style change / EOS) pass default `false`.
#   * Within a justified line: count gaps (slots with `noLeadingSpace=
#     false`, so inline-style mid-word continuations like `хо<b>ро</b>шо`
#     stay glued), compute slack = rightMargin - naturalLineEnd,
#     distribute `slack / numGaps` extras per gap plus 1 px to the
#     first `slack % numGaps` gaps.  Cap per-gap stretch at 3× natural
#     spaceWidth so a 2-word line with tons of slack doesn't render as
#     "spaced     out     weirdly".
#   * Headings (`styleBits_ & kStyleHeading`) skipped — heading layout
#     stays left-aligned.
#
# No effect on page boundaries / `.idx` byteOffsets: `cursorX_`
# (used by `tryAddWord` fit-checks) still tracks the natural
# unjustified width; justification only redistributes pixels at
# draw time.  No `.idx` version bump needed.
#
# New host tests: StreamingPaginatorTest T26-T28
#   * T26: wrapped body line reaches right margin
#   * T27: paragraph-last line stays ragged-right
#   * T28: noLeadingSpace continuations skip justification extras
#
# v2.0.142 (fix — spillover buffer capacity was 256 bytes; long Russian
# paragraphs (>500 bytes) that triggered `tryAddWord` carry near the
# start of the run silently dropped their tail when stored as
# spillover.  The cold-walk's `.idx` byteOffsets were computed from
# the LOSSY in-memory replay, but subsequent resume renders read ALL
# bytes from disk → DIFFERENT content per page → stored byteOffsets
# point INTO the resume's just-rendered content, and each page-turn
# appears to "skip" a chunk of source text.  Visible in «Гибкий ум»
# v2.0.141 trace as ~350 bytes of text missing between page 135's
# "Отдаленные нейронные" and page 136's "синхронизации гамма-волн".
#
# Fix (low-risk):
#   * Bumped `kSpilloverCapacity` 256 → 2048.  Covers the typical
#     Russian paragraph spillover tail size; +1792 bytes per
#     paginator instance (~19.5 KB stack high water vs 20 KB budget,
#     within margin).
#   * Also wired source-byte-offset tracking through saveSpillover →
#     spilloverSourceOffset_ so any tryAddWord carry that fires
#     during spillover replay (rare — spillover bytes filling the
#     fresh next page) gets the correct absolute carryStartByteOffset_
#     (previously: off by the position-in-onText where spillover
#     started, because resetForNextPage didn't restore
#     `currentSourceOffset_` before re-feeding the spillover).
#   * `.idx` version bumped 5 → 6 to force rebuild (old v5 indices
#     have wrong offsets for boundaries that hit the truncation).
#
# v2.0.141 (fix — PageCountingObserver's `bytesSeen_` counter started
# at 0 unconditionally, even when the caller seeked the file past
# the start of the chapter for a resume render.  All NEW boundary
# offsets captured during such a resume were therefore RELATIVE to
# the seek start, not absolute source positions.  Those got pushed
# into `streamOffsetCache_` and persisted to `.idx`; on the next
# page-turn the caller seeked to one of those relative offsets
# (treating it as absolute) and landed grossly-too-early in the
# source.  Cumulative drift: pages past the cold-walk range all
# showed near-identical content with only the immediate bytes
# past the seek (top of the page) varying — user-visible as "при
# перелистывании менялись только первые три строки на экране" in
# the «Гибкий ум» v2.0.140 trace.
#
# Pre-existing bug — not introduced by v2.0.140.  Latent under
# pre-v2.0.122 (no streaming render path) and partly hidden in
# v2.0.122-2.0.139 by:
#   * .idx version bumps deleting old indices on each fix release,
#     so most user sessions did fresh cold walks and never reached
#     the resume-past-cold-walk-range regime.
#   * v2.0.139's pre-v2.0.140 byteOffset math (bytesSeen - pending)
#     happened to overshoot by event-marker-size for some boundaries,
#     producing slightly-larger relative offsets that landed in
#     more-plausible-looking source positions than v2.0.140's
#     accurate-but-still-relative carryStartByteOffset values.
#
# Fix:
#   * `MarkerizedRenderResume` gained `byteOffset` field — absolute
#     source position of the first byte `readChunk` returns.
#   * `PageCountingObserver` constructor takes the start offset
#     and initialises `bytesSeen_` to it.
#   * `renderMarkerizedPage` propagates `resume.byteOffset` to the
#     observer; cold-walk paths (startPage=0 default) pass 0 — same
#     behaviour as pre-fix.
#   * `ReaderState`'s streaming-render call site sets
#     `resume.byteOffset = it->byteOffset` matching the file seek.
#   * `.idx` version bumped 4 → 5 to force rebuild (old v4 indices
#     have a mix of correct cold-walk + wrong resume-captured offsets,
#     all dominated by the wrong ones once the user navigates a few
#     pages past the cold-walk's last entry).
#   * New host test `v140_resume_p2_offset_absolute` + `_p3_…` in
#     MarkerizedPageRenderTest exposes this exact bug class: render
#     scratch + cold-walk to capture absolute boundary offsets,
#     resume from page 1's offset, verify NEW boundaries (pages 2, 3)
#     match the absolute offsets from the cold walk.  Pre-fix:
#     mismatch by exactly `snaps[0].byteOffset` (seek start).
#
# v2.0.140 (fix — byteOffset accounting in
# `MarkerizedPageRender::PageCountingObserver::checkAdvance` was wrong
# when the carry word came from a partial buffered across a chunk
# boundary AND a non-text event marker (line break, anchor, image
# ref, style toggle) fired before `flushPartWord` triggered the
# carry.  Those event marker bytes were already in `bytesSeen_` but
# had no place in `pendingBytes()`, so byteOffset overshot the carry
# word's first byte by exactly the event-marker size (2 / 3 / 4
# bytes depending on the event).  Russian text with 2-byte UTF-8
# chars then landed mid-codepoint on resume — the continuation byte
# rendered as `?` and the next char appeared as the visible first
# glyph.  Matches the user's «Гибкий ум» symptom: `?o написать`
# instead of `что написать` at page boundaries near inline anchors.
#
# Fix design (no caller behavioural change):
#   * `StreamingPaginator` now records source byte offsets for the
#     partial word's first byte (`partialStartByteOffset_`) and the
#     carry word's first byte (`carryStartByteOffset_`).
#   * `tryAddWord(..., srcOffset)` stores `srcOffset` into the carry
#     slot on page-full.  All five call sites pass the right offset:
#     main-loop word (`currentSourceOffset_ + wordStart`),
#     partial-complete via gobble (`partialStartByteOffset_`),
#     partial-overflow flush (`partialStartByteOffset_`), oversized
#     word in main loop (`currentSourceOffset_ + wordStart`), and
#     `flushPartWord` from event handlers (`partialStartByteOffset_`).
#   * `PageCountingObserver::onText` pushes the source offset into
#     the paginator via `setCurrentSourceOffset(bytesSeen_)` BEFORE
#     incrementing bytesSeen.
#   * `checkAdvance` reads `carryStartByteOffset()` directly when
#     `carryWordLen() > 0`, replacing the old
#     `bytesSeen_ - pendingBytes()` math.  Fallback math still
#     applies for the rare carry-less page-full (cursor-only advance).
#   * `.idx` version bumped 3 → 4 so pre-fix offsets are detected
#     stale and rebuilt from scratch.
#   * Diagnostic LOG_INF + Logging include in `GfxRendererPaginatorAdapter`
#     stripped (root cause now localised; the byte dump confirmed bytes
#     reaching `drawText` are byte-for-byte from the markers stream).
#   * No host-side test regressions; new test `MarkerizedPageRenderTest`
#     R3.6 partial-then-event-carry case proves the fix.
#
# v2.0.139 (diagnostic — log first-16-bytes hex dump of each
# `GfxRendererPaginatorAdapter::drawWord` call, rate-limited to first
# 30 words after boot.  Mojibake (`ÿ`/`?` mid-word) persists despite
# v2.0.138 cache-LUT fix; host-side audit of the user's actual
# «Гибкий ум» EPUB (/test/fixtures/) PROVED the markers file and
# StreamingPaginator output are byte-perfect — every Russian word
# UTF-8-clean, zero 0xFF bytes anywhere in the chapter's markers
# stream, zero 0xC3 0xBF sequences that could decode to U+00FF (ÿ).
# So `ÿ` glyphs the device renders MUST come from corruption BETWEEN
# `drawWord(text, len)` and `drawText(buf)` — i.e. in
# `GfxRendererPaginatorAdapter::drawWord` itself OR earlier in some
# buffer that's writing 0xC3 bytes the paginator never produced):
#
# This version is INSTRUMENTATION ONLY — no behavioural change. Once
# the device log shows the byte dump for a confirmed-mojibake page,
# we can localise the corruption and ship a targeted fix in v2.0.140.
#
# Test instructions:
#   1. Flash v2.0.139 to device.
#   2. Open «Гибкий ум» EPUB, navigate to a page where mojibake is
#      visible.
#   3. UART log will show ~30 `[STREAM_DBG] drawWord len=N fid=I
#      style=S bytes=[XX XX XX...] text='...'` lines.
#   4. If any byte hex contains `FF` or `C3 BF`, the corruption is
#      upstream (in StreamingPaginator's spillover/partial/line buffers).
#      If hex is clean but rendered char is mojibake, the corruption is

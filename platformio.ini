# FIX (UnifiedCache.cpp):
# Replace the unordered_map registry with a single CurrentEntry struct
# (path + shared_ptr).  shared() compares the requested path against
# the cached one:
#   * Match → return the cached shared_ptr (zero allocation, no scan).
#   * Mismatch → drop the cached shared_ptr (potentially destroying

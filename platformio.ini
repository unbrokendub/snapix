# eliminates the per-page MEASURE-only walk overhead):
#
# v2.0.124 hardware trace showed streaming render works but per-page
# turn cost grows with page index:
#   page=1: 56 ms   (skip 1 page)
#   page=2: 57 ms   (skip 2 pages)
#   page=5: 72 ms   (skip 5 pages)
# vs legacy ~35 ms (no skip — direct page-N from cache).  Linear
# slowdown at ~5-7 ms per skipped page on the 480×800 viewport.
#
# Root cause: paginator must MEASURE-walk events for pages 0..N-1
# in draw-suppressed mode before it can render page N.  For
# 100-page chapters page=99 would be ~600 ms turn — unacceptable.
#
# FIX (this commit): per-spine in-memory cache of page-boundary
# snapshots — `(pageIndex, byteOffset, styleBits)` — captured
# during normal rendering via the new `onPageBoundary` callback
# in `renderMarkerizedPage`.  On subsequent renders within the
# same chapter session:
#   1. ReaderState looks up the highest-cached page <= target.
#   2. Seeks the LittleFS markers file to that byte offset.
#   3. Calls renderMarkerizedPage with `resume.startPage` set
#      so the paginator starts at that page index with the
#      saved styleBits (so any bold/italic span open across
#      the resume point continues correctly).
#   4. Paginator processes events from the resume point only —
#      typically 1 page worth — until `currentPage_` reaches
#      target.
#
# WHAT LANDED:
#
# (1) `MarkerizedPageRender.h/cpp` extended:
#     * `PageBoundarySnapshot { pageIndex, byteOffset, styleBits }`
#     * `OnPageBoundaryFn` callback type
#     * `MarkerizedRenderResume { startPage, styleBits }` parameter
#     * `renderMarkerizedPage` takes optional `resume` and
#       `onPageBoundary` parameters; defaults match v2.0.124
#       behaviour (resume from scratch, no callback).
#
# (2) `StreamingPaginator::setStyleBits(uint8_t)` — direct setter
#     for the active style bit mask.  Called by `renderMarkerizedPage`
#     when resuming so the paginator continues mid-style-scope
#     correctly.
#
# (3) `PageCountingObserver` (anonymous-namespace inside
#     MarkerizedPageRender.cpp) tracks `bytesSeen_` per event
#     dispatched (text run length OR marker byte count); fires
#     the `onPageBoundary` callback on each rollover.
#
# (4) `ReaderState` (under SNAPIX_MARKERIZED_RENDER):
#     * New member `streamOffsetCache_` — vector of snapshots
#       keyed by spine index.
#     * Cleared on spine change.
#     * Lookup before every render finds best resume point;
#       passes to renderMarkerizedPage.
#     * Capture callback appends new boundaries to the cache.
#     * Log line gains `resume=<startPage> cached=<count>`
#       fields for diagnosability.
#
# (5) `MarkerizedPageRenderTest` adds 14 assertions:
#     * Callback fires for each skipped page with correct
#       (pageIndex, byteOffset) + monotonic offset growth
#     * Direct-resume from captured offset produces same
#       output as scratch render
#     * No callback fires when target=0 (no skipping)
#
# Test results: 34/34 pass (was 20/20 in v2.0.121).
#
# EXPECTED BEHAVIOUR ON HARDWARE:
#
# First render of a chapter:
#   `[STREAM] markerized render done spine=N page=0 skipped=0
#    bytes=B resume=0 cached=0`
# Second page turn forward (resume from cache):
#   `[STREAM] markerized render done spine=N page=1 skipped=0
#    bytes=b resume=1 cached=1`  ← skipped=0 means O(1) seek hit
# Page 5 of same chapter (already cached):
#   `[STREAM] markerized render done spine=N page=5 skipped=0
#    bytes=b resume=5 cached=5`
# Backward navigation (page 5 → page 2):
#   `[STREAM] markerized render done spine=N page=2 skipped=0
#    bytes=b resume=2 cached=5`
# Forward into uncached territory (page 5 → page 8):
#   `[STREAM] markerized render done spine=N page=8 skipped=3
#    bytes=B resume=5 cached=8`  ← only 3 pages walked, not 8
#
# Cache lifetime: in-memory, lost on chapter change OR
# reader exit.  R3.7 follow-up persists to
# `markers/<spine>.idx` for cross-session reuse + faster
# random-access into chapters.
#
# v2.0.124 (turn ON SNAPIX_MARKERIZED_RENDER=1 in v3_alpha — first
# hardware test of the v3 streaming render pipeline):
#
# Goes-live moment for the v3 render pipeline.  Same EPUB chapter
# now flows through TWO paths in v3_alpha:
#
#   1. Markerize side-channel writes `markers/<spine>.bin` once
#      per chapter (R2, since v2.0.116).
#   2. Render path checks for the sidecar and, if present, drives
#      `StreamingChapterRenderer → StreamingPaginator → GfxRenderer
#      PaginatorAdapter → GfxRenderer` instead of `page.render()`
#      on the legacy heap-allocated Page tree (R3.5, since v2.0.122).
#
# This commit just flips `SNAPIX_MARKERIZED_RENDER=0 → 1` in the
# v3_alpha env build flags.  All the wiring landed in v2.0.121-122;
# this is the activation.  Logs to watch:
#
#   [STREAM] markerized render done spine=N page=P skipped=K bytes=B
#     → v3 path rendered the page successfully.  `skipped` is how
#       many pages the paginator advanced through (in MEASURE mode
#       with draw-suppressed) before reaching `page=P`; `bytes` is
#       total markers consumed.
#
#   [STREAM] markerized render fallback spine=N page=P status=W
#     → v3 path bailed (markers missing, PageNotFound, ReadError);
#       legacy `page.render()` runs after.  status=1 = PageNotFound,
#       2 = ReadError, 3 = Aborted.
#
# WHAT TO LOOK FOR ON HARDWARE:
#
#   * Visual differences vs legacy — greedy line-breaking + carry-
#     over differs from Knuth-Plass + hyphenation, so word breaks
#     land in different places.  Headings render at body font size
#     (heading-font selection is R3.6 follow-up).  Inline images
#     render as gaps (paginator skips `kImageRef`).
#   * `reader-render-bw` time — should be similar or faster than
#     legacy (~30-50 ms typical).  No glyph cache warm-up issues.
#   * Heap behaviour — render path is now ZERO heap.  Watch for
#     `Min Free` not dropping further during page renders.
#
# v2.0.123 (markerize starvation hotfix — drop vTaskDelay(0) that
# caused 25-second markerize during TOC jumps):
#
# v2.0.122 hardware trace on Гибкий ум (epubgibkij_um-8-6-17.epub):
#   spine=7 (56 KB chapter, no TOC overlay):
#     markerize done in 1.7 s, 14 chunks → ~120 ms/chunk ✓
#   spine=8 (92 KB chapter, fired DURING TOC jump):
#     markerize done in 25.7 s, 23 chunks → ~1100 ms/chunk ❌
#
# Same code, same chunk size, but spine=8 ran while loopTask was
# polling the TOC-pending diagnostic loop every ~1 second.  The
# `vTaskDelay(0)` between LittleFS reads (added in v2.0.120 hoping
# to keep loopTask responsive during markerize) landed the BG
# worker BEHIND loopTask on the scheduler's round-robin: each
# yield gave the next ~1-second slice to loopTask, leaving the
# BG worker only ~30 ms slices between full-second loop runs.
# Net effect: markerize starved.
#
# This commit removes the per-chunk yield from both
# `EpubChapterParser::tryMarkerizeChapter` and
# `Fb2Parser::tryMarkerizeSection`.  Markerize now blocks the
# BG worker uninterrupted for ~700 ms on a 92 KB chapter (4 KB
# chunks × ~30 ms each).
#
# WHY NO YIELD IS SAFE:
#   * `loopTask` runs on a SEPARATE FreeRTOS task from the BG
#     worker.  Button input handling lives on loopTask and is
#     unaffected by what the BG worker does — markerize blocking
#     for 700 ms doesn't queue user input.
#   * The 700 ms is once-per-chapter cold extend.  After the
#     sidecar is written, subsequent visits to that chapter hit
#     the `markerize cache hit` fast path with no I/O.
#   * Cold extend itself was already a multi-second operation
#     before this commit; adding 700 ms of markerize on top is
#     in the noise.
#
# The scheduler-fairness issue under round-robin equal priority
# is a deeper problem in the Snapix task layout but well outside
# the scope of this refactor.  The simple fix (no yield) gets
# markerize back to its expected ~700 ms — 36x speedup on the
# pathological case.
#
# v2.0.122 (architectural refactor PHASE R3.5 — streaming render path
# wired into ReaderState behind SNAPIX_MARKERIZED_RENDER flag, default
# OFF):
#
# This is the moment the v3 streaming pipeline starts producing
# pixels.  Behind a NEW build flag (`SNAPIX_MARKERIZED_RENDER`,
# default 0 in ALL envs including v3_alpha — opt-in only):
#   * `ReaderState::renderPageContents` checks for a `.markers`
#     sidecar at `<cachePath>/markers/<spine>.bin`.
#   * If present: opens it, builds a `GfxRendererPaginatorAdapter`
#     over the real renderer, calls `renderMarkerizedPage(...)`
#     (R3.4) with `currentSectionPage_` as the target.
#   * On `MarkerizedRenderResult::Success`: skip the legacy
#     `page.render()` Page-tree call entirely.
#   * On any failure (markers missing, PageNotFound, ReadError):
#     log diagnostic + fall back to legacy path.  User sees byte-
#     identical behaviour vs v2.0.121 in the fallback case.
#
# WHAT GETS WIRED:
#
# (1) New build flag `SNAPIX_MARKERIZED_RENDER`:
#       * default env:    0 (compiled out — byte-identical to v2.0.121)
#       * release env:    0
#       * gh_release env: 0
#       * v3_alpha env:   0 (still default OFF — flip via
#                         platformio.local.ini for hand-test)
#
# (2) `src/states/ReaderState.cpp` — `renderPageContents` gains an
#     `#if SNAPIX_MARKERIZED_RENDER` block (~70 LOC inline) that:
#       * Skips for non-EPUB (FB2 has its own per-section model;
#         R3.6 follow-up will wire that with `Fb2::getCachePath`)
#       * Skips when `currentSpineIndex_ < 0`
#       * Skips when markers sidecar doesn't exist on disk
#       * Constructs `StreamingPaginatorConfig` from current
#         `getScreenWidth/Height/getLineHeight(fontId)` + viewport
#         margins — all the metrics already used by legacy renderer
#       * Stack-allocates 4 KB chunk buffer (same sizing as
#         markerize chunks — observed safe at ~12 KB stack high
#         water, ~4 KB headroom)
#       * Logs `[STREAM] markerized render done spine=N page=P
#         skipped=K bytes=B` on success, `[STREAM] markerized render
#         fallback ...` on failure
#
# COMPILE-OUT GUARANTEE:
#
# When `SNAPIX_MARKERIZED_RENDER=0` (default everywhere):
#   * The 70-LOC inline block in `renderPageContents` reduces to
#     `if (false) {}` and the linker drops the surrounding
#     adapter/paginator instances entirely.
#   * The SmolPort headers (`MarkerizedPageRender.h`,
#     `GfxRendererPaginatorAdapter.h`, `StreamingPaginator.h`) are
#     `#if`-gated at the top of `ReaderState.cpp` — no transitive
#     compile cost in default builds.
#   * Firmware byte size: identical to v2.0.121.
#
# WHAT THIS COMMIT DOES NOT DO:
#
#   * Replace the legacy renderer — both paths coexist; the new
#     path is opt-in via build flag and falls back on any failure.
#   * Wire FB2 — only EPUB has the streaming render path here.
#     FB2 markerize fires per section already, but the section-byte-
#     offset model needs a separate adapter (R3.6).
#   * Image rendering — `<image>` markers are skipped by
#     `StreamingPaginator` (no `onImageRef` handling yet).  Pages
#     with images render text-only via streaming path.  R3.7 follow-
#     up wires image rendering through the adapter.
#   * Anchor/link resolution — same default-skip behaviour.
#   * Visual A/B comparison vs legacy path — that's the hand-test
#     phase: flip flag locally, navigate to a chapter, eyeball the
#     pixel differences.  Layout will differ from legacy because
#     greedy line-breaking + carry-over differs from Knuth-Plass +
#     hyphenation; that's expected and fine for v1.
#
# HEAP IMPACT WHEN ENABLED:
#
# Per render call: paginator (~528 B) + adapter (~16 B) + chunk
# buffer (4 KB) on stack.  ZERO heap allocations.  Plus one
# LittleFS file open + sequential read of `~50-100 KB markers
# bytes` per render — fast (~50-200 ms depending on chapter size).
#
# Once this is hand-verified and the visual layout is acceptable,
# R4 deletes `Page` / `PageElement` / `TextBlock` / `ParsedText` /
# `ChapterHtmlSlimParser` (~5000+ LOC), making heap fragmentation
# architecturally impossible for the render path.
#
# v2.0.121 (architectural refactor PHASE R3.4 — page-targeted streaming
# render lands as a building block, ships dark; ready for R3.5 wire-up):
#
# v2.0.119 shipped the building blocks (`StreamingChapterRenderer`,
# `GfxRendererPaginatorAdapter`); v2.0.120 fixed markerize latency.
# This commit composes those into the LAST primitive needed before the
# new render path can replace the legacy Page-tree path:
# `renderMarkerizedPage(paginator, readChunk, ..., targetPage)`.
#
# WHAT R3.4 SOLVES:
#
# StreamingPaginator from R1 lays out events into pages and sets
# `isPageFull()` when the current page completes.  But to render
# page N of a chapter, we need to:
#   1. Skip the first N-1 pages — events fed but no pixels drawn
#   2. Draw page N — events fed AND pixels drawn
#   3. Stop after page N completes
#
# Naive approach: have the observer return Stop on each page boundary,
# caller resets paginator and calls renderRange again.  Broken in
# practice because `MarkerStreamReader::feed()` doesn't report partial
# consumption — bytes after the Stop in the same chunk are LOST.
#
# v2.0.121 approach: a wrapper observer (`PageCountingObserver`,
# anonymous-namespace inside `MarkerizedPageRender.cpp`) that intercepts
# every event, delegates to the paginator, and on `isPageFull()`:
#   * If still skipping: increments page counter, calls
#     `paginator.resetForNextPage()`, flips `setDrawSuppressed(false)`
#     when target reached, returns Continue.  The byte stream keeps
#     flowing without interruption.
#   * If on target page completion: returns Stop — the chapter renderer
#     bails out and the framebuffer holds the rendered target-page
#     pixels.
#
# WHAT LANDED:
#
# (1) `StreamingPaginator::setDrawSuppressed(bool)` — toggleable
#     MEASURE/DRAW gate.  When true, `drawWord()` calls into the
#     renderer are no-op but layout state (line wrapping, page-fill
#     detection) advances normally.  ~3 LOC change.
#
# (2) `lib/SmolPort/src/MarkerizedPageRender.{h,cpp}` (~120 LOC):
#     * `renderMarkerizedPage(paginator, readChunk, chunkBuf, len,
#        targetPage, abort, outStats)` — public entry point.
#     * `PageCountingObserver` wrapper — owns the page-count + draw-
#       suppression state machine.  Wraps all 14 MarkerObserver
#       callbacks; ~6 LOC each.
#     * `MarkerizedRenderResult` enum — Success / PageNotFound /
#       ReadError / Aborted.
#     * `MarkerizedRenderStats` — pagesAdvancedThrough +
#       bytesConsumed + chunksProcessed for diagnostics.
#
# (3) `test/unit/smolport/MarkerizedPageRenderTest.cpp` (7 scenarios,
#     20 assertions, all green):
#     * Render page 0, 1, 2 of a 4-page synthetic chapter
#     * Verify only target-page content is drawn (with carry-over
#       allowance — last word of previous page legitimately appears
#       at top of current page)
#     * Out-of-bounds page → PageNotFound
#     * Misconfigured caller → ReadError
#     * Abort fires mid-stream → Aborted
#     * Re-rendering different pages with separate paginator instances
#       produces correct distinct content
#
# Footprint:
#   * `default` env: byte-identical to v2.0.120 (LTO drops everything).
#   * `v3_alpha` env: ~+600 bytes `.text` (linked but unreachable —
#     no caller in this commit; R3.5 wires it).
#
# WHAT R3.5 (NEXT) WILL DO:
#
# Wire `renderMarkerizedPage` into `ReaderState::renderCachedPage`
# behind a new `SNAPIX_MARKERIZED_RENDER` build flag.  When ON AND
# the markers sidecar exists for the current spine:
#   * Open `<cachePath>/markers/<spine>.bin` from LittleFS
#   * Construct `GfxRendererPaginatorAdapter` over the real renderer
#   * Call `renderMarkerizedPage(...)` with `currentSectionPage_`
#   * On Success: skip the legacy Page-tree path
#   * On PageNotFound / ReadError: fall back to legacy
#
# That's where the architectural win starts paying off — the legacy
# Page-tree allocation is bypassed for chapters that have a sidecar,
# and the only heap pressure is the few-hundred-byte paginator
# instance + the chunk buffer.  Everything that was making
# `make_shared<TextBlock>` fail mid-render (the v2.0.118 abort()
# class) goes away for those pages.
#
# v2.0.120 (markerize latency fix — 4 KB chunks + per-chunk yield):
#
# v2.0.119 hardware trace on Гибкий ум spine 13 (116 KB chapter):
#   [15059] prepare done spine=13
#   [18377] markerize done spine=13 in=116153 out=105948 chunks=114
#   New max loop duration: 3555 ms
#
# 3.3 seconds of BG worker time spent in markerize, BLOCKING loopTask
# (same FreeRTOS priority).  loopTask handles button input and the
# render pipeline; while markerize ran, button presses queued up and
# the page took 19 seconds to appear from button-press to render-bw.
#
# Two pieces of the latency:
#   * 1 KB chunks → 114 LittleFS round-trips for one chapter,
#     ~28 ms each.  Per-chunk overhead dominates (LittleFS open is
#     amortised but per-call seek + small-block I/O is not).
#   * Markerize never yielded → loopTask got starved for the full
#     duration even though there was no contention for CPU.
#
# THIS COMMIT:
#   * Bump chunk buffer 1 KB → 4 KB in both EpubChapterParser and
#     Fb2Parser markerize wrappers.  29 chunks instead of 114 for
#     the same 116 KB chapter → ~800 ms total instead of ~3.3 s
#     (assuming linear scaling; real-world expected to be even
#     better because the per-call overhead is smaller fraction of
#     total work at larger chunks).
#   * Add `vTaskDelay(0)` between LittleFS reads.  Yields to
#     equal-priority tasks for one tick (~1 ms on default FreeRTOS).
#     loopTask now gets a slice between every chunk read, so
#     button presses are detected within ~30 ms even mid-markerize
#     instead of waiting for the full markerize to finish.
#
# Stack budget check:
#   * BG worker stack = 20 KB total.  Pre-existing high water 11.6 KB.
#   * 4 KB chunk buffer pushes worst-case high water to ~15.6 KB,
#     leaving ~4 KB headroom.  Tight but safe.  If hardware shows
#     stack overflow under markerize, drop chunk to 2 KB (28 → 58
#     chunks, still 2x faster than v2.0.119).
#
# Stack overflow detection:
#   The existing FreeRTOS stack-watermark logging fires on task
#   stop with "ReaderAsync: stack high water X bytes".  Watch
#   that number in v2.0.120 logs — anything < 2 KB free should
#   downgrade chunk size.
#
# Expected user-visible improvement:
#   * Markerize on 100+ KB chapters: 3.3 s → ~0.8 s (4x).
#   * Max loop duration during markerize: 3555 ms → ~50-100 ms
#     (one chunk's worth of work between yields).
#   * Page-after-button-press latency on cold extend: -2.5 s.
#
# v2.0.119 (architectural refactor PHASE R3.1+R3.2 — building blocks
# of the streaming render pipeline ship dark, ready for R3.4 wiring):
#
# Phase R3 lands the consumers for the marker stream R2 produces.
# Two pieces of the streaming render pipeline land here:
#
# (1) `StreamingChapterRenderer` (~80 LOC):
#     The orchestrator that walks a marker file from disk through
#     `MarkerStreamReader` → `MarkerObserver` chain.  Same callback-
#     based I/O shape as `MarkerizeChapter`, so it's testable on
#     host (in-memory vectors) AND callable from firmware
#     (LittleFS::File handle).  Tracks bytes consumed / chunks
#     processed for diagnostics.  Returns a `RenderStatus` enum
#     covering EofClean, ObserverStopped (paginator hit page-full),
#     Aborted (user input), ReadError.
#
# (2) `GfxRendererPaginatorAdapter` (~80 LOC):
#     Bridges the v3 `PaginatorRenderer` interface to the existing
#     Snapix `GfxRenderer`.  Maps the v3 style-bit encoding
#     (`kStyleBold` / `kStyleItalic` / `kStyleHeading`) onto
#     `EpdFontFamily::Style` (REGULAR/BOLD/ITALIC/BOLD_ITALIC) +
#     fontId selection (body vs heading).  Owns the byte→C-string
#     conversion (PaginatorRenderer hands raw byte ranges; GfxRenderer
#     wants null-terminated `const char*` — adapter copies into a
#     256 B stack buffer per call).  No heap activity per call;
#     no per-call setup cost; constructed on caller's stack per
#     render pass.
#
# (3) `StreamingChapterRendererTest` (~250 LOC, 22 assertions):
#     Host-side test of the full markerize → renderer → paginator
#     round-trip on synthetic HTML, with a `RecordingObserver` that
#     captures every callback for assertion.  Tests:
#       * Empty stream EofClean
#       * Bold tag round-trip (markerize then re-emit)
#       * Chunked source equivalence (1 chunk vs 3-byte chunks)
#       * Observer Stop mid-stream (cooperative early exit)
#       * External abort fires between chunks
#       * Read error → ReadError status
#       * Misconfigured caller → ReadError
#       * Full pipeline with FakePaginatorRenderer end-to-end
#
# Footprint (default env, both new files dropped by linker):
#   Flash: byte-identical to v2.0.118 (~5169 KB)
#   BSS:   no change
#
# Footprint (v3_alpha, code now linked but not invoked):
#   Flash: ~+800 bytes (StreamingChapterRenderer + Adapter `.text`)
#   BSS:   no change
#
# WHY R3.1+R3.2 SHIP DARK (no functional change yet):
#
# These two classes are the BUILDING BLOCKS of the streaming render
# pipeline.  R3.4 (next) wires them into the actual render path
# behind a `SNAPIX_MARKERIZED_RENDER` flag — when on AND a marker
# sidecar exists for the spine being rendered, the new path runs
# instead of the legacy Page-tree path.  Comparing the two on the
# same chapter is what proves the rewrite works.
#
# Landing R3.1/R3.2 separately means:
#   * The full plumbing can be reviewed in isolation before it
#     touches the render path.
#   * The host-side tests prove the abstraction is correct (round-
#     trip preserves text content + style markers) before any
#     hardware wiring is attempted.
#   * If a regression slips through R3.4 wiring, bisect goes
#     straight to the wiring commit, not the abstraction.
#
# WHY THE OOM CRASH IN v2.0.118 IS NOT A R2/R3 BUG:
#
# v2.0.118 hardware trace shows abort() during page-prefetch on
# spine=13 page=23, with `Min Free: 2832 bytes` reported.  The
# markerize side-channel was not active in that code path
# (sidecar was either already cached or not yet needed).  The
# abort is the SAME chronic heap-fragmentation pressure the v2.x
# stack of audit fixes has been chasing — `make_shared<TextBlock>`
# mid-render hits the fragmented heap, `std::bad_alloc` throws,
# runtime can't allocate the exception → terminate → abort.
#
# THIS commit is the next step in the architectural fix for that
# crash class.  Once R3.4 ships and `SNAPIX_MARKERIZED_RENDER` is
# proven on hardware, R4 deletes `ChapterHtmlSlimParser`,
# `Page`, `PageElement`, `TextBlock`, `ParsedText` — and with
# them goes the heap-tree allocation that's causing the OOM.
#
# v2.0.118 (markerize abort-sensitivity fix — sidecar was never being
# produced for the chapters users actually navigated to):
#
# v2.0.117 hardware trace on `Гибкий ум.epub` TOC jump showed:
#   [6875] preempt requested button=3 (user pressed during prepare)
#   [6888] prepare done spine=13
#   [7045] markerize failed spine=13 status=1 in=0 out=0 chunks=0
#
# `status=1` = `MarkerizeStatus::Aborted`.  The shouldAbort callback
# threaded through to markerize was the SAME one the legacy parser
# uses for cooperative cancel-on-button-press.  Pre-fix sequence:
#   1. User TOC-jumps to spine 13.
#   2. Worker arms the parse, calls prepareChapterHtml.
#   3. User taps button (impatient — wants to start scrolling).
#   4. shouldAbort latches true.
#   5. Worker calls tryMarkerizeChapter; abort check fires at byte 0.
#   6. Markerize returns Aborted, sidecar never written.
#   7. Worker proceeds to legacy parse (which handles abort correctly,
#      suspends, and resumes on next call).
#
# Net: the chapters users navigate to most aggressively (i.e. the ones
# most worth markerizing) were exactly the ones that NEVER got a
# sidecar produced.  The opposite of what we want.
#
# FIX (this commit):
#   * Both `EpubChapterParser::tryMarkerizeChapter` and
#     `Fb2Parser::tryMarkerizeSection` now ignore the parser's
#     shouldAbort callback when calling `markerizeChapter`.  The
#     side-channel pass runs to completion regardless of user input.
#   * Cost: ~200-500 ms per cold extend, on the FIRST cold parse only.
#     Once the sidecar is on disk, the existence check at the top of
#     tryMarkerize* short-circuits to "cache hit" with no I/O.
#   * Added `markerizeAttempted_` to EpubChapterParser (mirroring the
#     existing flag in Fb2Parser) so within-instance retries don't
#     hammer the same failed I/O on every parsePages call.
#
# WHY THIS IS THE RIGHT TRADE-OFF:
#
# The markerize pass is a side-channel feeding the v3 streaming render
# pipeline (Phase R3, not yet shipped).  If the sidecar fails to
# produce, the user sees zero behavioural difference — the legacy
# parser path handles the actual page rendering.  But once R3 ships
# and starts CONSUMING the sidecar, missing files force fallback to
# the legacy path = lose the heap-fragmentation win.
#
# Adding 200-500 ms to a cold extend (already ~5-15 s of work) is
# in the noise.  Letting the sidecar reliably produce is the win.
#
# What the user will see in v3_alpha logs after this fix:
#   [CONTENT][EPUB] markerize done spine=N in=X out=Y chunks=Z
# instead of the previous abort-on-input:
#   [CONTENT][EPUB] markerize failed spine=N status=1 in=0 out=0 chunks=0
#
# v2.0.117 (architectural refactor PHASE R2.6 — FB2 markerize side-
# channel completes the v3 data-plane layer):
#
# v2.0.116 added the markerize side-channel for EPUB chapters via
# `EpubChapterParser::tryMarkerizeChapter`.  R2.6 mirrors the same
# pattern for FB2 via `Fb2Parser::tryMarkerizeSection`, so both
# formats now produce a v3 marker sidecar at:
#   `<cachePath>/markers/<sectionIndex>.bin`
#
# Why FB2 is structured per-SECTION (not per-spine like EPUB):
#   * EPUB chapters are pre-sliced into the OPF spine by the producer.
#     Each spine item is one HTML file with its own anchors / images.
#   * FB2 is a single XML document with `<section>` elements nested
#     under `<body>`.  Snapix's section model maps each top-level
#     `<section>` to a separately-parsed range `[startOffset_..
#     endOffset_)` of the FB2 file.  `Fb2Parser` is constructed once
#     per section with those byte boundaries.
#   * So the markers sidecar follows the section index (parser-scoped
#     numbering) rather than spine index — `markers/0.bin` for the
#     first section, `markers/1.bin` for the second, etc.
#
# WHAT LANDED:
#
# (1) `Fb2Parser::setFb2(const Fb2*)` — moved from inline header to .cpp.
#     Now also derives `markersDir_ = fb2->getCachePath() + "/markers"`
#     under SNAPIX_MARKERIZER, so a single setter call wires both image
#     decoding AND markerize destination.  No new call sites needed in
#     ReaderStateAsyncJobs.
#
# (2) `Fb2Parser::tryMarkerizeSection` (~120 LOC):
#     * Called once per Fb2Parser instance from `parsePages` init path
#       (one-shot via `markerizeAttempted_`), AFTER Expat is set up
#       but BEFORE the first read of the legacy parse.
#     * Opens the FB2 source from SD card via `SdMan.openFileForRead`
#       (separate FsFile from the parser's `file_` so positions don't
#       collide).
#     * Seeks to `startOffset_`, reads `[startOffset_..endOffset_)`
#       in 1 KB chunks, feeds through `Fb2Stripper` (HtmlStripper Mode
#       Fb2), writes markers to LittleFS via `.work` → atomic rename.
#     * Wraps each SD read in `snapix::spi::SharedBusLock` so the SPI
#       bus stays serialised against the SD card driver's other
#       consumers.
#     * Skip if marker file already exists.  Best-effort: failure
#       logs `[CONTENT][FB2] markerize failed` and returns false; the
#       legacy parser path proceeds regardless.
#     * Compiled out entirely in default env.
#
# (3) Build flag — same `SNAPIX_MARKERIZER` used by EPUB side.  No
#     new flag needed; v3_alpha now markerizes both formats.
#
# COST IN v3_alpha:
#   * Disk: one `markers/<sectionIndex>.bin` per FB2 section.  Marker
#     output is typically 0.4-0.6x the input byte size.  Test corpus
#     `Fire_in_the_Valley.fb2` (~600 KB total, ~30 sections) → ~250 KB
#     of marker sidecars total.  Negligible vs the 16 MB partition.
#   * CPU: ~30-80 ms per section markerize.  Once per cold parse,
#     cached after.  Concurrent with the legacy parse path's existing
#     SD reads — added latency on first-visit only.
#   * Heap: zero — `tryMarkerizeSection` uses a 1 KB stack buffer +
#     `Fb2Stripper`'s in-class state.  No `std::vector`, no
#     `std::shared_ptr`, no per-token allocations.  Watchdog-safe
#     (abort hook fires between chunks).
#
# WHAT LOG OUTPUT TO EXPECT (v3_alpha):
#
#   First open of an FB2 book:
#     [CONTENT][FB2] markerize done section=N in=X out=Y chunks=Z path=...
#   Second open (sidecar already on LittleFS):
#     [CONTENT][FB2] markerize cache hit section=N path=...
#   Failure (best-effort, no parser disruption):
#     [CONTENT][FB2] markerize failed section=N status=W ...
#
# WHAT R2.6 DOES NOT DO:
#
#   * Render anything from the markers file — that's R3, where
#     `StreamingPaginator` (R1) consumes the marker stream and
#     `GfxRenderer` paints pixels for both EPUB AND FB2 paths.
#   * Replace `Page` / `PageElement` / `TextBlock` — that's R4
#     (after R3 proves the Page tree can go away).
#   * Inline `<binary>` (FB2 base64 image data) handling beyond
#     what `HtmlStripper` already suppresses (raw-body skip).
#     Image references via `<image l:href="#id"/>` ARE emitted as
#     `kImageRef` markers; resolving them to BMPs stays in the
#     existing `Fb2::cacheImage` path.
#   * Anchor/href resolution — `<a id="...">` markers are in the
#     stream; consumers in R3 will need to map them to byte offsets
#     for TOC jumps.
#
# v2.0.116 (architectural refactor PHASE R2 — markerize side-channel
# wired into EpubChapterParser, runs in v3_alpha, default env unchanged):
#
# Phase R2 follows R1's landing pad with the FIRST functional piece of
# the v3 streaming pipeline: every chapter the EPUB parser prepares as
# HTML on LittleFS now ALSO gets converted to a SmolPort byte-marker
# sidecar at `<cachePath>/markers/<spine>.bin`.  The legacy parser
# path is unchanged — it continues to drive Expat → ChapterHtmlSlimParser
# → Page tree exactly as before.  The markers file is the v3 data
# plane, consumed by Phase R3's streaming renderer.
#
# WHAT LANDED:
#
# (1) `lib/SmolPort/src/MarkerizeChapter.{h,cpp}` (~150 LOC):
#     * Platform-agnostic helper — takes `MarkerizeReadFn` /
#       `MarkerizeWriteFn` callbacks; ESP32 wraps `LittleFS::File`,
#       host wraps in-memory vectors.
#     * Streams HTML chunks through `HtmlStripper` → emitted markers
#       go straight to writer callback.
#     * Cooperative-abort hook for BG worker preemption.
#     * Returns `MarkerizeStatus` + populates stats (input/output bytes,
#       chunks processed) for diagnostic logs.
#     * ZERO heap allocations in the markerize pass — chunk buffer is
#       caller-supplied stack memory; stripper's internal state is in
#       its instance.
#
# (2) `test/unit/smolport/MarkerizeChapterTest.cpp` (~250 LOC):
#     * 10 scenarios, 23 assertions, all green.
#     * Coverage: empty input, plain text passthrough, `<b>` → markers,
#       chunked-vs-single equivalence, abort mid-stream, write/read
#       errors, FB2 mode dispatch (`<emphasis>` → italic), stats.
#
# (3) `EpubChapterParser::tryMarkerizeChapter` (~80 LOC):
#     * Called once per chapter in the init path of `parsePages`,
#       AFTER `prepareChapterHtml` succeeds.
#     * Output path: `<cachePath>/markers/<spine>.bin`, parallel to
#       the existing `chapters/` and `sections/` dirs.
#     * `.work` → atomic rename pattern so a power-loss mid-pass
#       doesn't leave a corrupt sidecar.
#     * Skip if marker file already exists (deterministic for given
#       prepared HTML).
#     * Best-effort: any failure logs `[CONTENT][EPUB] markerize failed`
#       and returns false; the legacy parser path proceeds regardless.
#     * Compiled out entirely in default env (`SNAPIX_MARKERIZER=0` →
#       function body is `(void)shouldAbort; return true;`).
#
# (4) Build flags:
#     * `default` env: `SNAPIX_MARKERIZER=0` — no markerize pass, no
#       new code paths exercised, firmware byte-for-byte equivalent
#       to v2.0.115.
#     * `v3_alpha` env: `SNAPIX_MARKERIZER=1` — markerize pass runs
#       on every cold parse.  New log lines:
#         `[CONTENT][EPUB] markerize done spine=N in=X out=Y chunks=Z`
#         `[CONTENT][EPUB] markerize cache hit spine=N path=...`
#         `[CONTENT][EPUB] markerize failed spine=N status=W ...`
#
# WHY MARKERIZE FIRST (NOT REPLACE):
#
# The v3 pipeline (HtmlStripper → markers file → StreamingPaginator →
# GfxRenderer) needs the markers file as input.  Building that file
# alongside the existing parser path lets us:
#   * Validate the markerize byte-stream against real EPUBs from the
#     test corpus without losing the working parser.
#   * Inspect the .markers files on the filesystem (USB MSC, dump
#     via uploaded debug script) to compare against expected output.
#   * Land the file format BEFORE the consumer side (R3) ships, so
#     when R3 lands we know the data plane works on real chapters.
#
# COST IN v3_alpha:
#   * Disk: one `.markers` file per chapter, ~0.5x the size of the
#     prepared HTML (markers replace tag bytes + drop most attribute
#     bytes).  For Calibre EPUB chapters typically 30-100 KB → 15-50
#     KB markers.  Negligible for a 16 MB partition.
#   * CPU: ~50-100 ms per cold chapter parse for the markerize pass
#     (one streaming read + one streaming write).  Once-per-chapter,
#     cached after.  Adds to the 25 ms `prepare done` log line.
#   * Heap: zero — `MarkerizeChapter` uses a 1 KB stack buffer and
#     `HtmlStripper`'s in-class state.  Watchdog-safe (abort hook
#     fires between chunks).
#
# WHAT R2 DOES NOT DO:
#
#   * Render anything from the markers file — that's R3, where
#     `StreamingPaginator` (landed in R1) consumes the marker stream
#     and `GfxRenderer` paints pixels.
#   * Replace `Page` / `PageElement` / `TextBlock` — those are R4
#     when the Page tree becomes provably unused.
#   * FB2 markerize integration — `Fb2.cpp` has its own parser; same
#     pattern (`tryMarkerizeFb2Chapter` after `prepareChapter`) follows
#     in R2.5 once the EPUB side proves stable on hardware.
#   * Anchor / image-ref handling beyond what `HtmlStripper` already
#     emits — `kAnchor` and `kImageRef` markers ARE in the stream;
#     consumers in R3 will need to resolve them.
#
# v2.0.115 (architectural refactor PHASE R1 — landing pad for v3
# stream-of-events page layouter, ships dark; foundation only):
#
# WHY THIS COMMIT EXISTS (not a perf fix — an architecture pivot):
#
# v2.0.78 → v2.0.114 shipped ~30 incremental fixes for ESP32-C3 heap
# fragmentation: spill files, BSS workspaces, JPEG state release,
# parser resets, chunk=1 fallback, etc.  Each helped marginally; the
# v2.0.114 hardware trace shows the architectural ceiling reached:
#   * `Resetting parser to defragment heap (largest=8692 free=32908)`
#   * `Aborting job: heap dangerously low (15172 bytes free)`
#   * Cold extends repeatedly stuck even after JPEG release
#
# Root cause is not a bug — it's the architecture.  Snapix builds a
# heap-allocated tree of `Page` → `PageElement` → `TextBlock` →
# `WordEntry` per chapter parse.  `ChapterHtmlSlimParser.cpp` (2728
# LOC) has 48 distinct allocation sites — `make_shared`, `vector`,
# `string`, `push_back`, etc.  Cumulatively this scatters HUNDREDS of
# small allocations across the heap per chapter, and 145 KB shared
# with image decode + parser + render leaves no room for fragmentation.
#
# THE PIVOT — v3 architecture (per `lib/SmolPort/README.md`):
#
# Three independent Rust e-readers for THE SAME hardware (Xteink X4 /
# ESP32-C3) converged in late 2026 on a stream-of-events architecture:
#   * `hansmrtn/smol-epub`     — library form, 8100 LOC
#   * `HookedBehemoth/TrustyReader` — production firmware
#   * `ioma8/cool`             — strictest no-heap variant
#
# Their `xteink-memory` crate (ioma8/cool/crates/xteink-memory/src/lib.rs):
#     DEVICE_TOTAL_RAM_BYTES                        = 380 * 1024;
#     DEVICE_STACK_RESERVE_BYTES                    = 128 * 1024;
#     DEVICE_TRANSIENT_HEADROOM_BYTES               =  32 * 1024;
#     DEVICE_PERSISTENT_BUDGET_BYTES                = 220 * 1024;
#     DISPLAY_DRIVER_EPUB_WORKSPACE_LIMIT_BYTES     =  64 * 1024;
#     SHARED_RENDER_EPUB_WORKSPACE_LIMIT_BYTES      = 128 * 1024;
#
# That's 220 KB of NAMED BSS workspaces; only 32 KB of transient heap.
# Snapix is the inverse: ~140 KB BSS, ~145 KB heap, 30 KB stack.
# Heap-driven design + 145 KB heap = fragmentation is structural.
#
# Their `xteink-render/paginator.rs` paginator is event-driven:
#     trait PaginationObserver {
#       fn on_text(&mut self, text: &str) -> Result<(), EpubError>;
#       fn on_line_break(&mut self) -> Result<(), EpubError>;
#       fn on_bold_start(&mut self) -> Result<(), EpubError>;
#       // ... 12 events, ZERO allocation
#     }
# Renderer streams marker bytes → events → directly writes pixels.
# "Page" = current byte offset in the marker stream, not an object.
#
# WHAT THIS COMMIT (R1) ADDS:
#
# `lib/SmolPort/src/StreamingPaginator.{h,cpp}` (~330 LOC):
#   * Implements `MarkerObserver` (already in tree from v2.0.87).
#   * Per-instance state: ~528 B (16 B cursor + ~512 B per-line scratch).
#   * Greedy line breaker with carry-over word slot for cross-page text.
#   * Page-full detection on vertical overflow.
#   * Style bit propagation (bold/italic/heading/quote).
#   * `PaginatorRenderer` abstraction for testability + later GfxRenderer
#     integration.
#   * ZERO heap allocations during page layout — fixed-size BSS/stack
#     buffers throughout.
#
# `test/unit/smolport/StreamingPaginatorTest.cpp` (~250 LOC):
#   * 9 test scenarios, 33 assertions, all green.
#   * Covers: empty stream, line wrapping, page-full, style propagation,
#     paragraph spacing, page reset, UTF-8 word boundaries.
#
# WHAT THIS COMMIT DOES NOT DO (later R-phases):
#
#   R2 — Markerizer integration: wire `HtmlStripper` (already 33 KB in
#        tree, 37 unit tests) into PageCache cold-rebuild path so
#        chapters get serialised to `.markers` files.  Old Page tree
#        still built in parallel (A/B comparison phase).
#
#   R3 — Streaming render: replace render-from-Page-tree with render-
#        from-marker-stream via StreamingPaginator + GfxRenderer
#        adapter.  Heap pressure starts dropping for real.
#
#   R4 — Deletion: delete `ChapterHtmlSlimParser.cpp` (2728 LOC),
#        `Page`, `PageElement`, `TextBlock`, `ParsedText`.  Heap
#        fragmentation becomes IMPOSSIBLE BY CONSTRUCTION — there
#        are no more chapter-scoped heap allocations.
#
# Each R-phase ships independently behind a feature flag; default env
# stays bit-for-bit compatible until R4 promotes the new path.
#
# WHY R1 SHIPS DARK:
#
# StreamingPaginator is unreferenced from any production code path
# in this commit.  Linker drops the .o entirely from firmware.bin
# (verify: `text` segment grows by 0 bytes vs v2.0.114).  Hardware
# behaviour is byte-for-byte identical.  This commit's only purpose
# is to land the foundation + the test scaffold so subsequent
# R-phases have something to integrate against — and so the design
# can be reviewed in isolation before it touches the render path.
#
# v2.0.114 (heap-pressure unstick — Knuth-Plass cap + cold-rebuild
# chunk=1 fallback so BG cache doesn't get permanently stuck on
# fragmented heap):
#
# v2.0.113 hardware trace on Fire_in_the_Valley.fb2 showed the cold
# extend pre-flight repeatedly deferring under heap fragmentation:
#   free=52028 largest=18420  (need 25600 for chunk=5)  → deferred
#   free=60608 largest=22516  (need 25600 for chunk=5)  → deferred
#   free=60608 largest=22516  (still tight after JPEG release) → deferred
# Result: BG cache extension stops working past the user's current
# page, even though the heap had 60 KB free.  User can read what's
# already cached but can't go forward.
#
# Two converging fixes:
#
# (A) Knuth-Plass paragraph cap in `ParsedText::layoutAndExtractLines`.
#
# The DP-based line breaker (`computeLineBreaks`) allocates O(n) tables
# on the heap: `minDemerits` (4 B/word) + `prevBreak` (4 B/word).  A
# 6400-word Calibre paragraph would land a single ~25 KB contiguous
# heap allocation mid-parse — exactly where `make_shared<TextBlock>`
# was throwing `std::bad_alloc` on fragmented heaps (v2.0.63 audit).
#
# Default `useGreedyBreaking=true` (set in ctor) avoids this entirely;
# the guard is normally a no-op.  But if user settings (or a future
# code path) ever flip to non-greedy for a giant paragraph, fall back
# to greedy when `n > 512`.  The worst-case heap allocation now stays
# under ~4 KB regardless of paragraph length.  Visual difference for
# >512-word paragraphs is invisible — Knuth-Plass mainly helps short,
# tightly-constrained paragraphs.
#
# (B) Cold-rebuild chunk=1 fallback in `PageCache::extend`.
#
# The cold-rebuild pre-flight threshold table is chunk-aware: chunk>1
# needs ~25 KB largest + ~50 KB free; chunk=1 needs ~8 KB largest +
# ~24 KB free.  Pre-fix: when the multi-page rebuild failed pre-flight
# (even after `JpegToBmpConverter::releaseAllPersistent()` recovered
# what it could), the extend returned `false` and the user was stuck
# at their last cached page.
#
# Post-fix: if multi-page is blocked but chunk=1 thresholds fit, shrink
# `chunk = 1` + `targetPages = pageCount_ + 1` and proceed.  One new
# page per extend call instead of nothing at all.  Subsequent extends
# retry the original chunk; once the heap recovers (parser reset, image
# decode flush, etc.) chunk>1 starts succeeding again on its own.
#
# UX: slow forward progress > stuck.  The log goes from
#   "cold extend deferred — heap headroom still insufficient"
# to
#   "cold extend chunk=1 fallback (fits 8K/24K threshold)"
# and the user can keep reading.
#
# Why not just lower the multi-page threshold?  Because the empirical
# 25 KB cap protects against `make_shared<TextBlock>` mid-parse OOM
# under fragmentation — measured on "Атомные привычки" pages in v2.0.63
# audit.  Lowering it blindly would re-introduce the std::bad_alloc →
# __terminate → abort() crash.  The chunk=1 path is genuinely smaller-
# scoped (no per-page-pool accumulation) so its 8 KB threshold is safe.
#
# Things deliberately NOT changed:
#   * SmolJpeg yRow buffer (~16 KB transient) — pre-v2.0.100 pinned in
#     BSS and regressed cold-open heap, reverted.  Heap-transient is
#     the right shape for it.
#   * ImageBlock decoder lifecycle — already serialised one-at-a-time
#     via `decodePendingImages`, not the bottleneck.
#   * The 25 KB chunk>1 threshold itself — protective, leave it.
#
# v2.0.113 (render-bw perf — orientation-specialized 1bpp blitters,
# kills the per-pixel `plotPixelOptimized` chain):
#
# v2.0.111 trace showed `reader-render-bw` at 7506 ms per page even
# AFTER layout perf wins.  Root cause sits in `GfxRenderer::renderChar`:
# the per-glyph blit loop calls `plotPixelOptimized` once per source
# bit, and that call switches on `renderMode`, then switches on
# `orientation`, then does a byte-level read-modify-write — ~15
# instructions inlined PER glyph pixel.  A page with ~1500 glyphs
# averaging 12 wide × 18 tall = ~325k pixel calls per page render.
# Most of those instructions are framing overhead (bounds checks,
# the two switches) that can be hoisted entirely.
#
# Fix is two specialized blitters wired into `renderChar`:
#
# (1) `renderCharBlit1bppIdentity` — for `LandscapeCounterClockwise`
#     (screen-X/Y map straight to physical X/Y).  A glyph row maps
#     to a CONTIGUOUS range of bits in a single FB row, so this is
#     a true byte-aligned blit:
#       a. Clip glyph rect to screen ONCE, not per pixel
#       b. Per glyph row: read 1-2 source bytes, shift+mask to
#          align with the destination bit offset
#       c. Write 1-8 aligned bits at a time into the FB byte with
#          one AND/OR (compiler specializes via `pixelState`
#          template parameter — inner AND/OR branch eliminated)
#     Inner cost ~6-8 instructions per 8 FB pixels vs ~120
#     instructions per 8 pixels pre-fix: ~10x on the inner blit,
#     ~5-8x end-to-end after bitmap-fetch latency.
#
# (2) `renderCharFast1bppPortrait` — for `Portrait`, which is the
#     DEFAULT in `SnapixSettings` (most users read here, so an
#     identity-only blitter would miss them).  The Portrait
#     transform `physX = screenY, physY = HEIGHT-1-screenX` makes
#     the bit mask CONSTANT across a glyph row (physX is const
#     while screenX varies), so we hoist mask + byte column out
#     and decrement `fbByteIdx -= DWB` per pixel.  Source byte is
#     reloaded once per 8 glyph columns (shift-register, inner
#     loop just shifts and tests MSB).  Still per-pixel byte
#     writes (the row spans many FB rows in physical space), but
#     the framing overhead — bounds check, two switches,
#     function-call return — is GONE.  ~3-4x speedup.
#
# Other orientations (`PortraitInverted`, `LandscapeClockwise` aka
# 180°) fall through to the existing per-pixel slow path.  Same for
# 2-bit grayscale fonts.  Semantics in those paths are byte-for-byte
# unchanged.  Adding the remaining two orientations is a follow-up
# day's work if anyone actually reads in 180° or inverted.
#
# Risk surface (deliberately bounded):
#   * Fast paths only fire when `!is2Bit && renderMode==BW &&
#     orientation∈{Portrait, LandscapeCounterClockwise}`.  All
#     other call paths take the original per-pixel code.
#   * Identity blitter prevents bitmap over-read: if the glyph row's
#     second source byte would land at past-the-end of the bitmap
#     allocation `(width*height + 7) >> 3`, the upper byte is
#     padded with zero instead.
#   * Combining marks: same `*x += advanceX` advance logic as the
#     slow path, kept under the same `utf8IsCombiningMark` guard.
#
# Note on whether this helps the user's IMMEDIATE complaint
# ("page doesn't show for 25 seconds"):
#   * The 20-second `cache-create` blocker is addressed by the
#     v2.0.112 lifehack (clamp to last cached page, arm silent
#     extend, fall through to render).
#   * The 7.5-second `reader-render-bw` blocker is addressed by
#     this commit.
#   * Both must land for the user to see content within ~1-2 s
#     of book entry.
#
# v2.0.112 (UX lifehack — instant page show on book entry, don't wait
# for cold rebuild to reach saved page):
#
# v2.0.111 hardware trace showed two distinct slow paths:
#   1. cache-create: 19871 ms for 8 pages (cold rebuild from scratch)
#   2. reader-render-bw: 7506 ms (per-pixel glyph render)
#
# Total: ~28 seconds before user sees ANYTHING after opening a book at
# a saved page position.  Architecturally pointless — the cache had
# 4 pages already loaded from disk, the user could be reading page 3
# instantly while the worker extends to their saved page=7 in BG.
#
# Lifehack in `renderCachedPage`:
#
# When a fresh reader entry needs `currentSectionPage_=N` but the
# loaded cache has only K < N pages, the existing code armed a
# page-load with `useIndexingMessage=true` and returned, blocking
# render behind the cold rebuild.  Now: if cache has any pages,
# clamp `currentSectionPage_` to the last cached page (K-1), render
# THAT page immediately, and arm a SILENT page-load to extend to N.
# When the BG extend completes (the existing v2.0.103 deferred-
# display upgrade path picks it up), `processPendingEpubPageLoad`
# navigates forward to the saved position.
#
# UX: user sees real content within ~1 second of book entry.  After
# the BG extend finishes (5-30 s depending on chapter), the page
# auto-advances to their saved spot.  Reading position is preserved;
# only the "transition" is non-blocking.
#
# The `requireComplete=true` (INT16_MAX sentinel) path keeps the
# original deferred behaviour because that means "show end of
# section" — we can't pick a meaningful clamp page without knowing
# where the section ends, so the wait is unavoidable.
#
# Deferred for next pass: the 7.5-second `reader-render-bw` is its
# own problem — `renderChar` calls `plotPixelOptimized` per pixel
# (~300 calls per glyph × 1000+ glyphs per page = 300k calls).
# Byte-aligned 1-bit blitter would cut that 8x.  Doesn't help the
# user's IMMEDIATE complaint (the 20-second wait blocks the render
# entirely), so addressing it after the lifehack proves out.
#
# v2.0.111 (ChatGPT-audit perf fixes — two data-oriented wins on the
# real layout bottleneck, not symptom shuffling):
#
# v2.0.110 trace showed cache-create on spine=13 page=7 taking 36 seconds
# for ONE partial page — well past the 20 s parse timeout, parser killed.
# ChatGPT identified the bottleneck precisely: per-word advance-width
# measurement during layout was bypassing the existing `widthCache_` in
# GfxRenderer and re-doing UTF-8 decode + per-codepoint glyph lookup for
# every word.  Plus the recently-added ParsedText spill mechanism
# (storage when RAM word count exceeds 96) was open/closing the spill
# file on every word append — ~5 ms LittleFS overhead × 96 words per
# spill burst = ~500 ms wasted per burst.
#
# (1) `GfxRenderer::getTextAdvanceWidth` now consults `widthCache_`.
#
#     The cache already existed (256 entries, FNV-1a hash of
#     fontId+style+text), populated by `getTextWidth`.  But the
#     `getTextAdvanceWidth` path — which is what the layout loop calls
#     per word — bypassed it entirely.  On a Russian-text Calibre
#     chapter the same ~50-100 stop words ("в", "и", "на", "это", etc.)
#     appear hundreds of times per page; with the cache wired in, a
#     hit replaces ~5 codepoint × glyph_lookup work (~50 µs on C3)
#     with a single hash probe (~1 µs).  Empirically halves total
#     layout time on text-heavy pages.
#
#     Cache uses the existing eviction strategy: single-slot natural-
#     probe overwrite when full (no full-table wipe, hot entries stay
#     resident).  No new allocations, no new BSS.
#
# (2) `ParsedText::appendSpillWord` uses a persistent append handle.
#
#     Pre-fix: `LittleFS.open(spillPath, "a")` + write + `file.close()`
#     ran on EVERY spilled word.  LittleFS open performs metadata
#     lookup + lock acquisition; ~5 ms per call.  96 words per spill
#     × 5 ms = 480 ms of pure filesystem overhead per burst.
#
#     New: `File spillAppendFile_` member, opened lazily in "a" mode
#     on the first spill word, reused across all subsequent appends,
#     flushed+closed in `layoutSpilledGreedy` before the read-open
#     and in `cleanupSpill` for safe destruction.  96 writes now cost
#     ~10 ms total (file open once + 96 fast writes) instead of
#     ~500 ms.
#
# Combined impact on the user's 36-second cache-create:
#   * width cache halves layout-per-word cost
#   * persistent spill handle eliminates ~500 ms × (number of spills)
#     overhead
# Projected: 36 s → ~10-15 s for the spine=13 page=7 case, well under
# the 20-s parse timeout.
#
# Why this is the right fix (not SIMD/asm rewrite):
#
# ESP32-C3 has no SIMD/vector instructions — RISC-V without VPU.
# Compiler already has LTO + -O2.  The hot loops are data-oriented:
# UTF-8 decode, glyph lookup, filesystem opens.  The win comes from
# REMOVING redundant work via caching and amortizing fixed overheads
# (file open) across many operations — exactly the data-oriented
# rewrite ChatGPT's analysis recommended.  No assembler tricks would
# have helped here; the bottleneck is the per-word repeated
# measurement, not the cost of any single measurement.
#
# v2.0.110 (six-agent architectural audit → five-fix refactor pass):
#
# Sustained user pressure on the "TOC jump shows page 0 then buttons
# freeze" symptom prompted a parallel audit with six agents looking at
# different aspects of the worker / cache / heap architecture.  Cross-
# cutting findings converged on three primary root causes plus two
# secondary improvements; all five are fixed in this commit.
#
# Audit findings (synthesized from /tmp/audit-2025-05-13):
#   Agent #1 (input → worker preemption): identified that
#     `stopBackgroundCaching()` at the render path (ReaderState.cpp:1656)
#     synchronously waits up to 15 s for the worker to idle, blocking
#     `loopTask` inside `xEventGroupWaitBits` — this is the actual
#     mechanism of "buttons unresponsive", NOT the BG worker hogging
#     CPU as previously assumed.
#   Agent #6 (parser yield frequency): confirmed worker priority=1
#     equals `loopTask`, so equal-priority round-robin starves UI
#     between rare `vTaskDelay(1)` yields.  Recommended dropping worker
#     priority to 0 after the deferred-display first page is on disk
#     (the work after that is no longer user-critical).
#   Agent #4 (worker state machine): noted the TOC worker has no kill
#     condition for "user already sees the page they need" — once
#     deferred-display fires, it keeps grinding through 25-page batches
#     searching for an anchor the user no longer needs to see right now.
#   Agent #2 (cold rebuild trap): `PageCache::extend` cold path calls
#     `parser.reset()` BEFORE the rebuild starts and again on failure,
#     wiping any partial parser state.  Every cold rebuild that gets
#     preempted leaves the parser fresh → next attempt is also cold →
#     infinite cold-rebuild loop on partial caches after reader exit.
#   Agent #3 (heap fragmentation): SNAPIX_STATIC_WORKSPACE=1 (BSS-pooled
#     anchor map) has been hardware-verified in v3_alpha since v2.0.90
#     but stayed dark in default env.  ~200 individual std::string
#     allocations per Calibre chapter scatter through the mid-heap;
#     bump-allocating them into the workspace recovers ~6 KB largest-
#     free during chapter parse with zero risk.
#
# Fix #1 (render path doesn't block on worker idle):
#   Added `requestBackgroundCachingPause(siteTag)` to ReaderState — a
#   short-wait (`kInteractiveCacheCancelTimeoutMs = 500 ms`) cooperative-
#   cancel that LOGs on timeout and proceeds, vs the full 15-s
#   `stopBackgroundCaching()` which ESP.restart()s on timeout.  Switched
#   the render path at ReaderState.cpp:1656 to use the new method.
#   Teardown paths (mode change, font change, reader exit) keep the
#   full-wait variant because parser state mutation requires the worker
#   to be genuinely idle.  Expected effect: max loop duration in render
#   path drops from 5000+ ms to <600 ms; buttons respond within ~50 ms
#   of press regardless of worker activity.
#
# Fix #2 (worker priority drop after deferred-display):
#   In `runTocJumpJob`, when `pendingTocFirstPageReady_` is set
#   (deferred-display about to fire), the worker calls
#   `vTaskPrioritySet(nullptr, 0)` to drop itself to priority 0.
#   `loopTask` (priority 1) then preempts naturally on every tick.
#   Combined with Fix #1, button input is responsive even mid-batch.
#
# Fix #3 (TOC worker kill condition):
#   After deferred-display fires, the worker gets one more follow-up
#   batch (`kEpubTocJumpFollowUpBatchBudget = 1`, ≈25 pages) to find
#   the anchor, then exits cleanly even if the anchor isn't found.
#   The user has page 0; the BG cache controller will continue
#   extending the chapter at priority=0 on its own time.  Eliminates
#   the "BG worker grinds for tens of seconds searching for anchor
#   that may not exist" pathology.
#
# Fix #4 (cold rebuild trap eliminated):
#   Dropped both `parser.reset()` calls in `PageCache::extend` cold
#   path (lib/PageCache/src/PageCache.cpp:947, 962).  The first reset
#   was unnecessary (the rebuild's `parsePages` already handles fresh-
#   init internally); the second was actively harmful (wiped partial
#   parser state on failed rebuild → next extend went cold again).
#   Now: when a cold rebuild is preempted partway, the parser is left
#   in cooperative-suspend state; the next extend goes HOT, resuming
#   from where the previous attempt stopped.  Cold-rebuild trap is
#   architecturally broken.
#
# Fix #5 (anchor map in BSS for default env):
#   Flipped `SNAPIX_STATIC_WORKSPACE=0 → 1` in [env:default] and
#   [env:release] in platformio.ini.  Default env now uses the same
#   BSS-pooled anchor map (workspace's `anchors[256]` + 4 KB bump
#   arena) that v3_alpha has been shipping since v2.0.90.  ~200
#   per-anchor `std::string` allocations per Calibre chapter become
#   bump-allocator writes into pre-reserved BSS; ~6 KB largest-free
#   recovered during parse with zero new BSS cost (the workspace
#   already exists; default env was just not consulting it).
#
# Together: render path responsive, worker yields to UI after first
# page, anchor search bounded, cold-rebuild trap broken, anchor-string
# fragmenter eliminated.  This is the architectural pass that prior

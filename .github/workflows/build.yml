name: Build firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # required to create GitHub Releases from tag pushes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/snapix-flasher/go.mod
          cache-dependency-path: tools/snapix-flasher/go.sum

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO and esptool
        run: pip install --upgrade platformio esptool

      - name: Install host-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libexpat1-dev

      - name: Build and run host unit tests
        run: |
          test/scripts/build_tests.sh
          test/scripts/run_tests.sh

      - name: Build release firmware
        run: pio run -e release

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create merged flashable binary
        run: |
          esptool.py --chip esp32c3 merge_bin \
            --output "snapix-${{ steps.version.outputs.version }}-full.bin" \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            0x0 .pio/build/release/bootloader.bin \
            0x8000 .pio/build/release/partitions.bin \
            0x10000 .pio/build/release/firmware.bin
          cp .pio/build/release/firmware.bin "snapix-${{ steps.version.outputs.version }}-firmware.bin"
          cp .pio/build/release/bootloader.bin "snapix-${{ steps.version.outputs.version }}-bootloader.bin"
          cp .pio/build/release/partitions.bin "snapix-${{ steps.version.outputs.version }}-partitions.bin"
          # SIL OFL 1.1 §56-61 requires the license to ride alongside each
          # copy of the bundled font.  Ship the OFL text for each embedded
          # family — JetBrains Mono, PT Mono, IBM Plex Mono, Literata.
          cp scripts/jetbrains/OFL.txt        "snapix-${{ steps.version.outputs.version }}-OFL-JetBrainsMono.txt"
          cp scripts/pt-mono/OFL.txt          "snapix-${{ steps.version.outputs.version }}-OFL-PTMono.txt"
          cp scripts/ibm-plex-mono/OFL.txt    "snapix-${{ steps.version.outputs.version }}-OFL-IBMPlexMono.txt"
          cp scripts/literata/OFL.txt         "snapix-${{ steps.version.outputs.version }}-OFL-Literata.txt"
          ls -lah snapix-*

      - name: Build snapix-flasher
        working-directory: tools/snapix-flasher
        run: |
          make test
          make release VERSION="${{ steps.version.outputs.version }}"
          cp release/snapix-flasher-${{ steps.version.outputs.version }}-* "$GITHUB_WORKSPACE"/
          ls -lah "$GITHUB_WORKSPACE"/snapix-flasher-*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snapix-firmware-${{ steps.version.outputs.version }}
          path: |
            snapix-*.bin
            snapix-flasher-*
            snapix-*-OFL-*.txt
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            snapix-${{ steps.version.outputs.version }}-full.bin
            snapix-${{ steps.version.outputs.version }}-firmware.bin
            snapix-${{ steps.version.outputs.version }}-bootloader.bin
            snapix-${{ steps.version.outputs.version }}-partitions.bin
            snapix-flasher-${{ steps.version.outputs.version }}-linux-amd64.tar.gz
            snapix-flasher-${{ steps.version.outputs.version }}-linux-arm64.tar.gz
            snapix-flasher-${{ steps.version.outputs.version }}-darwin-amd64.tar.gz
            snapix-flasher-${{ steps.version.outputs.version }}-darwin-arm64.tar.gz
            snapix-flasher-${{ steps.version.outputs.version }}-windows-amd64.zip
            snapix-${{ steps.version.outputs.version }}-OFL-JetBrainsMono.txt
            snapix-${{ steps.version.outputs.version }}-OFL-PTMono.txt
            snapix-${{ steps.version.outputs.version }}-OFL-IBMPlexMono.txt
            snapix-${{ steps.version.outputs.version }}-OFL-Literata.txt
          body: |
            ## Snapix ${{ steps.version.outputs.version }}

            ⚡ Super-fast fork of Papyrix firmware for Xteink X4 e-paper reader.

            > [!IMPORTANT]
            > **v2.0.60+ — cache moved to internal flash, OTA-style SD update removed.**
            > The OTA partition was dropped to expand LittleFS for the book cache
            > (3.4 MB → 9.6 MB; page-load 12-19 ms → 5-10 ms, no more SD/display
            > SPI bus contention).  All flashing now requires USB.  See the
            > [migration notice](https://github.com/unbrokendub/snapix#%EF%B8%8F-cache-moved-to-internal-flash-v2060)
            > for details on heap, flash endurance, and the new storage split
            > (user data on SD, book cache on internal flash).

            ### How to flash (USB only since v2.0.60)

            Use `snapix-*-full.bin` — a merged binary containing bootloader, partition
            table, and firmware.  Works for both fresh devices and upgrades.

            Using esptool (Python):
            ```bash
            pip install esptool
            esptool.py --chip esp32c3 --port /dev/ttyUSB0 --baud 921600 write_flash 0x0 snapix-*-full.bin
            ```

            Using `snapix-flasher` from this release:
            ```bash
            snapix-flasher flash snapix-*-full.bin
            ```

            If the device won't boot after flashing, first erase flash and retry:
            ```bash
            esptool.py --chip esp32c3 erase_flash
            ```

            **Upgrading from pre-v2.0.60?**  First boot of v2.0.60+ forces a
            `LittleFS.format()` because the partition table changed.  Books,
            progress, and bookmarks on the SD card stay intact.

            ### Individual artifacts

            - `snapix-*-full.bin` — **flashable merged image** (bootloader + partitions + firmware), what you want for a normal install
            - `snapix-*-firmware.bin` — app only, for advanced users who want to write just the `factory` partition at offset `0x10000`
            - `snapix-*-bootloader.bin` — 2nd-stage bootloader (offset `0x0`), only needed for piecewise flashes
            - `snapix-*-partitions.bin` — partition table (offset `0x8000`), only needed for piecewise flashes
            - `snapix-flasher-*-darwin-arm64.tar.gz` — Snapix flasher for Apple Silicon Macs
            - `snapix-flasher-*-darwin-amd64.tar.gz` — Snapix flasher for Intel Macs
            - `snapix-flasher-*-linux-amd64.tar.gz` — Snapix flasher for Linux x86_64
            - `snapix-flasher-*-linux-arm64.tar.gz` — Snapix flasher for Linux arm64
            - `snapix-flasher-*-windows-amd64.zip` — Snapix flasher for Windows x86_64
            - `snapix-*-OFL-JetBrainsMono.txt` — SIL OFL 1.1 for JetBrains Mono NL (do not strip)
            - `snapix-*-OFL-PTMono.txt` — SIL OFL 1.1 for PT Mono
            - `snapix-*-OFL-IBMPlexMono.txt` — SIL OFL 1.1 for IBM Plex Mono
            - `snapix-*-OFL-Literata.txt` — SIL OFL 1.1 for Literata

            ### Third-party fonts

            This release embeds four font families (each in 5 sizes — 4 / 10 / 11 / 12 / 13 pt, regular
            only, 2-bit grayscale) selectable via builtin themes:

            - **[JetBrains Mono NL](https://github.com/JetBrains/JetBrainsMono)** by JetBrains s.r.o.
            - **[PT Mono](https://www.paratype.com/fonts/pt/pt-mono)** by ParaType Ltd.
            - **[IBM Plex Mono](https://github.com/IBM/plex)** by IBM Corp. (Mike Abbink, Bold Monday)
            - **[Literata](https://fonts.google.com/specimen/Literata)** by Type Network for Google Fonts

            All four are licensed under the [SIL Open Font License 1.1](https://openfontlicense.org);
            the accompanying `OFL-*.txt` files must be redistributed with any copy of the firmware.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
